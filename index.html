<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d14">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Party Box">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Party Box</title>
<style>

:root{--bg:#0b0d14;--tx:#f4f5fa;--mu:#8f96ab;--red:#ff2e4d;--red2:#ff7a45;--gold:#ffc83d;--ok:#35e0a1;--glass:rgba(255,255,255,.06);--line:rgba(255,255,255,.1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:"Inter",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.bg i{position:absolute;width:55vmax;height:55vmax;border-radius:50%;filter:blur(90px);opacity:.38;animation:drift 18s ease-in-out infinite alternate}
.bg i:nth-child(1){background:var(--b1);left:-20vmax;top:-18vmax}
.bg i:nth-child(2){background:var(--b2);right:-22vmax;top:25vh;animation-delay:-6s}
.bg i:nth-child(3){background:var(--b3);left:10vw;bottom:-30vmax;animation-delay:-11s;opacity:.25}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}
main{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:18px 16px 60px}
.screen{animation:in .5s cubic-bezier(.2,.9,.3,1) both}
@keyframes in{from{opacity:0;transform:translateY(22px) scale(.98)}to{opacity:1;transform:none}}
.logo{display:flex;align-items:center;gap:12px;margin:10px 0 4px}
.logo h1{margin:0;font-size:40px;font-weight:900;letter-spacing:-1.5px;background:linear-gradient(100deg,#fff 30%,var(--red2) 70%,var(--red));-webkit-background-clip:text;background-clip:text;color:transparent}
.rc{width:34px;height:48px;border-radius:7px;background:linear-gradient(145deg,var(--red2),var(--red));box-shadow:0 0 28px rgba(255,46,77,.7);transform:rotate(-12deg);animation:wob 3.2s ease-in-out infinite}
@keyframes wob{50%{transform:rotate(10deg) translateY(-4px)}}
h2{margin:0 0 12px;font-size:20px}
p{color:var(--mu);line-height:1.5}
.card{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:22px;padding:20px;margin:14px 0;box-shadow:0 14px 40px rgba(0,0,0,.35)}
.q{font-size:24px;font-weight:750;line-height:1.28;letter-spacing:-.4px}
.unit{color:var(--gold);font-weight:700}
.sm{font-size:13px;color:var(--mu)}
button{font:inherit;border:0;border-radius:16px;padding:16px;background:linear-gradient(135deg,var(--g1,var(--red2)),var(--g2,var(--red)));color:#fff;font-weight:750;width:100%;margin-top:12px;cursor:pointer;position:relative;overflow:hidden;box-shadow:0 8px 26px rgba(255,46,77,.38);transition:transform .15s,box-shadow .2s,filter .2s}
button:hover{filter:brightness(1.1);box-shadow:0 10px 34px rgba(255,46,77,.55)}
button:active{transform:scale(.97)}
button.sec{background:var(--glass);border:1px solid var(--line);box-shadow:none}
button::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);animation:shine 3.4s infinite}
button.sec::after{display:none}
@keyframes shine{0%,60%{left:-60%}100%{left:130%}}
input{font:inherit;width:100%;padding:15px 16px;border-radius:14px;border:1.5px solid var(--line);background:rgba(0,0,0,.35);color:var(--tx);margin-top:10px;transition:border-color .2s,box-shadow .2s}
input:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 4px rgba(255,46,77,.2)}
input.num{font-size:34px;font-weight:800;text-align:center;letter-spacing:-1px}
.row{display:flex;gap:8px}
.row button{margin-top:10px}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.err{color:var(--red2);font-size:14px;margin-top:8px;min-height:18px}
.prog{height:5px;border-radius:9px;background:var(--line);overflow:hidden;margin:6px 0 2px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--g1,var(--red2)),var(--g2,var(--red)));border-radius:9px;transition:width .6s}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:850;font-size:18px;color:#fff;flex:none;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.av.l{width:92px;height:92px;font-size:40px;margin:0 auto 14px;animation:pop .6s cubic-bezier(.3,1.6,.5,1) both,float 3s 0.6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes pop{from{transform:scale(0) rotate(-40deg)}to{transform:none}}
.hand{text-align:center;padding:34px 18px}
.big{font-size:34px;font-weight:850;letter-spacing:-1px;margin:4px 0}
.opt{display:flex;align-items:center;gap:14px;text-align:left;background:var(--glass);border:1px solid var(--line);box-shadow:none;padding:12px 14px;opacity:0;animation:in .45s both;animation-delay:calc(var(--k)*70ms)}
.opt:hover{border-color:var(--red);background:rgba(255,46,77,.12);box-shadow:none}
.opt::after{display:none}
.opt.sel{background:linear-gradient(135deg,var(--red2),var(--red));animation:sel .35s both}
@keyframes sel{50%{transform:scale(1.04)}to{opacity:1;transform:scale(1)}}
.opt span{font-weight:700;font-size:18px}
.res{opacity:0;animation:rowin .6s cubic-bezier(.2,.9,.3,1) both;animation-delay:var(--d);padding:12px;border-radius:16px;margin:8px 0;background:rgba(255,255,255,.04);border:1px solid var(--line)}
@keyframes rowin{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}
.res.best{border-color:var(--gold);box-shadow:0 0 30px rgba(255,200,61,.35);animation:rowin .6s var(--d) both,glow 1.6s 1.2s ease-in-out infinite alternate}
@keyframes glow{to{box-shadow:0 0 46px rgba(255,200,61,.6)}}
.res.worst{border-color:var(--red);animation:slam .7s var(--d) both}
@keyframes slam{0%{opacity:0;transform:scale(2.4) rotate(-6deg)}60%{opacity:1;transform:scale(.95)}80%{transform:scale(1.03)}100%{opacity:1;transform:none;box-shadow:0 0 34px rgba(255,46,77,.5)}}
.rh{display:flex;align-items:center;gap:12px}
.rh .nm{flex:1;font-weight:750}
.gain{font-size:22px;font-weight:900;color:var(--ok);animation:pop .5s calc(var(--d) + .5s) cubic-bezier(.3,1.6,.5,1) both}
.gain.z{color:var(--mu)}
.dev{height:8px;background:rgba(255,255,255,.08);border-radius:9px;overflow:hidden;margin:9px 0 6px}
.dev i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#6c7bff,#9b6cff);width:0;animation:grow 1s calc(var(--d) + .2s) cubic-bezier(.2,.9,.3,1) forwards}
.best .dev i{background:linear-gradient(90deg,var(--gold),#fff0b3)}
.worst .dev i{background:linear-gradient(90deg,var(--red2),var(--red))}
@keyframes grow{to{width:var(--w)}}
.tag{display:inline-block;font-size:11px;font-weight:850;letter-spacing:.5px;text-transform:uppercase;padding:3px 9px;border-radius:99px;margin-left:6px;vertical-align:2px}
.tag.b{background:var(--gold);color:#2a1d00}
.tag.w{background:var(--red);color:#fff;animation:pulse 1.2s infinite}
.tag.t{background:rgba(53,224,161,.18);color:var(--ok)}
.tag.x{background:rgba(255,255,255,.08);color:var(--mu)}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(255,46,77,0);transform:scale(1.07)}0%{box-shadow:0 0 0 0 rgba(255,46,77,.6)}}
.ans{text-align:center}
.ans .num{font-size:52px;font-weight:900;color:var(--ok);letter-spacing:-2px;text-shadow:0 0 36px rgba(53,224,161,.5)}
.sb{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:15px}
.sb .nm{width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb .bar{flex:1;height:10px;border-radius:9px;background:rgba(255,255,255,.07);overflow:hidden}
.sb .bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--gold),var(--red2));transition:width 1s cubic-bezier(.2,.9,.3,1)}
.sb .pt{width:78px;text-align:right;font-weight:750}
.late{opacity:0;animation:in .5s var(--d) both}
.crown{font-size:64px;text-align:center;animation:pop .8s .2s cubic-bezier(.3,1.6,.5,1) both,float 2.6s 1s ease-in-out infinite}
.win{text-align:center}
.win .big{font-size:42px;background:linear-gradient(100deg,var(--gold),#fff,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
details{color:var(--mu);font-size:14px;line-height:1.6}summary{cursor:pointer;margin-bottom:6px;font-weight:650;color:var(--tx)}
canvas#fx{position:fixed;inset:0;z-index:50;pointer-events:none}
.flash{position:fixed;inset:0;z-index:40;background:radial-gradient(circle,rgba(255,46,77,.5),transparent 70%);pointer-events:none;animation:fl .8s forwards}
@keyframes fl{from{opacity:1}to{opacity:0}}
body.quake main{animation:quake .5s}
@keyframes quake{20%{transform:translate(-9px,5px)}40%{transform:translate(8px,-6px)}60%{transform:translate(-6px,-4px)}80%{transform:translate(5px,6px)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important}}
.back{width:auto;padding:9px 15px;margin:0 0 2px;font-size:14px;border-radius:12px}
.tile{display:block;text-align:left;padding:24px 22px;margin:16px 0;border-radius:24px;min-height:136px;animation:in .6s both;animation-delay:calc(var(--k)*120ms);background:linear-gradient(135deg,#ff7a45,#ff2e4d)}
.tile.t2{background:linear-gradient(135deg,#8f6cff,#3f7bff);box-shadow:0 8px 30px rgba(95,110,255,.45)}
.tile .te{display:block;font-size:44px;margin-bottom:6px;animation:float 3s ease-in-out infinite}
.tile b{font-size:28px;letter-spacing:-.8px;display:block}
.tile small{font-size:14px;opacity:.85}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;border-radius:99px;border:1px solid var(--line);background:var(--glass);font-size:14px;font-weight:650;cursor:pointer;transition:all .2s;user-select:none}
.chip.on{background:linear-gradient(135deg,#8f6cff,#3f7bff);border-color:transparent;box-shadow:0 4px 16px rgba(95,110,255,.5);transform:scale(1.04)}
.violet{background:linear-gradient(135deg,#8f6cff,#3f7bff)!important;box-shadow:0 8px 26px rgba(95,110,255,.45)!important}
.reel{font-size:84px;margin:6px 0;transition:transform .1s}
.reel.hit{animation:pop .6s cubic-bezier(.3,1.8,.5,1)}
.ringw{position:relative;width:150px;height:150px;margin:6px auto 14px}
.ringw svg{width:100%;height:100%}
.rbg{fill:none;stroke:rgba(255,255,255,.1);stroke-width:9}
.rfg{fill:none;stroke:url(#grd);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .12s linear}
.ringw.hot .rfg{stroke:var(--red)}
.ringw.hot .rt{color:var(--red2);animation:hb .5s infinite}
@keyframes hb{50%{transform:translate(-50%,-50%) scale(1.18)}}
.rt{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:44px;font-weight:900}
.word{background:linear-gradient(145deg,rgba(143,108,255,.28),rgba(63,123,255,.18));border:1px solid rgba(143,108,255,.5);border-radius:24px;padding:30px 14px;text-align:center;margin:8px 0 4px;box-shadow:0 0 40px rgba(110,100,255,.28)}
.word small{display:block;color:var(--mu);font-size:13px;margin-bottom:10px;letter-spacing:.5px}
.word span{font-size:38px;font-weight:900;letter-spacing:-1px;line-height:1.1;word-break:break-word}
.flipin{animation:flipin .45s cubic-bezier(.2,.9,.3,1)}
@keyframes flipin{from{opacity:0;transform:perspective(500px) rotateX(-70deg) scale(.9)}to{opacity:1;transform:none}}
.ok{background:linear-gradient(135deg,#35e0a1,#17b87a)!important;box-shadow:0 8px 26px rgba(53,224,161,.4)!important;font-size:19px}
.pk{position:fixed;inset:0;z-index:30;background:rgba(5,6,12,.78);backdrop-filter:blur(8px);display:flex;align-items:flex-end;justify-content:center;animation:fi .2s}
@keyframes fi{from{opacity:0}}
.pk>div{width:100%;max-width:520px;background:#161926;border-radius:26px 26px 0 0;padding:20px 16px 28px;animation:up .35s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(100%)}}
.twc{display:inline-block;padding:6px 12px;border-radius:99px;background:rgba(143,108,255,.2);border:1px solid rgba(143,108,255,.5);font-size:13px;font-weight:700}
.wheelw{position:relative;width:min(300px,80vw);aspect-ratio:1;margin:18px auto 14px}
.wheelw canvas{width:100%;height:100%;display:block;border-radius:50%;box-shadow:0 0 50px rgba(143,108,255,.45)}
.ptr{position:absolute;left:50%;top:-12px;transform:translateX(-50%);width:0;height:0;border-left:15px solid transparent;border-right:15px solid transparent;border-top:30px solid #fff;filter:drop-shadow(0 3px 6px rgba(0,0,0,.5));z-index:2}
.tmc{display:flex;align-items:center;gap:12px;padding:12px;border:1.5px solid;border-radius:16px;margin:8px 0;background:rgba(255,255,255,.04);animation:in .4s both}

:root{--b1:#ff2e4d;--b2:#5b3bff;--b3:#ff9f2e}
body[data-theme=neon]{--red:#c026d3;--red2:#22d3ee;--b1:#d946ef;--b2:#22d3ee;--b3:#6366f1}
body[data-theme=ozean]{--red:#2563eb;--red2:#14b8a6;--b1:#0ea5e9;--b2:#14b8a6;--b3:#6366f1}
body.calm .bsg::before,body.calm .bsg::after,body.calm button.bc,body.calm .bg i,body.calm button::after,body.calm .rc,body.calm .gt .te,body.calm .hero .he,body.calm .crown,body.calm .av.l{animation:none!important}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.gt{margin:0;text-align:left;padding:16px 15px;min-height:160px;border-radius:22px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;background:linear-gradient(145deg,var(--g1),var(--g2))!important;opacity:0;animation:in .55s both;animation-delay:calc(var(--k)*70ms);box-shadow:0 10px 28px rgba(0,0,0,.35)!important}
.gt .te{font-size:40px;margin-bottom:auto;animation:float 3s ease-in-out infinite;align-self:flex-start}
.gt b{font-size:19px;letter-spacing:-.4px}
.gt small{font-size:12px;opacity:.88;line-height:1.25}
.gt .bd{font-size:11px;opacity:.95;margin-top:7px;background:rgba(0,0,0,.25);padding:3px 9px;border-radius:99px;align-self:flex-start}
.pchips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.pchip{display:flex;align-items:center;gap:7px;padding:4px 13px 4px 4px;background:rgba(255,255,255,.07);border-radius:99px;font-size:14px;font-weight:650;white-space:nowrap}
.ib{width:46px;height:46px;padding:0;margin:0;border-radius:14px;font-size:20px;flex:none;width:46px}
.trow{display:flex;justify-content:space-between;align-items:center;padding:13px 2px;border-bottom:1px solid var(--line);cursor:pointer;gap:12px}
.sw{width:50px;height:28px;border-radius:99px;background:rgba(255,255,255,.14);position:relative;transition:background .25s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .25s}
.sw.on{background:linear-gradient(135deg,var(--red2),var(--red))}
.sw.on::after{transform:translateX(22px)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#232638;border:1px solid var(--line);padding:12px 18px;border-radius:14px;z-index:60;animation:in .3s both;font-weight:650;max-width:90vw;text-align:center}
.sg{padding:12px 4px;flex:1}
input.txt{font-size:22px;font-weight:700;text-align:center}
.hero{text-align:center;margin:8px 0 4px}
.hero .he{font-size:68px;animation:float 3s ease-in-out infinite}
.word p{color:var(--mu);margin:12px 0 0;font-size:14px;white-space:normal;line-height:1.4}
.spec{position:relative;height:60px;margin:10px 0 4px;touch-action:pan-y}
.sp-in{position:absolute;inset:0;border-radius:16px;background:linear-gradient(90deg,#3f7bff,#8f6cff 50%,#ff2e4d);overflow:hidden}
.spec.live{height:84px;touch-action:none;cursor:ew-resize;user-select:none;-webkit-user-select:none}
.band{position:absolute;top:0;bottom:0;animation:bandin .7s both}
@keyframes bandin{from{opacity:0;transform:scaleY(0)}}
.band.b2{background:rgba(255,255,255,.35)}.band.b3{background:rgba(255,255,255,.6)}.band.b4{background:#ffc83d}
.mk{position:absolute;top:-4px;bottom:-4px;width:4px;margin-left:-2px;border-radius:4px;pointer-events:none}
.mk.tg{background:#0b0d14}
.mk.gs{background:#fff;box-shadow:0 0 14px #fff}
.mk.gs .knob{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.5),0 0 0 4px rgba(255,255,255,.35)}
.wl{display:flex;justify-content:space-between;font-weight:750;font-size:15px}
input[type=range].wv{width:100%;margin-top:16px;accent-color:var(--g1);height:34px}
.legend{display:flex;gap:14px;justify-content:center;font-size:12px;color:var(--mu);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.legend i.gl{background:#fff;box-shadow:0 0 6px #fff}
.locs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.locs .lo{margin:0;padding:12px 6px;font-size:14px}
.rx{border-radius:26px;min-height:58vh;display:grid;place-items:center;text-align:center;font-weight:850;font-size:32px;user-select:none;-webkit-user-select:none;touch-action:manipulation;transition:background .06s;margin-top:10px;padding:16px}
.rx.w{background:linear-gradient(145deg,#c4263c,#8f1226)}
.rx.g{background:linear-gradient(145deg,#22d98a,#0e9f63)}
.rx.d{background:linear-gradient(145deg,#2a2f3f,#1b1f2b)}
.bomb{font-size:130px;text-align:center;line-height:1.1;position:relative;animation:bpulse var(--bd,1s) ease-in-out infinite;filter:drop-shadow(0 0 30px rgba(255,120,40,.55));margin:6px 0}
@keyframes bpulse{50%{transform:scale(1.13) rotate(5deg)}}
.spark{position:absolute;font-size:36px;top:-4px;right:30%;animation:spk .25s infinite alternate}
@keyframes spk{to{transform:scale(1.4) rotate(25deg);opacity:.7}}

.dot{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px}
.dot.p1{background:#ff2e4d}.dot.p2{background:#ffc83d}
.c4s{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
.c4p{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:16px;background:rgba(255,255,255,.05);border:1.5px solid transparent;transition:all .25s}
.c4p.on{border-color:#fff;background:rgba(255,255,255,.12);transform:scale(1.03)}
.c4p .nm{font-weight:750;font-size:15px;max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c4turn{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:750;margin:6px 0 10px;min-height:24px}
.c4b{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;background:linear-gradient(160deg,#2f63e0,#1b3fa8);padding:10px;border-radius:22px;box-shadow:0 14px 34px rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.25);touch-action:manipulation}
.c4col{display:flex;flex-direction:column;gap:6px;cursor:pointer;-webkit-user-select:none;user-select:none}
.c4c{aspect-ratio:1;border-radius:50%;background:#0b0d14;box-shadow:inset 0 4px 8px rgba(0,0,0,.65);position:relative}
.c4col:active .c4c:first-child{box-shadow:inset 0 4px 8px rgba(0,0,0,.65),0 0 0 3px rgba(255,255,255,.7)}
.d{position:absolute;inset:0;border-radius:50%}
.d.p1{background:radial-gradient(circle at 35% 30%,#ff9aa9,#ff2e4d 55%,#b3122e)}
.d.p2{background:radial-gradient(circle at 35% 30%,#fff3b8,#ffc83d 55%,#c98a05)}
.d.drop{animation:c4drop .55s cubic-bezier(.45,.05,.75,.6) both;z-index:2}
@keyframes c4drop{0%{transform:translateY(calc(var(--f)*-112% - 40px))}72%{transform:translateY(0)}84%{transform:translateY(-9%)}94%{transform:translateY(0)}100%{transform:translateY(0)}}
.d.win{animation:c4win .6s infinite alternate;box-shadow:0 0 0 3px #fff,0 0 22px #fff;z-index:1}
@keyframes c4win{to{transform:scale(1.12)}}

.rnd{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:20px;margin:12px 0 0;cursor:pointer;background:linear-gradient(120deg,rgba(143,108,255,.38),rgba(255,46,77,.3));border:1px solid rgba(255,255,255,.18);box-shadow:0 10px 30px rgba(0,0,0,.3);transition:transform .15s}
.rnd:active{transform:scale(.98)}
.rnd>span{font-size:28px;width:50px;height:50px;flex:none;border-radius:16px;display:grid;place-items:center;background:rgba(255,255,255,.16)}
.rnd b{display:block;font-size:17px}
.rnd small{color:var(--mu);font-size:13px}
.rnd em{margin-left:auto;font-style:normal;font-size:24px;color:var(--mu)}
.sech{display:flex;align-items:center;gap:12px;margin:26px 0 8px;cursor:pointer;text-transform:none;letter-spacing:0;font-size:inherit;color:var(--tx)}
.sech .ci{width:38px;height:38px;flex:none;border-radius:12px;display:grid;place-items:center;font-size:20px;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 6px 16px rgba(0,0,0,.35)}
.sech .ct{flex:1;min-width:0}
.sech .ct b{display:block;font-size:18px;letter-spacing:-.3px}
.sech .ct small{color:var(--mu);font-size:13px}
.rowh{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 16px;padding:4px 16px 14px;margin:0 -16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.rowh::-webkit-scrollbar{display:none}
.rowh .gt{flex:0 0 40vw;min-width:150px;max-width:190px;min-height:184px;scroll-snap-align:start}
.gt{border-radius:24px}
.gt::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 0% 0%,rgba(255,255,255,.24),transparent 55%);pointer-events:none}
.gt::after{display:none}
.gt .te{width:54px;height:54px;display:grid;place-items:center;font-size:28px;border-radius:18px;background:rgba(255,255,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.35);animation:none}
.gt b{font-size:17px}
@media (min-width:700px){
 .rowh{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));overflow:visible;padding:4px 0 8px;margin:0;scroll-snap-type:none}
 .rowh .gt{flex:none;max-width:none;min-width:0}
}

function sizeCv(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio}

const GOLD=['#ffc83d','#fff0b3','#ff7a45','#35e0a1','#9b6cff','#ffffff'];
function confetti(n,colors){
  if(!C.fx)return;
  const W=cv.width,H=cv.height;
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,sp=(6+Math.random()*12)*devicePixelRatio;
    parts.push({x:W/2,y:H*.4,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-8*devicePixelRatio,w:(6+Math.random()*7)*devicePixelRatio,h:(8+Math.random()*10)*devicePixelRatio,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:colors[i%colors.length],life:1});
  }
  if(!raf)loop();
}
function loop(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts=parts.filter(p=>p.life>0);
  parts.forEach(p=>{p.vy+=.35*devicePixelRatio;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life-=.007;
    cx.save();cx.globalAlpha=Math.max(p.life,0);cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore()});
  raf=parts.length?requestAnimationFrame(loop):0;
  if(!raf)cx.clearRect(0,0,cv.width,cv.height);
}
function flash(color){
  vib([60,40,120]);if(!C.fx)return;
  const f=document.createElement('div');f.className='flash';if(color)f.style.background=color;document.body.appendChild(f);setTimeout(()=>f.remove(),900);
  document.body.classList.add('quake');setTimeout(()=>document.body.classList.remove('quake'),520);
}
function countUp(el,to,d,ms){
  if(!el)return;const t0=performance.now();

}

function tmrTick(){
  if(!TM)return;

  e.style.display='block';e.textContent='⏱ '+sec;e.classList.toggle('hot',left<=5000);

/* ---------- Statistik (pro Gerät, localStorage pb_stats; nach Spielername) ---------- */
function stGet(){try{return JSON.parse(localStorage.getItem('pb_stats')||'{}')||{}}catch(e){return {}}}
function stPut(o){try{localStorage.setItem('pb_stats',JSON.stringify(o))}catch(e){}}
function statRecord(name,gid,r){
  name=String(name||'').trim().slice(0,16);if(!name||!GAMES[gid]||/^Spieler \d+$/i.test(name))return;   // Standardnamen werden nicht gezählt
  const all=stGet(),k='n:'+name.toLowerCase(),P=(all[k]=all[k]||{n:name,g:{}});P.n=name;
  const g=(P.g[gid]=P.g[gid]||{n:0,w:0,p:0,s:{},m:{}});
  g.n++;g.w+=r.w?1:0;g.p+=Number(r.p)||0;g.t=Date.now();
  const x=r.x||{},ok=q=>/^[a-z]{1,10}$/.test(q);
  if(x.s&&typeof x.s==='object')for(const q in x.s)if(ok(q)&&isFinite(+x.s[q]))g.s[q]=(g.s[q]||0)+(+x.s[q]);
  if(x.m&&typeof x.m==='object')for(const q in x.m)if(ok(q)&&isFinite(+x.m[q]))g.m[q]=g.m[q]==null?+x.m[q]:Math.min(g.m[q],+x.m[q]);
  stPut(all);
}

function drawWheel(){
  const c=$('wh');if(!c)return;

  const n=W.rem.length;if(!n)return;const a=Math.PI*2/n;

    x.fillStyle=`hsl(${hue(pi)} 80% 52%)`;x.fill();x.strokeStyle='rgba(255,255,255,.85)';x.lineWidth=4;x.stroke();
    x.save();x.translate(R,R);x.rotate(-Math.PI/2+(j+.5)*a);x.fillStyle='#fff';x.font='bold 36px system-ui,sans-serif';x.textAlign='right';x.textBaseline='middle';x.shadowColor='rgba(0,0,0,.45)';x.shadowBlur=6;
    x.fillText((S.names[pi].trim()||'?').slice(0,10),R-40,0);x.restore();
  });
  x.beginPath();x.arc(R,R,38,0,7);x.fillStyle='#14161c';x.fill();x.strokeStyle='#fff';x.lineWidth=5;x.stroke();

function buildDeck(n){
  const sel=QCATS.filter(k=>OPT.arsch.cats&&OPT.arsch.cats[k]),cats=sel.length?sel:QCATS;   // nichts gewählt = alle
  const stat=[],gens=[];
  cats.forEach(c=>{(QPOOL[c]?QPOOL[c]():[]).forEach(q=>stat.push(q));(QGEN[c]||[]).forEach(g=>gens.push(g))});
  const nG=gens.length?(stat.length?Math.round(n*.5):n):0;
  const deck=ordered(stat,q=>q[0],'q').slice(0,n-nG),keys=new Set(deck.map(q=>q[0]));
  let guard=0,gen=0;
  const ok=q=>q&&isFinite(q[1])&&q[1]!==0&&!keys.has(q[0]);
  if(gens.length){
    while(gen<nG&&guard++<600){const q=pick(gens)();if(ok(q)&&!recent('q',q[0])){keys.add(q[0]);deck.push(q);gen++}}
    while(deck.length<n&&guard++<1200){const q=pick(gens)();if(ok(q)){keys.add(q[0]);deck.push(q)}}
  }
  return shuffle(deck);   // kann kürzer als n sein, wenn eine Kategorie zu wenige Fragen hat
}

  G.rounds=G.o.rounds;G.cards=G.ents.map(()=>0);G.near=S.P.map(()=>0);G.tip=S.P.length>2;G.deck=buildDeck(G.rounds);G.rounds=Math.max(1,Math.min(G.rounds,G.deck.length));G.r=0;arRound();
}
function arProg(){return prg(G.r+G.i/S.P.length,G.rounds,`Runde ${G.r+1} von ${G.rounds}`)}
function arParse(s){
  const raw=String(s==null?'':s).trim().replace(/\s/g,'').replace(/\.(?=\d{3}(\D|$))/g,'').replace(',','.');
  const v=parseFloat(raw);return isFinite(v)?v:null;
}
// Online: alle schätzen und tippen gleichzeitig auf dem eigenen Gerät
let ARTIP_MS=10000;   // Online: Zeit zum Tippen nach Ablauf der Schätzzeit
function arPar(){

    {k:'g',timeout:pi=>{G.g[pi]=null},html:pi=>`<div class="card"><div class="row" style="align-items:center;gap:10px;margin-bottom:12px">${av(pi)}<span class="sm">${esc(S.P[pi])} schätzt</span>${qBtn(q)}</div>
      <div class="q">${esc(q[0])}</div>${q[2]?`<div style="margin-top:8px" class="sm">Einheit: <span class="unit">${esc(q[2])}</span></div>`:''}${qBox(q)}
      <input data-f="g" data-enter="g" class="num" type="text" inputmode="decimal" autocomplete="off" placeholder="?"><button data-sub="g">${G.tip?'Weiter zum Tippen':'Abschicken'}</button></div>`,
     sub:(pi,d)=>{const v=arParse(d.f.g);if(v==null)return 'Bitte eine Zahl eingeben.';G.g[pi]=v;return true}},
    {k:'t',timeout:pi=>{G.t[pi]=null},html:pi=>`<div class="card"><div class="sm">Deine Schätzung ist gespeichert. Jetzt tippen:</div><div class="q" style="margin:8px 0 6px">Wer liegt am weitesten daneben?</div><p style="margin:0 0 6px;font-size:14px">${esc(q[0])}</p>
      ${S.P.map((p,i)=>i===pi?'':`<button class="opt" style="--k:${i}" data-sub="t" data-v="${i}">${av(i)}<span>${esc(p)}</span></button>`).join('')}</div>`,
     sub:(pi,d)=>{const t=Number(d.v);if(d.v==null||!Number.isInteger(t)||t<0||t>=S.P.length||t===pi)return 'Ungültige Wahl.';G.t[pi]=t;return true}}
  ].slice(0,G.tip?2:1),done:arResult});
}
function arRound(){
  G.q=G.deck[G.r];mark('q',G.q[0]);G.g=[];G.t=[];G.i=0;
  if(NET.host){arPar();return}
  hand(G.i,arMsg(),arGuess,arProg());
}
function arGuess(){
  scr(`${arProg()}<div class="card"><div class="row" style="align-items:center;gap:10px;margin-bottom:12px">${av(G.i)}<span class="sm">${esc(S.P[G.i])} schätzt</span>${qBtn(G.q)}</div>
  <div class="q">${esc(G.q[0])}</div>${G.q[2]?`<div style="margin-top:8px" class="sm">Einheit: <span class="unit">${esc(G.q[2])}</span></div>`:''}${qBox(G.q)}
  <input id="g" class="num" type="text" inputmode="decimal" autocomplete="off" placeholder="?">
  <div class="err" id="e"></div><button onclick="arSubmit()">${G.tip?'Weiter zum Tippen':'Abschicken'}</button></div>`);
  const g=$('g');g.addEventListener('keydown',e=>{if(e.key==='Enter')arSubmit()});setTimeout(()=>g.focus(),80);
  if(G.o.timer)tmrShow(G.o.timer*1000,arTimeUp);
}
function arSubmit(){
  const g=$('g');
  const v=arParse(g.value);
  if(v==null){$('e').textContent='Bitte eine Zahl eingeben.';g.classList.remove('shake');void g.offsetWidth;g.classList.add('shake');vib(80);return}
  G.g[G.i]=v;tmrHide();arAfter();
}
const arMsg=()=>G.tip?'Schätzen und tippen – niemand schaut mit!':'Schätzen – niemand schaut mit!';
// Ab 3 Spielern folgt das Tippen; zu zweit gäbe es nur eine mögliche Wahl, deshalb entfällt es
function arAfter(){if(G.tip)arTip();else{G.i++;if(G.i<S.P.length)hand(G.i,arMsg(),arGuess,arProg());else arResult()}}
function arTimeUp(){
  const g=$('g');if(!g)return;
  const v=arParse(g.value);G.g[G.i]=v;tmrHide();sfx.bad();vib([60,40,60]);
  toast(v==null?'⏰ Zeit um – keine Antwort':'⏰ Zeit um – deine Eingabe zählt');
  arAfter();
}
function arTip(){
  const me=G.i;
  scr(`${arProg()}<div class="card"><div class="sm">Deine Schätzung ist gespeichert. Jetzt tippen:</div><div class="q" style="margin:8px 0 6px">Wer liegt am weitesten daneben?</div><p style="margin:0 0 6px;font-size:14px">${esc(G.q[0])}</p>
  ${S.P.map((p,i)=>i===me?'':`<button class="opt" style="--k:${i}" onclick="arPick(${i},this)">${av(i)}<span>${esc(p)}</span></button>`).join('')}</div>`);
}
function arPick(t,btn){
  btn.classList.add('sel');vib(30);sfx.pop();
  document.querySelectorAll('.opt').forEach(b=>b.style.pointerEvents='none');
  setTimeout(()=>{G.t[G.i]=t;G.i++;if(G.i<S.P.length)hand(G.i,'Schätzen und tippen – niemand schaut mit!',arGuess,arProg());else arResult()},420);
}
// Abstand zwischen Schätzung und Antwort: Jahreszahlen absolut (in Jahren), sonst im Verhältnis (zu hoch und zu niedrig zählen gleich)
const arAbs=q=>q[2]==='Jahr'||q[1]<=0;
function arErr(g,q){const a=q[1];if(arAbs(q))return Math.abs(g-a);if(!(g>0))return 1e12;return Math.abs(Math.log(g/a))}
function arDiffTxt(g,q){
  const a=q[1];
  if(arAbs(q)){const d=Math.abs(g-a);if(d<1e-9)return 'exakt';if(q[2]==='Jahr')return fmt(d)+(d===1?' Jahr':' Jahre')+' daneben';return fmt(d,1)+(q[2]?' '+q[2]:'')+' daneben'}
  if(!(g>0))return 'unsinnig (null oder negativ)';
  const f=g/a;if(Math.abs(f-1)<0.0005)return 'exakt';
  if(Math.abs(f-1)<0.2)return fmt(Math.round(Math.abs(f-1)*1000)/10)+' % '+(f>1?'zu hoch':'zu niedrig');
  return 'Faktor '+fmt(f>1?f:1/f,1)+(f>1?' zu hoch':' zu niedrig');
}
function arResult(){
  const a=G.q[1],n=S.P.length,d=dec(a);
  const gs=S.P.map((_,i)=>G.g[i]==null?null:G.g[i]),ts=S.P.map((_,i)=>(G.tip&&G.t[i]!=null)?G.t[i]:null);
  const err=gs.map(g=>g==null?null:arErr(g,G.q));          // null = keine Antwort (Zeit abgelaufen)
  const valid=err.filter(e=>e!=null),mxBar=Math.max(0,...valid.filter(e=>e<1e11));
  const mn=valid.length?Math.min(...valid):0,mx=valid.length?Math.max(...valid):0,eps=1e-12;
  const best=err.map(e=>e!=null&&e-mn<eps);
  const worst=mx-mn<eps?err.map(()=>false):err.map(e=>e!=null&&mx-e<eps);
  const tipOK=ts.map(t=>t!=null&&worst[t]);
  const gain=S.P.map((_,i)=>(best[i]?2:0)+(tipOK[i]?1:0));
  gain.forEach((g,i)=>{G.pts[i]+=g;if(worst[i])G.cards[i]++;if(best[i]&&G.near)G.near[i]++});
  const order=S.P.map((_,i)=>i).sort((x,y)=>(err[y]==null?-1:err[y])-(err[x]==null?-1:err[x]));
  const step=.55,end=n*step+.4,last=G.r+1>=G.rounds;
  const u=G.q[2]&&G.q[2]!=='Jahr'?' '+esc(G.q[2]):'';
  scr(`${prg(G.r+1,G.rounds,`Runde ${G.r+1} von ${G.rounds}`)}
  <div class="card ans"><div class="q" style="font-size:19px">${esc(G.q[0])}</div><div class="sm" style="margin-top:12px">Richtige Antwort</div><div class="num"><span id="cu">0</span><span class="unit" style="font-size:22px">${u}</span></div></div>
  <div>${order.map((i,k)=>{
    const w=err[i]==null?0:mxBar>0?Math.max(3,Math.min(100,err[i]/mxBar*100)):3;
    return `<div class="res ${best[i]?'best':''} ${worst[i]?'worst':''}" style="--d:${(k*step+.5).toFixed(2)}s;--w:${w}%">
      <div class="rh">${av(i)}<div class="nm">${esc(S.P[i])}${best[i]?'<span class="tag b">am nächsten</span>':''}${worst[i]?'<span class="tag w">Arschkarte</span>':''}</div><div class="gain ${gain[i]?'':'z'}">+${gain[i]}</div></div>
      <div class="dev"><i></i></div>
      <div class="sm">${gs[i]==null?'⏰ <b style="color:var(--tx)">Keine Antwort</b> (Zeit abgelaufen)':`Schätzung <b style="color:var(--tx)">${fmt(gs[i])}</b> · ${arDiffTxt(gs[i],G.q)}`}${G.tip?`<br>Tipp: ${ts[i]==null?'–':esc(S.P[ts[i]])} ${tipOK[i]?'<span class="tag t">richtig +1</span>':'<span class="tag x">falsch</span>'}`:''}</div></div>`}).join('')}</div>
  <div class="late" style="--d:${end}s">${G.o.drink?drinkBox(S.P.map((p,i)=>worst[i]?`${esc(p)} trinkt 1 Schluck 🟥`:'').concat(S.P.map((p,i)=>best[i]?`${esc(p)} verteilt 2 Schlucke 🎯`:'')).filter(Boolean)):''}${boardHTML(G.pts)}<button onclick="${last?'arFinish()':'G.r++;arRound()'}">${last?'Endergebnis 🏆':'Nächste Frage'}</button></div>`);
  countUp($('cu'),a,d,1100);
  order.forEach((i,k)=>{
    const at=(k*step+.5)*1000;
    if(worst[i])setTimeout(()=>{flash();sfx.bad()},at+250);
    if(best[i])setTimeout(()=>{confetti(110,GOLD);sfx.ok();vib(40)},at+500);
  });
}
function arFinish(){
  const mxc=Math.max(...G.cards),loser=S.P.filter((_,i)=>G.cards[i]===mxc&&mxc>0);
  finish({extra:loser.length?`<div class="card late" style="--d:1.2s;text-align:center;border-color:var(--red)"><div class="sm">Arschkarte des Abends</div><div style="font-size:46px;margin:6px 0">🟥</div><div class="big" style="color:var(--red2)">${esc(loser.join(', '))}</div><div class="sm">${mxc}× am weitesten danebengelegen</div></div>`:''});
}

const PGR=339.29;
GAMES.pant={name:'Pantomime',e:'🎭',tag:'Vorspielen, raten, lachen',c:['#8f6cff','#3f7bff'],min:2,teams:true,
  desc:'Einer spielt vor – ohne Worte und Geräusche. Die anderen raten. Vorher wartet ein zufälliger Twist.',
  rules:'Wer dran ist, zieht einen Twist (manche geben Bonuspunkte) und sieht Begriffe auf dem Display. Er spielt sie ohne Sprechen vor. Wer richtig rät, wird auf „Erraten“ getippt. Im Einzelmodus bekommen Rater und Vorspieler je 1 Punkt (Vorspieler mit Twist-Faktor). Im Teammodus rät das ganze Team, die Punkte gehen ans Team. Überspringen: dreimal pro Auftritt.',
  opts:()=>`<p class="sm" style="margin:0 0 8px">Kategorien (nichts gewählt = alle)</p><div class="chips">${Object.keys(PW).map(k=>`<span class="chip ${OPT.pant.cats[k]?'on':''}" onclick="OPT.pant.cats['${k}']=!OPT.pant.cats['${k}'];this.classList.toggle('on')">${k}</span>`).join('')}</div>

  start:pStart};
function pBuildPool(){
  const all=[];
  G.ks.forEach(k=>{if(k===MIX){const s=new Set();while(s.size<40)s.add(mixWord());s.forEach(w=>all.push([w,k]))}else PW[k].forEach(w=>all.push([w,k]))});
  G.pool=ordered(all,x=>x[0],'w');G.wi=0;
}
function nextWord(){if(G.wi>=G.pool.length)pBuildPool();const w=G.pool[G.wi++];mark('w',w[0]);return w}
function pStart(){
  G.ks=Object.keys(PW).filter(k=>G.o.cats[k]);if(!G.ks.length)G.ks=Object.keys(PW);
  G.plan=plan(G.o.rounds);G.t=0;pBuildPool();pHand();
}
function pHand(){
  const p=G.plan[G.t];G.a=p.a;G.e=p.e;
  const tag=G.team?`Team ${TN[G.e][0]} ${TN[G.e][1]}`:'';
  hand(G.a,`Nur ${esc(S.P[G.a])} schaut aufs Display. ${G.team?'Das Team rät, alle anderen schweigen!':'Alle anderen: Augen weg!'}`,pTwist,prg(G.t,G.plan.length,`Auftritt ${G.t+1} von ${G.plan.length}`),tag);
}
function pTwist(){
  const tw=pick(TW);G.tw=tw;
  scr(`<div class="card hand"><p style="margin:0">Dein Twist</p><div class="reel" id="rl">🎰</div><div class="big" id="rn">…</div><p id="rd">&nbsp;</p><div id="rb" style="min-height:70px"></div></div>`);
  const rl=$('rl'),rn=$('rn'),rd=$('rd'),rb=$('rb');let n=0;
  (function tick(){
    if(!$('rl'))return;
    const r=pick(TW);
    if(++n<17){rl.textContent=r[0];rn.textContent=r[1];sfx.tick();vib(8);setTimeout(tick,50+n*n*1.6)}
    else{
      rl.textContent=tw[0];rn.textContent=tw[1];rl.classList.add('hit');
      rd.textContent=tw[2]+(tw[3]>1?` Punkte ×${tw[3]}!`:'');
      rb.innerHTML=`<button onclick="pPlay()">Start – die Zeit läuft!</button>`;
      if(tw[3]>1){confetti(50,['#8f6cff','#3f7bff','#fff']);sfx.ok()}
      vib(40);
    }
  })();
}
function pPlay(){
  G.cor=[];G.skips=0;G.w=nextWord();G.total=Math.round(G.o.secs*G.tw[4]);G.end=Date.now()+G.total*1000;G.lastS=-1;
  scr(`<div class="row" style="justify-content:space-between;align-items:center;margin-top:6px"><span class="twc">${G.tw[0]} ${esc(G.tw[1])}${G.tw[3]>1?' ×'+G.tw[3]:''}</span><span class="twc" style="background:rgba(53,224,161,.15);border-color:rgba(53,224,161,.5)">✓ <b id="cnt">0</b></span></div>
  <div class="ringw" id="rw"><svg viewBox="0 0 120 120"><defs><linearGradient id="grd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8f6cff"/><stop offset="1" stop-color="#3f7bff"/></linearGradient></defs><circle class="rbg" cx="60" cy="60" r="54"/><circle id="rg" class="rfg" cx="60" cy="60" r="54" stroke-dasharray="${PGR}" stroke-dashoffset="0" transform="rotate(-90 60 60)"/></svg><div class="rt" id="tt">${G.total}</div></div>
  <div class="word" id="w"></div>
  <div class="row"><button class="ok" style="flex:2" onclick="pOk()">✓ Erraten</button><button class="sec" id="sk" style="flex:1" onclick="pSkip()">↷ Skip</button></div>
  <p class="sm" style="text-align:center">Nicht sprechen, nichts zeigen, was auf dem Display steht!</p>`);
  drawWord();clearInterval(G.iv);G.iv=setInterval(pTick,100);
}
function drawWord(){
  const w=$('w');if(!w)return;
  w.innerHTML=`<small>${esc(G.w[1])}</small><span>${esc(G.w[0])}</span>`;
  w.classList.remove('flipin');void w.offsetWidth;w.classList.add('flipin');
  $('cnt').textContent=G.cor.length;
  const sk=$('sk');sk.textContent=`↷ Skip (${3-G.skips})`;sk.style.opacity=G.skips>=3?.4:1;

function pTick(){
  const left=Math.max(0,(G.end-Date.now())/1000),rg=$('rg');
  if(!rg){clearInterval(G.iv);return}
  rg.setAttribute('stroke-dashoffset',PGR*(1-left/G.total));
  const c=Math.ceil(left);$('tt').textContent=c;
  if(left<=10)$('rw').classList.add('hot');
  if(left<=5&&c!==G.lastS){G.lastS=c;vib(25);sfx.tick()}
  if(left<=0)pEnd();
}
function pOk(){
  if($('pk'))return;
  G.cor.push(G.w[0]);vib(30);sfx.ok();
  if(G.team){confetti(26,['#35e0a1','#8f6cff','#fff']);G.w=nextWord();drawWord();return}
  document.querySelector('.screen').insertAdjacentHTML('beforeend',`<div class="pk" id="pk"><div><h2>Wer hat's erraten?</h2>
  ${S.P.map((p,i)=>i===G.a?'':`<button class="opt" style="--k:${i}" onclick="pPick(${i})">${av(i)}<span>${esc(p)}</span></button>`).join('')}
  <button class="sec" onclick="pPick(-1)">Alle gemeinsam / egal</button></div></div>`);
}
function pPick(i){
  if(i>=0)G.pts[i]++;

}
function pSkip(){if(G.skips>=3||$('pk'))return;G.skips++;vib(10);G.w=nextWord();drawWord()}
function pEnd(){
  clearInterval(G.iv);flash();sfx.bad();
  const g=G.cor.length*G.tw[3];G.pts[G.e]+=g;G.t++;
  const last=G.t>=G.plan.length;

  <p style="margin:4px 0 10px">${G.team?'Team '+TN[G.e][1]+' ('+esc(S.P[G.a])+')':esc(S.P[G.a])} hat <b style="color:var(--ok)">${G.cor.length}</b> Begriff${G.cor.length==1?'':'e'} erspielt${G.tw[3]>1&&G.cor.length?` · ×${G.tw[3]} Twist`:''}</p>

  ${G.cor.length?`<div class="chips" style="justify-content:center;margin-top:12px">${G.cor.map(w=>`<span class="chip on">${esc(w)}</span>`).join('')}</div>`:'<p>Diesmal nichts – beim nächsten Mal!</p>'}</div>
  ${boardHTML(G.pts)}
  <button onclick="${last?'finish()':'pHand()'}">${last?'Endergebnis 🏆':'Nächster Auftritt'}</button>`);

}

function spyRound(){
  G.loc=G.locs[G.r%G.locs.length];mark('l',G.loc[0]);
  G.spy=rnd(0,S.P.length-1);G.i=0;G.sv=null;G.cnt=null;
  if(NET.host){spyPar();return}
  hand(G.i,'Schau dir deine Karte an – niemand sonst!',spyShow,spyProg());
}
function spyShow(){
  const sp=G.i===G.spy;
  scr(`${spyProg()}<div class="card word flipin" style="margin-top:14px">${sp
    ?`<small>Deine Rolle</small><div style="font-size:70px">🕵️</div><span>Du bist der Spion!</span><p>Finde heraus, wo ihr seid – ohne aufzufallen.</p>`
    :`<small>Der geheime Ort</small><div style="font-size:70px">${G.loc[1]}</div><span>${G.loc[0]}</span><p>Du bist kein Spion. Stelle clevere Fragen, ohne den Ort zu verraten.</p>`}</div>
  <button onclick="spyNext()">Verdecken &amp; weitergeben</button>`);
}
function spyNext(){G.i++;if(G.i<S.P.length)hand(G.i,'Schau dir deine Karte an – niemand sonst!',spyShow,spyProg());else spyTalk()}
function spyTalk(){
  const starter=rnd(0,S.P.length-1);G.total=G.o.mins*60;G.end=Date.now()+G.total*1000;
  scr(`${spyProg()}<div class="card ans"><div style="font-size:48px">🗣️</div><div class="big">Fragerunde</div><p style="margin:0">${esc(S.P[starter])} beginnt: Stellt reihum Fragen an eine andere Person. Die Antwort darf den Ort nicht verraten – aber der Spion darf nicht auffliegen.</p></div>
  <div class="ringw" id="rw"><svg viewBox="0 0 120 120"><defs><linearGradient id="grd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14b8a6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs><circle class="rbg" cx="60" cy="60" r="54"/><circle id="rg" class="rfg" cx="60" cy="60" r="54" stroke-dasharray="${PGR}" stroke-dashoffset="0" transform="rotate(-90 60 60)"/></svg><div class="rt" id="tt" style="font-size:34px"></div></div>
  <button onclick="spyVote()">🗳️ Abstimmen: Wer ist der Spion?</button>
  <button class="sec" onclick="spyGuess('self')">🕵️ Ich bin der Spion – Ort raten</button>`);
  clearInterval(G.iv);G.iv=setInterval(()=>{
    const left=Math.max(0,(G.end-Date.now())/1000),rg=$('rg');
    if(!rg){clearInterval(G.iv);return}
    rg.setAttribute('stroke-dashoffset',PGR*(1-left/G.total));
    const m=Math.floor(left/60),s=Math.ceil(left%60);$('tt').textContent=`${m}:${pad(s===60?59:s)}`;
    if(left<=30)$('rw').classList.add('hot');
    if(left<=0){clearInterval(G.iv);sfx.bad();vib([100,50,100]);spyVote(true)}
  },250);
}
// Online: Alle stimmen geheim und gleichzeitig ab; die meisten Stimmen entscheiden, bei Gleichstand kommt der Spion davon
function spyVotePar(timeUp){
  parBegin({head:spyProg,dur:[30000],msg:(timeUp===true?'⏰ Zeit um! ':'')+'Alle stimmen geheim ab, wer der Spion ist …',steps:[
    {k:'v',html:pi=>`<div class="card"><div class="q">Wer ist der Spion?</div><p>Stimme geheim ab – erst danach wird ausgezählt.</p>
      ${S.P.map((p,i)=>i===pi?'':`<button class="opt" style="--k:${i}" data-sub="v" data-v="${i}">${av(i)}<span>${esc(p)}</span></button>`).join('')}</div>`,
     sub:(pi,d)=>{const t=Number(d.v);if(d.v==null||!Number.isInteger(t)||t<0||t>=S.P.length||t===pi)return 'Ungültige Wahl.';(G.sv=G.sv||[])[pi]=t;return true}}
  ],done:spyTally});
}
function spyTally(){
  const cnt=S.P.map(()=>0);(G.sv||[]).forEach(t=>{if(t!=null)cnt[t]++});G.cnt=cnt;
  const mx=Math.max(0,...cnt),tops=cnt.map((c,i)=>c===mx&&mx>0?i:-1).filter(i=>i>=0);
  if(tops.length===1){G.acc=tops[0];if(G.acc===G.spy){sfx.ok();spyGuess('caught')}else spyEnd('missed')}
  else spyEnd('tie');
}
function spyVote(timeUp){
  clearInterval(G.iv);
  if(NET.host){spyVotePar(timeUp);return}
  scr(`${spyProg()}<div class="card"><div class="q">${timeUp===true?'⏰ Zeit um! ':''}Wer ist der Spion?</div><p>Einigt euch gemeinsam und tippt die Person an.</p>
  ${S.P.map((p,i)=>`<button class="opt" style="--k:${i}" onclick="spyAccuse(${i})">${av(i)}<span>${esc(p)}</span></button>`).join('')}</div>`);
}
function spyAccuse(i){G.acc=i;if(i===G.spy){sfx.ok();spyGuess('caught')}else spyEnd('missed')}
function spyGuess(how){
  clearInterval(G.iv);G.how=how;
  const opts=shuffle([G.loc].concat(shuffle(LOCS.filter(l=>l!==G.loc)).slice(0,11)));
  scr(`${spyProg()}<div class="card"><div style="font-size:44px">${how==='caught'?'😬':'🕵️'}</div><div class="q" style="margin:6px 0">${esc(S.P[G.spy])} ${how==='caught'?'wurde enttarnt!':'deckt auf!'}</div><p>Letzte Chance: Wo seid ihr?</p>
  <div class="locs">${opts.map(l=>`<button class="sec lo" onclick="spyEnd('${how}',${LOCS.indexOf(l)})"><span style="font-size:26px">${l[1]}</span><br>${l[0]}</button>`).join('')}</div></div>`);
}
function spyEnd(how,gi){
  const right=gi!=null&&LOCS[gi]===G.loc;
  // Spion gewinnt: falsch beschuldigt (missed), oder richtig geraten (caught/self)
  const spyWins=how==='missed'||how==='tie'||right;
  const gain=S.P.map((_,i)=>i===G.spy?(spyWins?3:0):(spyWins?0:2));
  gain.forEach((g,i)=>G.pts[i]+=g);
  const last=G.r+1>=G.rounds;
  const why=how==='tie'?'Gleichstand bei der Abstimmung – die Gruppe konnte sich nicht einigen, der Spion kommt davon!':how==='missed'?`${esc(S.P[G.acc])} war unschuldig – der Spion kommt davon!`:how==='caught'?(right?'Enttarnt, aber der Spion hat den Ort erraten!':'Enttarnt und der Ort wurde nicht erraten!'):(right?'Mutig aufgedeckt und richtig geraten!':'Aufgedeckt und falsch geraten!');
  scr(`${prg(G.r+1,G.rounds,`Runde ${G.r+1} von ${G.rounds}`)}<div class="card ans"><div style="font-size:60px;animation:pop .6s both">${spyWins?'🕵️':'🎉'}</div><div class="big" style="color:${spyWins?'var(--red2)':'var(--ok)'}">${spyWins?'Der Spion gewinnt!':'Die Gruppe gewinnt!'}</div>
  <p style="margin:6px 0">${why}</p>${G.cnt?`<div class="sm" style="margin-bottom:8px">Abstimmung: ${S.P.map((p,i)=>esc(p)+' '+G.cnt[i]).join(' · ')}</div>`:''}<div class="sm">Der Spion war</div><div class="big">${esc(S.P[G.spy])}</div><div class="sm">Der Ort war</div><div style="font-size:44px">${G.loc[1]}</div><div class="big" style="font-size:26px">${G.loc[0]}</div></div>
  ${boardHTML(G.pts)}<button onclick="${last?'finish()':'G.r++;spyRound()'}">${last?'Endergebnis 🏆':'Nächste Runde'}</button>`);
  if(spyWins){flash();sfx.bad()}else{confetti(120,GOLD);sfx.win()}
}

GAMES.wave={name:'Wellenlänge',e:'📡',tag:'Auf einer Wellenlänge sein',c:['#f59e0b','#ef4444'],min:3,teams:true,

function waStart(){G.plan=plan(G.o.rounds);G.t=0;G.sp=ordered(SP,s=>s[0]+'|'+s[1],'s');waHand()}
function waHand(){
  const p=G.plan[G.t];G.a=p.a;G.e=p.e;
  const s=G.sp[G.t%G.sp.length];mark('s',s[0]+'|'+s[1]);G.pair=s;G.target=rnd(8,92);G.guess=50;
  hand(G.a,'Du gibst den Hinweis. Nur du schaust auf das Display!',waSecret,prg(G.t,G.plan.length,`Hinweis ${G.t+1} von ${G.plan.length}`),G.team?`Team ${TN[G.e][0]} ${TN[G.e][1]}`:'');
}
function specBar(o){
  const b=(w,cls)=>o.target!=null?`<div class="band ${cls}" style="left:${Math.max(0,o.target-w)}%;width:${Math.min(100,o.target+w)-Math.max(0,o.target-w)}%"></div>`:'';
  return `<div class="wl"><span>${esc(G.pair[0])}</span><span>${esc(G.pair[1])}</span></div>
  <div class="spec${o.live?' live':''}" id="sp"${o.live?' data-ptr="1"':''}><div class="sp-in">${b(15,'b2')}${b(9,'b3')}${b(4,'b4')}</div>${o.target!=null?`<div class="mk tg" style="left:${o.target}%"></div>`:''}${o.guess!=null?`<div class="mk gs" id="gm" style="left:${o.guess}%"><span class="knob"></span></div>`:''}</div>`;
}
function waBind(){
  const sp=$('sp');if(!sp)return;
  const set=x=>{const r=sp.getBoundingClientRect();if(!r.width)return;G.guess=Math.round(Math.max(0,Math.min(100,(x-r.left)/r.width*100))*10)/10;waMark()};
  sp.addEventListener('pointerdown',e=>{try{sp.setPointerCapture(e.pointerId)}catch(_){}G.drag=true;set(e.clientX);e.preventDefault()});
  sp.addEventListener('pointermove',e=>{if(G.drag)set(e.clientX)});
  ['pointerup','pointercancel','lostpointercapture'].forEach(t=>sp.addEventListener(t,()=>{G.drag=false}));
}
function waMark(){const m=$('gm');if(m)m.style.left=G.guess+'%';if(G.ag&&G.ag.size&&G.guess!==G.lastg){G.ag.clear();waAgreeUI()}G.lastg=G.guess}

  scr(`${prg(G.t,G.plan.length,`Hinweis ${G.t+1} von ${G.plan.length}`)}<div class="card"><div class="sm">Geheim – nur für ${esc(S.P[G.a])}</div>

}
function waGuess(){
  G.guess=50;G.drag=false;G.ag=new Set();G.lastg=50;
  G.gu=G.team?G.tm[G.e].filter(p=>p!==G.a):S.P.map((_,i)=>i).filter(p=>p!==G.a);
  if(!G.gu.length)G.gu=S.P.map((_,i)=>i).filter(p=>p!==G.a);
  scr(`${prg(G.t,G.plan.length,`Hinweis ${G.t+1} von ${G.plan.length}`)}<div class="card"><div class="sm">${esc(S.P[G.a])} hat den Hinweis gegeben. ${G.team?'Das Team rät:':'Rät gemeinsam:'}</div>

const waReq=()=>G.gu.filter(p=>p===0||isOpen(NET.m[p]));
function waAgree(){
  const who=NET.who==null?0:NET.who;
  if(!G.gu.includes(who)){if(who===0)toast('Du hast den Hinweis gegeben – die anderen raten');return}
  if(G.ag.has(who))G.ag.delete(who);else G.ag.add(who);
  sfx.pop();waAgreeUI();
  const need=waReq();
  if(!need.length||need.every(p=>G.ag.has(p)))waLock();
}

  const e=$('wag');if(!e)return;
  e.innerHTML=waReq().map(p=>`<span class="chip ${G.ag.has(p)?'on':''}" style="margin:2px 4px 2px 0;cursor:default">${G.ag.has(p)?'✅':'⏳'} ${esc(S.P[p])}</span>`).join('')+'<div class="sm" style="margin-top:6px">Alle Rater müssen dem Marker zustimmen. Wer ihn verschiebt, setzt alle Zustimmungen zurück.</div>';

function waLock(){
  sfx.pop();

    const ot=(G.e+1)%G.tm.length;G.ot=ot;
    scr(`<div class="card ans"><div class="sm">Bonuspunkt</div><div class="q">Team ${TN[ot][0]} ${TN[ot][1]} entscheidet:</div><p>Liegt der geheime Punkt weiter links oder rechts vom Tipp?</p></div>

const waSideReq=()=>(G.tm[G.ot]||[]).filter(p=>p===0||isOpen(NET.m[p]));
function waSide(dir){
  if(!NET.host){waReveal(dir);return}                         // ein Gerät: wie bisher sofort
  const who=NET.who==null?0:NET.who,req=waSideReq();
  if(req.length&&!req.includes(who)){if(who===0)toast(`Das entscheidet Team ${TN[G.ot][1]}`);return}
  if(!req.length){waReveal(dir);return}
  G.lr[who]=dir;sfx.pop();waSideUI();
  const vs=req.map(p=>G.lr[p]);
  if(vs.every(v=>v)&&vs.every(v=>v===vs[0]))waReveal(vs[0]);
}
function waSideUI(){
  const e=$('wlr');if(!e)return;const req=waSideReq(),vs=req.map(p=>G.lr[p]);
  const split=vs.every(v=>v)&&req.length>1&&!vs.every(v=>v===vs[0]);
  e.innerHTML=req.map(p=>`<span class="chip ${G.lr[p]?'on':''}" style="margin:2px 4px 2px 0;cursor:default">${G.lr[p]?(G.lr[p]==='L'?'◀':'▶'):'⏳'} ${esc(S.P[p])}</span>`).join('')+`<div class="sm" style="margin-top:6px">${split?'⚠️ Noch nicht einig – wer umentscheidet, tippt die andere Seite.':'Alle im Team müssen dieselbe Seite wählen.'}</div>`;
}
function waReveal(dir){
  const diff=Math.abs(G.guess-G.target),pts=diff<=4?4:diff<=9?3:diff<=15?2:0;
  G.pts[G.e]+=pts;
  let bonus='';
  if(dir){const right=dir==='L'?G.target<G.guess:G.target>G.guess;if(right&&diff>0){G.pts[G.ot]++;bonus=`<p style="margin:8px 0 0">Team ${TN[G.ot][0]} ${TN[G.ot][1]} lag richtig: <b style="color:var(--ok)">+1 Bonus</b></p>`}else bonus=`<p style="margin:8px 0 0" class="sm">Bonus-Tipp daneben.</p>`}
  const last=G.t+1>=G.plan.length;
  const msg=pts===4?'🎯 Volltreffer!':pts===3?'🔥 Richtig nah!':pts===2?'👍 In der Gegend':'😅 Daneben';
  scr(`${prg(G.t+1,G.plan.length,`Hinweis ${G.t+1} von ${G.plan.length}`)}<div class="card">${specBar({target:G.target,guess:G.guess})}
  <div class="legend"><span><i style="background:#ffc83d"></i>4</span><span><i style="background:rgba(255,255,255,.7)"></i>3</span><span><i style="background:rgba(255,255,255,.35)"></i>2</span><span><i class="gl"></i>Tipp</span></div></div>
  <div class="card ans"><div class="big">${msg}</div><div class="num" style="font-size:54px;font-weight:900;color:${pts?'var(--ok)':'var(--mu)'}">+${pts}</div><p style="margin:0">für ${G.team?'Team '+TN[G.e][1]:esc(S.P[G.a])}</p>${bonus}</div>
  ${boardHTML(G.pts)}<button onclick="${last?'finish()':'G.t++;waHand()'}">${last?'Endergebnis 🏆':'Nächster Hinweis'}</button>`);
  if(pts>=3){confetti(pts===4?150:70,GOLD);sfx.win()}else if(pts===0){flash('radial-gradient(circle,rgba(120,120,160,.4),transparent 70%)');sfx.bad()}else sfx.ok();
}

const botAv=(sz,cls)=>`<div class="av ${cls||''}" style="${sz?`width:${sz}px;height:${sz}px;font-size:${Math.round(sz*.5)}px;`:''}background:linear-gradient(135deg,#64748b,#334155)">🤖</div>`;
const C4D=[[0,1],[1,0],[1,1],[1,-1]];
const c4Rows=6,c4Cols=7;
function c4Line(b,r,c){
  const p=b[r][c];if(!p)return null;
  for(const [dr,dc] of C4D){
    const cells=[[r,c]];
    for(const s of [1,-1]){let rr=r+dr*s,cc=c+dc*s;while(rr>=0&&rr<c4Rows&&cc>=0&&cc<c4Cols&&b[rr][cc]===p){cells.push([rr,cc]);rr+=dr*s;cc+=dc*s}}
    if(cells.length>=4)return cells;
  }
  return null;
}
function c4Win(b,r,c){
  const p=b[r][c];
  for(const [dr,dc] of C4D){
    let n=1;
    for(const s of [1,-1]){let rr=r+dr*s,cc=c+dc*s;while(rr>=0&&rr<c4Rows&&cc>=0&&cc<c4Cols&&b[rr][cc]===p){n++;rr+=dr*s;cc+=dc*s}}
    if(n>=4)return true;
  }
  return false;
}
const c4Moves=b=>[3,2,4,1,5,0,6].filter(c=>b[0][c]===0);
function c4Put(b,c,p){for(let r=c4Rows-1;r>=0;r--)if(b[r][c]===0){b[r][c]=p;return r}return -1}
function c4Eval(b,p){
  let s=0;const o=3-p;
  for(let r=0;r<c4Rows;r++)if(b[r][3]===p)s+=3;else if(b[r][3]===o)s-=3;
  for(let r=0;r<c4Rows;r++)for(let c=0;c<c4Cols;c++)for(const [dr,dc] of C4D){
    const er=r+dr*3,ec=c+dc*3;if(er<0||er>=c4Rows||ec<0||ec>=c4Cols)continue;
    let mine=0,theirs=0;
    for(let k=0;k<4;k++){const v=b[r+dr*k][c+dc*k];if(v===p)mine++;else if(v===o)theirs++}
    if(mine&&theirs)continue;
    if(mine===3)s+=5;else if(mine===2)s+=2;
    if(theirs===3)s-=6;else if(theirs===2)s-=2;
  }
  return s;
}
function c4Nega(b,d,al,be,p){
  const mv=c4Moves(b);if(!mv.length)return 0;
  if(d===0)return c4Eval(b,p);
  let best=-Infinity;
  for(const c of mv){
    const r=c4Put(b,c,p);
    const v=c4Win(b,r,c)?1e6+d:-c4Nega(b,d-1,-be,-al,3-p);
    b[r][c]=0;
    if(v>best)best=v;if(best>al)al=best;if(al>=be)break;
  }
  return best;
}
function c4Cpu(b,level){
  const mv=c4Moves(b);
  if(level==='leicht'&&Math.random()<.35)return pick(mv);
  const depth={leicht:2,mittel:4,schwer:6}[level]||4;
  let best=-Infinity,bc=mv[0];
  for(const c of mv){
    const r=c4Put(b,c,2);
    let v=c4Win(b,r,c)?1e6+99:-c4Nega(b,depth-1,-Infinity,Infinity,1);
    b[r][c]=0;v+=Math.random()*.4;
    if(v>best){best=v;bc=c}
  }
  return bc;
}

function c4Start(){
  const o=G.o;G.cpu=false;
  if(!G.team){
    const a=Math.min(o.a,S.P.length-1);
    if(o.vs==='cpu'||S.P.length<2){
      G.cpu=true;
      G.pi=[a,-1];
      G.ents=[{name:S.P[a],sub:'',emoji:'👑',av:(sz,cls)=>av(a,cls,sz)},{name:'Computer',sub:'Stufe: '+o.lvl,emoji:'🤖',av:(sz,cls)=>botAv(sz,cls)}];
    }else{
      const b=(o.b===a?(a+1)%S.P.length:Math.min(o.b,S.P.length-1));
      G.pi=[a,b];
      G.ents=[a,b].map(i=>({name:S.P[i],sub:'',emoji:'👑',av:(sz,cls)=>av(i,cls,sz)}));
    }
    G.pts=[0,0];
  }
  G.need=Math.ceil(o.best/2);G.r=0;G.ix=[0,0];c4Round();
}
function c4Mover(e){
  if(G.team){const tm=G.tm[e],i=tm[G.ix[e]++%tm.length];G.mi=i;return S.P[i]}
  G.mi=(G.pi&&G.pi[e]>=0)?G.pi[e]:0;return G.ents[e].name;
}
function c4Round(){
  G.bd=Array.from({length:c4Rows},()=>Array(c4Cols).fill(0));
  G.turn=G.r%2;G.over=false;G.busy=false;G.last=null;G.winCells=null;
  G.mover=c4Mover(G.turn);

function c4Board(){
  let h='';
  for(let c=0;c<c4Cols;c++){
    h+=`<div class="c4col">`;
    for(let r=0;r<c4Rows;r++){
      const v=G.bd[r][c],isLast=G.last&&G.last[0]===r&&G.last[1]===c,isWin=G.winCells&&G.winCells.some(x=>x[0]===r&&x[1]===c);
      h+=`<div class="c4c">${v?`<i class="d p${v}${isLast?' drop':''}${isWin?' win':''}" style="--f:${r+1}"></i>`:''}</div>`;

function c4Banner(){
  const e=G.turn,who=G.team?`${TN[e][0]} Team ${TN[e][1]} · ${esc(G.mover)}`:esc(G.ents[e].name);
  return `<i class="dot p${e+1}"></i><span>${who} ${G.cpu&&e===1?'denkt …':'ist dran'}</span>`;
}
function c4Head(){
  return `<div class="c4s">${[0,1].map(e=>`<div class="c4p ${G.turn===e&&!G.over?'on':''}" id="c4p${e}">${G.ents[e].av(34)}<div><div class="nm">${esc(G.ents[e].name.replace(/^Team /,''))}</div><div class="sm"><i class="dot p${e+1}"></i> ${G.pts[e]} / ${G.need}</div></div></div>`).join('')}</div>`;
}
function c4Screen(){

  c4Bind();
}
/* Wischen: Finger aufsetzen, Spalte per Wischen wechseln, loslassen = Stein fällt */
function c4Col(x){
  const b=$('c4b'),r=b.getBoundingClientRect(),pad=10,gap=6,w=(r.width-2*pad-6*gap)/c4Cols;
  return Math.max(0,Math.min(c4Cols-1,Math.floor((x-r.left-pad+gap/2)/(w+gap))));
}
function c4Hov(c){document.querySelectorAll('#c4b .c4col').forEach((el,i)=>el.classList.toggle('hv',i===c))}
function c4Bind(){
  const b=$('c4b');if(!b)return;
  b.addEventListener('pointerdown',e=>{
    if(G.busy||G.over)return;
    G.dn=true;try{b.setPointerCapture(e.pointerId)}catch(_){}
    c4Hov(c4Col(e.clientX));e.preventDefault();
  });
  b.addEventListener('pointermove',e=>{if(G.dn)c4Hov(c4Col(e.clientX))});
  b.addEventListener('pointerup',e=>{if(!G.dn)return;G.dn=false;const c=c4Col(e.clientX);c4Hov(-1);c4Drop(c)});
  b.addEventListener('pointercancel',()=>{G.dn=false;c4Hov(-1)});
}
function c4Drop(c){
  if(G.busy||G.over)return;
  const r=c4Put(G.bd,c,G.turn+1);
  if(r<0){vib(40);sfx.bad();return}
  G.last=[r,c];sfx.pop();vib(15);
  const line=c4Line(G.bd,r,c);
  $('c4b').innerHTML=c4Board();
  if(line){G.over=true;G.winCells=line;G.busy=true;setTimeout(()=>{$('c4b')&&($('c4b').innerHTML=c4Board());c4Won(G.turn)},650);return}
  if(!c4Moves(G.bd).length){G.over=true;setTimeout(c4Draw,500);return}
  G.turn=1-G.turn;G.mover=c4Mover(G.turn);
  const bd=$('c4b');if(bd)bd.setAttribute('data-t',G.turn);
  const t=$('c4t');if(t)t.innerHTML=c4Banner();
  [0,1].forEach(e=>{const el=$('c4p'+e);if(el)el.classList.toggle('on',G.turn===e)});
  if(G.cpu&&G.turn===1)c4CpuMove();
}
function c4CpuMove(){
  G.busy=true;
  setTimeout(()=>{
    if(!$('c4b'))return;
    const c=c4Cpu(G.bd.map(r=>r.slice()),G.o.lvl);
    G.busy=false;c4Drop(c);
  },G.o.lvl==='schwer'?700:520);
}
function c4Won(e){
  G.pts[e]++;G.busy=false;
  const series=G.pts[e]>=G.need;
  const botWin=G.cpu&&e===1;
  if(botWin)sfx.bad();else{confetti(series?160:80,GOLD);sfx.win()}
  const name=G.team?`Team ${TN[e][1]}`:G.ents[e].name;
  const r=$('c4r');if(!r)return;
  r.innerHTML=`<div class="card ans" style="margin-top:14px"><div style="font-size:50px;animation:pop .6s both">${botWin?'🤖':'🎉'}</div><div class="big">${esc(name)} gewinnt${series?' die Serie!':' die Runde!'}</div><div class="sm">Stand ${G.pts[0]} : ${G.pts[1]}</div><button onclick="${series?'finish({unit:\' Siege\'})':'G.r++;c4Round()'}">${series?'Endergebnis 🏆':'Nächste Runde'}</button></div>`;
  [0,1].forEach(i=>{const el=$('c4p'+i);if(el)el.classList.remove('on')});
  r.scrollIntoView&&r.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function c4Draw(){
  sfx.ok();
  const r=$('c4r');if(!r)return;
  r.innerHTML=`<div class="card ans" style="margin-top:14px"><div style="font-size:50px">🤝</div><div class="big">Unentschieden!</div><p>Das Brett ist voll. Diese Runde wird wiederholt.</p><button onclick="c4Round()">Nochmal</button></div>`;
}

  G.plan=plan(G.o.rounds);G.t=0;G.tc=S.P.map(()=>0);tPool();tHand();
}
function tHand(){
  const p=G.plan[G.t];G.a=p.a;G.e=p.e;
  const tag=G.team?`Team ${TN[G.e][0]} ${TN[G.e][1]}`:'';
  hand(G.a,`Nur ${esc(S.P[G.a])} schaut aufs Display. ${G.team?'Das Team rät, alle anderen passen auf die verbotenen Wörter auf!':'Alle anderen: raten – und „Tabu!“ rufen, wenn ein verbotenes Wort fällt.'}`,tPlay,prg(G.t,G.plan.length,`Auftritt ${G.t+1} von ${G.plan.length}`),tag);
}
function tPlay(){
  G.cor=[];G.tabu=0;G.skips=0;G.card=tNext();G.total=G.o.secs;G.end=Date.now()+G.total*1000;G.lastS=-1;
  scr(`<div class="row" style="justify-content:space-between;align-items:center;margin-top:6px"><span class="twc" style="background:rgba(53,224,161,.15);border-color:rgba(53,224,161,.5)">✓ <b id="cnt">0</b></span><span class="twc" style="background:rgba(255,46,77,.18);border-color:rgba(255,46,77,.5)">🚫 <b id="tbc">0</b></span></div>
  <div class="ringw" id="rw"><svg viewBox="0 0 120 120"><defs><linearGradient id="grd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f43f5e"/><stop offset="1" stop-color="#f97316"/></linearGradient></defs><circle class="rbg" cx="60" cy="60" r="54"/><circle id="rg" class="rfg" cx="60" cy="60" r="54" stroke-dasharray="${PGR}" stroke-dashoffset="0" transform="rotate(-90 60 60)"/></svg><div class="rt" id="tt">${G.total}</div></div>
  <div class="word" id="w"></div>
  <div class="row"><button class="ok" style="flex:2" onclick="tOk()">✓ Erraten</button><button class="sec" style="flex:1" onclick="tTabu()">🚫 Tabu!</button></div>
  <button class="sec" id="sk" onclick="tSkip()">↷ Überspringen</button>
  <p class="sm" style="text-align:center">Sag weder den Begriff noch eines der verbotenen Wörter!</p>`);
  tDraw();clearInterval(G.iv);G.iv=setInterval(tTick,100);
}
function tDraw(){
  const w=$('w');if(!w)return;const c=G.card;
  w.innerHTML=`<small>${esc(c[0])}</small><span>${esc(c[1][0])}</span><div class="tbw">${c[1].slice(1).map(f=>`<i>${esc(f)}</i>`).join('')}</div>`;
  w.classList.remove('flipin');void w.offsetWidth;w.classList.add('flipin');
  $('cnt').textContent=G.cor.length;$('tbc').textContent=G.tabu;
  const sk=$('sk');sk.textContent=`↷ Überspringen (${3-G.skips})`;sk.style.opacity=G.skips>=3?.4:1;
}
function tTick(){
  const left=Math.max(0,(G.end-Date.now())/1000),rg=$('rg');
  if(!rg){clearInterval(G.iv);return}
  rg.setAttribute('stroke-dashoffset',PGR*(1-left/G.total));
  const c=Math.ceil(left);$('tt').textContent=c;
  if(left<=10)$('rw').classList.add('hot');
  if(left<=5&&c!==G.lastS){G.lastS=c;vib(25);sfx.tick()}
  if(left<=0)tEnd();
}
function tOk(){
  if($('pk'))return;
  G.cor.push(G.card[1][0]);vib(30);sfx.ok();
  if(G.team){confetti(26,['#35e0a1','#f43f5e','#fff']);G.card=tNext();tDraw();return}
  document.querySelector('.screen').insertAdjacentHTML('beforeend',`<div class="pk" id="pk"><div><h2>Wer hat's erraten?</h2>
  ${S.P.map((p,i)=>i===G.a?'':`<button class="opt" style="--k:${i}" onclick="tPick(${i})">${av(i)}<span>${esc(p)}</span></button>`).join('')}
  <button class="sec" onclick="tPick(-1)">Alle gemeinsam / egal</button></div></div>`);
}
function tPick(i){
  if(i>=0)G.pts[i]++;
  const pk=$('pk');if(pk)pk.remove();
  confetti(26,['#35e0a1','#f43f5e','#fff']);G.card=tNext();tDraw();
}
function tTabu(){if($('pk'))return;G.tabu++;vib([80,40,80]);sfx.bad();G.card=tNext();tDraw()}
function tSkip(){if(G.skips>=3||$('pk'))return;G.skips++;vib(10);G.card=tNext();tDraw()}
function tEnd(){
  clearInterval(G.iv);flash();sfx.bad();
  const net=Math.max(0,G.cor.length-G.tabu);G.pts[G.e]+=net;G.tc[G.a]+=G.cor.length;G.t++;
  const last=G.t>=G.plan.length;
  scr(`<div class="card ans"><div style="font-size:56px;animation:pop .6s both">⏰</div><div class="big">Zeit ist um!</div>
  <p style="margin:4px 0 10px">${G.team?'Team '+TN[G.e][1]+' ('+esc(S.P[G.a])+')':esc(S.P[G.a])}: <b style="color:var(--ok)">${G.cor.length}</b> erraten, <b style="color:var(--red2)">${G.tabu}</b> Tabu${G.tabu==1?'':'s'}</p>
  <div class="num" style="font-size:54px;font-weight:900;color:var(--ok)">+${net}</div>
  ${G.cor.length?`<div class="chips" style="justify-content:center;margin-top:12px">${G.cor.map(w=>`<span class="chip on">${esc(w)}</span>`).join('')}</div>`:'<p>Diesmal nichts – beim nächsten Mal!</p>'}</div>
  ${boardHTML(G.pts)}
  <button onclick="${last?'finish()':'tHand()'}">${last?'Endergebnis 🏆':'Nächster Auftritt'}</button>`);
  if(net>=3){confetti(100,['#f43f5e','#f97316','#fff','#35e0a1']);sfx.win()}
}

GAMES.hilo={name:'Mehr oder weniger',e:'⚖️',tag:'Was ist höher, älter, größer?',c:['#84cc16','#16a34a'],min:2,teams:false,
  desc:'Zwei Dinge, eine Frage: Welches ist höher, älter, größer oder weiter weg? Schnell entscheiden!',
  rules:'Jede Runde zeigt zwei Möglichkeiten und eine Frage („Was ist höher?“, „Was geschah früher?“ …). Jeder wählt heimlich. Wer richtig liegt, bekommt <b>+1</b>. Danach werden die echten Werte gezeigt. Bei Länderwerten und Entfernungen sind die Zahlen ungefähr. Mit Timer zählt eine nicht abgegebene Wahl als falsch.',

  start:hiStart};
function hiPair(list,ratio,diff){
  for(let t=0;t<80;t++){
    const a=pick(list),b=pick(list);if(a===b)continue;
    const hi=Math.max(a[1],b[1]),lo=Math.min(a[1],b[1]);
    if(ratio?(lo>0&&hi/lo>=ratio):(hi-lo>=diff))return Math.random()<.5?[a,b]:[b,a];
  }
  const a=list[0],b=list[list.length-1];return [a,b];
}
function hiDuel(c){
  if(c===HLC[0]){const [a,b]=hiPair(MOUNT.concat(BUILD),1.1);return {q:'Was ist höher?',a:[cap(a[0]),a[1]],b:[cap(b[0]),b[1]],pick:'max',unit:'m'}}
  if(c===HLC[1]){const [a,b]=hiPair(HEV,0,8);return {q:'Was geschah früher?',a:a,b:b,pick:'min',unit:'Jahr'}}
  if(c===HLC[2]){
    if(Math.random()<.5){const [a,b]=hiPair(HPOP,1.15);return {q:'Welches Land hat mehr Einwohner?',a,b,pick:'max',unit:'Mio. Einwohner',approx:true}}
    const [a,b]=hiPair(HARE,1.15);return {q:'Welches Land ist flächenmäßig größer?',a,b,pick:'max',unit:'Tsd. km²',approx:true};
  }
  if(c===HLC[3]){
    const r=x=>x*Math.PI/180,m=CITY[0];
    const dist=ct=>{const dl=r(ct[2]-m[2]),dp=r(ct[1]-m[1]),h=Math.sin(dp/2)**2+Math.cos(r(m[1]))*Math.cos(r(ct[1]))*Math.sin(dl/2)**2;return Math.round(2*6371*Math.asin(Math.sqrt(h))/10)*10};
    const list=CITY.slice(1).map(ct=>[ct[0],dist(ct)]).filter(x=>x[1]>=50),[a,b]=hiPair(list,1.15);
    return {q:'Welche Stadt ist von München weiter entfernt?',a,b,pick:'max',unit:'km',approx:true};
  }
  const [a,b]=hiPair(PEOPLE,0,6);return {q:'Wer wurde älter?',a,b,pick:'max',unit:'Jahre'};
}
const hiVal=(d,v)=>d.unit==='Jahr'?String(v):`${d.approx?'ca. ':''}${fmt(v)} ${d.unit}`;
const hiOk=d=>d.pick==='max'?(d.a[1]>d.b[1]?0:1):(d.a[1]<d.b[1]?0:1);
function hiMake(){
  const sel=HLC.filter(k=>G.o.cats[k]),cats=sel.length?sel:HLC;let d=null;
  for(let t=0;t<40;t++){
    d=hiDuel(pick(cats));const k=d.a[0]+'|'+d.b[0],k2=d.b[0]+'|'+d.a[0];
    if(G.seen.has(k)||G.seen.has(k2)||recent('h',k)||recent('h',k2))continue;
    G.seen.add(k);mark('h',k);return d;
  }
  return d;
}
function hiStart(){G.r=0;G.rounds=G.o.rounds;G.hit=S.P.map(()=>0);G.seen=new Set();hiRound()}
function hiProg(){return prg(G.r+G.i/S.P.length,G.rounds,`Runde ${G.r+1} von ${G.rounds}`)}
function hiRound(){
  G.d=hiMake();G.i=0;G.pk=[];
  if(NET.host){hiPar();return}
  hand(G.i,'Entscheide schnell – niemand schaut mit!',hiVote,hiProg());
}
function hiCard(pi,online){
  const d=G.d;
  return `<div class="card"><div class="row" style="align-items:center;gap:10px;margin-bottom:10px">${av(pi)}<span class="sm">${esc(S.P[pi])} wählt</span></div>
  <div class="q" style="margin:4px 0 14px">${esc(d.q)}</div>
  ${[d.a,d.b].map((o,k)=>`<button class="opt" style="--k:${k}" ${online?`data-sub="v" data-v="${k}"`:`onclick="hiPick(${k},this)"`}><span>${esc(o[0])}</span></button>`).join('')}</div>`;
}
function hiVote(){scr(`${hiProg()}${hiCard(G.i,false)}`);if(G.o.timer)tmrShow(G.o.timer*1000,hiTimeUp)}
function hiNext(){G.i++;if(G.i<S.P.length)hand(G.i,'Entscheide schnell – niemand schaut mit!',hiVote,hiProg());else hiResult()}
function hiPick(k,btn){
  tmrHide();btn.classList.add('sel');vib(30);sfx.pop();document.querySelectorAll('.opt').forEach(b=>b.style.pointerEvents='none');
  setTimeout(()=>{G.pk[G.i]=k;hiNext()},350);
}
function hiTimeUp(){tmrHide();sfx.bad();vib([60,40,60]);G.pk[G.i]=null;toast('⏰ Zeit um – keine Wahl');hiNext()}
function hiPar(){
  parBegin({head:hiProg,dur:G.o.timer?[G.o.timer*1000]:null,msg:'Alle entscheiden gleichzeitig …',steps:[
    {k:'v',timeout:pi=>{G.pk[pi]=null},html:pi=>hiCard(pi,true),
     sub:(pi,d)=>{const k=Number(d.v);if(d.v==null||(k!==0&&k!==1))return 'Ungültige Wahl.';G.pk[pi]=k;return true}}
  ],done:hiResult});
}
function hiResult(){
  const d=G.d,ok=hiOk(d),last=G.r+1>=G.rounds;
  const gain=S.P.map((_,i)=>G.pk[i]===ok?1:0);gain.forEach((g,i)=>{G.pts[i]+=g;G.hit[i]+=g});
  scr(`${prg(G.r+1,G.rounds,`Runde ${G.r+1} von ${G.rounds}`)}<div class="card ans"><div class="q" style="font-size:19px">${esc(d.q)}</div></div>
  ${[d.a,d.b].map((o,k)=>`<div class="res ${k===ok?'best':''}" style="--d:${(.3+k*.4).toFixed(2)}s"><div class="rh"><div class="nm" style="font-size:18px">${esc(o[0])}${k===ok?'<span class="tag b">✓ richtig</span>':''}</div><div style="font-weight:850">${esc(hiVal(d,o[1]))}</div></div></div>`).join('')}
  <div class="late" style="--d:1.1s">${S.P.map((p,i)=>`<div class="sb"><span class="nm" style="width:auto;flex:1">${av(i,'',26)} ${esc(p)}</span><span class="pt" style="width:auto">${G.pk[i]==null?'⏰ keine Wahl':G.pk[i]===ok?'✅ +1':'❌'}</span></div>`).join('')}${boardHTML(G.pts)}<button onclick="${last?'finish()':'G.r++;hiRound()'}">${last?'Endergebnis 🏆':'Nächste Runde'}</button></div>`);
  if(gain.some(g=>g)){setTimeout(()=>{confetti(40,GOLD);sfx.ok()},400)}else sfx.bad();
}

  rules:'Wer dran ist, deckt zwei Karten auf. Sind sie gleich, bleiben sie liegen, es gibt ein Paar und du darfst nochmal. Sind sie verschieden, werden sie wieder umgedreht und der Nächste ist dran. Merkt euch, wo was lag! Gewonnen hat, wer die meisten Paare hat. <b>Allein</b> zählt, wie wenige Züge du brauchst.',

  start:mmStart};
function mmStart(){
  const n=G.o.pairs;
  G.cards=shuffle(shuffle(MEMO).slice(0,n).flatMap(e=>[e,e]));
  G.st=G.cards.map(()=>0);G.own=G.cards.map(()=>-1);G.open=[];G.busy=false;G.cur=0;G.moves=0;G.left=n;
  mmScreen();
}
function mmScreen(){
  const solo=S.P.length<2,cols=G.cards.length>16?6:4;
  scr(`${logo('Memory',1)}${solo?`<div class="sm" style="margin:6px 0">Züge: <b>${G.moves}</b> · Paare: <b>${G.pts[0]}</b> / ${G.pts[0]+G.left}</div>`:clsHead(' Paare')}
  <div class="sm" style="margin:4px 0;text-align:center">${solo?'Finde alle Paare mit möglichst wenigen Zügen':`${esc(S.P[G.cur])} ist dran`}</div>
  <div class="mmb" style="--cols:${cols}">${G.cards.map((e,i)=>{const s=G.st[i];return `<button class="mc kx ${s?'up':''} ${s===2?'done':''}" ${s===2&&!solo?`style="--oc:${hueC(G.own[i])}"`:''} onclick="mmFlip(${i})" aria-label="Karte ${i+1}">${s?e:'?'}</button>`}).join('')}</div>`);
}
function mmFlip(i){
  if(G.busy||G.st[i]!==0)return;
  const g=G;G.st[i]=1;G.open.push(i);sfx.pop();vib(15);
  if(G.open.length<2){mmScreen();return}
  G.moves++;
  const [a,b]=G.open;
  if(G.cards[a]===G.cards[b]){
    G.st[a]=G.st[b]=2;G.own[a]=G.own[b]=G.cur;G.pts[G.cur]++;G.open=[];G.left--;sfx.ok();vib([20,20,20]);
    mmScreen();
    if(!G.left){G.busy=true;setTimeout(()=>{if(G===g)mmEnd()},900)}
    return;
  }
  G.busy=true;mmScreen();sfx.bad();
  setTimeout(()=>{if(G!==g)return;G.st[a]=G.st[b]=0;G.open=[];G.busy=false;G.cur=(G.cur+1)%S.P.length;mmScreen()},1100);
}
function mmEnd(){S.P.length<2?finish({asc:true,vals:[G.moves],unit:' Züge'}):finish({unit:' Paare'})}

const HGP=['M10 132H80M30 132V14','M30 14H85M85 14V32','M85 32m-10 10a10 10 0 1 0 20 0a10 10 0 1 0 -20 0','M85 52V88','M85 60L68 76','M85 60L102 76','M85 88L70 112','M85 88L100 112'];
function hgScreen(){

function hgGuess(L){
  if(G.res||!/^[A-Z]$/.test(L)||G.gs.includes(L))return;

  opts:()=>`<p class="sm" style="margin:0 0 8px">Codes pro Spieler</p>${seg('code','rounds',[1,2,3])}`,

function ckStart(){G.n=S.P.length;G.rounds=G.o.rounds;G.k=0;ckNext()}
function ckProg(){return prg(G.k,G.rounds*G.n,`Code ${G.k+1} von ${G.rounds*G.n}`)}
function ckNext(){
  if(G.k>=G.rounds*G.n){finish({asc:true,unit:' Versuche'});return}
  G.who=G.k%G.n;G.sec=Array.from({length:4},()=>Math.floor(Math.random()*6));G.hist=[];G.gu=[];

function ckEval(g,s){
  let b=0;const gl=[],sl=[];
  g.forEach((c,i)=>{if(c===s[i])b++;else{gl.push(c);sl.push(s[i])}});
  let w=0;gl.forEach(c=>{const j=sl.indexOf(c);if(j>=0){w++;sl.splice(j,1)}});
  return {b,w};
}
const ckPegs=h=>`<span class="ckpg">${'<b class="pg b"></b>'.repeat(h.b)}${'<b class="pg w"></b>'.repeat(h.w)}${'<b class="pg"></b>'.repeat(4-h.b-h.w)}</span>`;

  scr(`${ckProg()}<div class="card"><div class="row" style="align-items:center;gap:10px;margin-bottom:8px">${av(G.who)}<span class="sm">${esc(S.P[G.who])} · Versuch ${G.hist.length+1} von 10</span></div>
  ${rows}${cur}

  <div class="row"><button class="sec" id="ckdel" onclick="ckDel()">⌫ Löschen</button><button class="ok" onclick="ckCheck()">Prüfen</button></div>
  <p class="sm" style="margin:10px 0 0"><b class="pg b"></b> richtige Farbe, richtiger Platz · <b class="pg w"></b> richtige Farbe, falscher Platz</p></div>`);
}
function ckPick(c){if(G.gu.length<4){G.gu.push(c);sfx.pop();ckScreen()}}
function ckDel(){if(G.gu.length){G.gu.pop();ckScreen()}}
function ckCheck(){
  if(G.gu.length<4){toast('Wähle erst vier Farben');vib(40);return}
  const r=ckEval(G.gu,G.sec);G.hist.push({g:G.gu.slice(),b:r.b,w:r.w});G.gu=[];
  if(r.b===4)ckDone(true);else if(G.hist.length>=10)ckDone(false);else{sfx.ok();ckScreen()}
}
function ckDone(ok){
  G.okk=ok;G.tries=G.hist.length;G.pts[G.who]+=ok?G.tries:11;

}
function ckResult(){
  const last=G.k+1>=G.rounds*G.n;
  scr(`${ckProg()}<div class="card ans"><div style="font-size:46px">${G.okk?'🔓':'🔒'}</div><div class="big" style="font-size:26px">${G.okk?`${esc(S.P[G.who])} knackt den Code in ${G.tries} ${G.tries==1?'Versuch':'Versuchen'}!`:`${esc(S.P[G.who])} schafft es nicht`}</div>
  <div class="ckr" style="justify-content:center">${G.sec.map(c=>`<i class="ckd">${CKC[c]}</i>`).join('')}</div><div class="sm">So lautete der Code</div></div>
  ${boardHTML(G.pts,{label:'Versuche gesamt (weniger ist besser, nicht geknackt = 11)',unit:''})}

}

const ttNm=k=>`<div class="row" style="flex-wrap:wrap">${S.names.map((n,i)=>`<button class="${OPT.ttt[k]===i?'':'sec'} sg" style="flex:0 0 auto;padding:10px 14px" onclick="ttSel('${k}',${i})">${esc(n.trim()||'?')}</button>`).join('')}</div>`;

function ttStart(){
  const o=G.o,a=Math.min(o.a,S.P.length-1);G.cpu=false;

    G.cpu=true;G.pi=[a,-1];

  }else{

  }
  G.pts=[0,0];G.need=Math.ceil(o.best/2);G.r=0;ttNew();

const TTL=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const ttLine=b=>TTL.find(l=>b[l[0]]&&b[l[0]]===b[l[1]]&&b[l[0]]===b[l[2]])||null;
function ttMM(b,p,me,d){
  const l=ttLine(b);if(l)return b[l[0]]===me?10-d:d-10;
  if(b.every(Boolean))return 0;
  let best=p===me?-99:99;
  for(let i=0;i<9;i++)if(!b[i]){b[i]=p;const v=ttMM(b,3-p,me,d+1);b[i]=0;best=p===me?Math.max(best,v):Math.min(best,v)}
  return best;
}
function ttBest(b,me,lvl){
  const mv=[];for(let i=0;i<9;i++)if(!b[i])mv.push(i);
  if(lvl==='leicht'&&Math.random()<.45)return pick(mv);
  let best=-99,cand=[];
  mv.forEach(i=>{b[i]=me;const v=ttMM(b,3-me,me,1);b[i]=0;if(v>best){best=v;cand=[i]}else if(v===best)cand.push(i)});
  return pick(cand);
}
function ttNew(){
  G.bd=Array(9).fill(0);G.turn=G.r%2;G.over=false;G.win=null;G.draw=false;
  ttScreen();
  if(G.cpu&&G.turn===1)ttCpuSoon();
}
function ttCpuSoon(){const g=G;setTimeout(()=>{if(G!==g||G.over)return;ttMove(ttBest(G.bd,2,G.o.lvl))},650)}
function ttScreen(){
  const lock=G.over||(G.cpu&&G.turn===1),series=G.over&&!G.draw&&G.pts[G.turn]>=G.need;
  const head=`<div class="c4s">${[0,1].map(e=>`<div class="c4p ${G.turn===e&&!G.over?'on':''}">${G.ents[e].av(34)}<div><div class="nm">${esc(G.ents[e].name.replace(/^Team /,''))}</div><div class="sm"><b class="sy s${e+1}">${e?'◯':'✕'}</b> ${G.pts[e]} / ${G.need}</div></div></div>`).join('')}</div>`;
  const res=!G.over?'':G.draw
    ?`<div class="card ans" style="margin-top:14px"><div style="font-size:50px">🤝</div><div class="big">Unentschieden!</div><p>Diese Runde wird wiederholt.</p><button onclick="ttNew()">Nochmal</button></div>`
    :`<div class="card ans" style="margin-top:14px"><div style="font-size:50px;animation:pop .6s both">${G.cpu&&G.turn===1?'🤖':'🎉'}</div><div class="big">${esc(G.ents[G.turn].name)} gewinnt ${series?'die Serie!':'die Runde!'}</div><div class="sm">Stand ${G.pts[0]} : ${G.pts[1]}</div><button onclick="${series?"finish({unit:' Siege'})":'G.r++;ttNew()'}">${series?'Endergebnis 🏆':'Nächste Runde'}</button></div>`;
  scr(`<div class="sm" style="margin:6px 0">Runde ${G.r+1} · Best of ${G.o.best}</div>${head}
  <div class="sm" style="text-align:center;margin:8px 0">${G.over?'':`${esc(G.ents[G.turn].name)} ${G.cpu&&G.turn===1?'denkt …':'ist dran'}`}</div>
  <div class="ttb">${G.bd.map((v,i)=>`<button class="ttc kx ${v?'s'+v:''} ${G.win&&G.win.includes(i)?'win':''}" data-kn="${i+1}" ${v||lock?'disabled':''} onclick="ttPlay(${i})" aria-label="Feld ${i+1}">${v===1?'✕':v===2?'◯':''}</button>`).join('')}</div>${res}`);
}
function ttPlay(i){if(G.over||G.bd[i]||(G.cpu&&G.turn===1))return;ttMove(i)}
function ttMove(i){
  if(G.over||G.bd[i])return;
  G.bd[i]=G.turn+1;sfx.pop();vib(15);
  const l=ttLine(G.bd);
  if(l){G.over=true;G.win=l;G.pts[G.turn]++;sfx.win();confetti(60,GOLD)}
  else if(G.bd.every(Boolean)){G.over=true;G.draw=true;sfx.bad()}
  else G.turn=1-G.turn;
  ttScreen();
  if(!G.over&&G.cpu&&G.turn===1)ttCpuSoon();
}

GAMES.dots={name:'Käsekästchen',e:'🔲',tag:'Linien ziehen, Kästchen sichern',c:['#eab308','#f97316'],min:2,teams:false,
  desc:'Der Papier-Klassiker: Linien zwischen Punkten ziehen und möglichst viele Kästchen schließen.',
  rules:'Wer dran ist, zieht <b>eine Linie</b> zwischen zwei benachbarten Punkten. Wer damit ein Kästchen schließt, bekommt es (mit seiner Farbe) und <b>darf nochmal</b>. Schließt man keins, ist der Nächste dran. Wenn alle Linien gezogen sind, gewinnt, wer die meisten Kästchen hat. Tipp: Verschenke keine dritte Linie an ein Kästchen!',
  opts:()=>`<p class="sm" style="margin:0 0 8px">Spielfeld (Kästchen pro Seite)</p>${seg('dots','size',[3,4,5],v=>v+'×'+v)}`,
  start:dsStart};
function dsStart(){
  const N=G.o.size;G.n=N;
  G.h=Array.from({length:N+1},()=>Array(N).fill(0));G.v=Array.from({length:N},()=>Array(N+1).fill(0));G.bx=Array.from({length:N},()=>Array(N).fill(-1));
  G.cur=0;G.left=N*N;G.fin=false;dsScreen();
}
function dsScreen(){
  const N=G.n;let h='';
  for(let gr=0;gr<=2*N;gr++)for(let gc=0;gc<=2*N;gc++){
    if(gr%2===0&&gc%2===0)h+='<i class="dd"></i>';
    else if(gr%2===0){const r=gr/2,c=(gc-1)/2,o=G.h[r][c];h+=`<b class="de h${o?' on':''}" ${o?`style="--c:${hueC(o-1)}"`:`onclick="dsEdge('h',${r},${c})" aria-label="Linie"`}></b>`}
    else if(gc%2===0){const r=(gr-1)/2,c=gc/2,o=G.v[r][c];h+=`<b class="de v${o?' on':''}" ${o?`style="--c:${hueC(o-1)}"`:`onclick="dsEdge('v',${r},${c})" aria-label="Linie"`}></b>`}
    else{const r=(gr-1)/2,c=(gc-1)/2,o=G.bx[r][c];h+=`<div class="db${o>=0?' own':''}" ${o>=0?`style="--c:${hueC(o)}"`:''}>${o>=0?esc((S.P[o]||'?').trim().charAt(0).toUpperCase()):''}</div>`}
  }
  scr(`${logo('Käsekästchen',1)}${clsHead(' ▣')}<div class="sm" style="text-align:center;margin:8px 0">${G.fin?'Alle Kästchen sind vergeben':`${esc(S.P[G.cur])} ist dran`}</div><div class="dsb" style="--n:${N}">${h}</div>`);
}
function dsEdge(t,r,c){
  if(G.fin)return;const a=t==='h'?G.h:G.v;if(!a||!a[r]||a[r][c])return;
  const g=G,N=G.n;a[r][c]=G.cur+1;let got=0;
  const chk=(br,bc)=>{if(br<0||bc<0||br>=N||bc>=N||G.bx[br][bc]>=0)return;if(G.h[br][bc]&&G.h[br+1][bc]&&G.v[br][bc]&&G.v[br][bc+1]){G.bx[br][bc]=G.cur;got++}};
  if(t==='h'){chk(r-1,c);chk(r,c)}else{chk(r,c-1);chk(r,c)}
  if(got){G.pts[G.cur]+=got;G.left-=got;sfx.ok();vib(25)}else{G.cur=(G.cur+1)%S.P.length;sfx.pop()}
  if(!G.left){G.fin=true;dsScreen();setTimeout(()=>{if(G===g)finish({unit:' Kästchen'})},1300);return}
  dsScreen();
}
