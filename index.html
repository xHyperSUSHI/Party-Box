  opts:()=>`<p class="sm" style="margin:0 0 8px">Kategorien (<span id="slfcnt">${slfAll().length}</span> gewählt, 3 bis 10)</p><div class="chips">${SLFA.map((c,i)=>`<span class="chip ${OPT.slf.sel[c]?'on':''}" onclick="slfTog(${i},this)">${esc(c)}</span>`).join('')}${OPT.slf.custom.map((c,i)=>`<span class="chip on" onclick="slfDelCat(${i})">${esc(c)} ✕</span>`).join('')}</div><div class="row" style="margin-top:10px"><input id="slfn" class="txt" type="text" maxlength="20" autocomplete="off" placeholder="Eigene Kategorie …" style="margin:0;flex:1"><button class="sec ib" onclick="slfAddCat()" aria-label="Kategorie hinzufügen" style="margin:0">＋</button></div><p class="sm" style="margin:14px 0 8px">Spielweise</p>${seg('slf','mode',['zettel','digital'],v=>v==='zettel'?'✏️ Zettel & Stift':'⌨️ Digital tippen')}<p class="sm" style="margin:14px 0 8px">Runden</p>${seg('slf','rounds',[3,5,8])}${OPT.slf.mode==='digital'?`<p class="sm" style="margin:14px 0 8px">Zeit zum Tippen</p>${seg('slf','dtimer',[60,90,120],v=>v+' s')}<p class="sm" style="margin:14px 0 8px">Stopp-Regel</p>${seg('slf','stop',[true,false],v=>v?'✋ Erster fertig beendet':'Aus')}<p class="sm" style="margin:8px 0 0">Mit Stopp-Regel kann man erst „Fertig“ sagen, wenn alle Felder ausgefüllt sind – dann beendet das die Runde für alle (online: noch 4 Sekunden, an einem Gerät: die Folgenden haben nur so lange Zeit wie der Erste gebraucht hat, mindestens 20 s).</p><p class="sm" style="margin:8px 0 0">Online tippen alle gleichzeitig auf dem eigenen Gerät. An einem Gerät kommt jeder nacheinander dran (die anderen schauen weg). Die Punkte werden automatisch berechnet, falsche Wörter streicht ihr danach mit einem Tipp.</p>`:`<p class="sm" style="margin:14px 0 8px">Zeitlimit</p>${seg('slf','timer',[0,60,90],v=>v?v+' s':'Aus')}`}`,
  start:slfStart};
function slfStart(){
  let cats=slfAll();if(cats.length<3){cats=SLFA.slice(0,5);toast('Zu wenige Kategorien – es gelten Stadt, Land, Fluss, Tier, Beruf')}
  G.cats=cats.slice(0,10);G.pool=ordered(SLFL,x=>x,'g');G.rounds=Math.max(1,Math.min(G.o.rounds,G.pool.length));G.r=0;slfRound()}
function slfRound(){
  if(G.o.mode==='digital'){slfDRound();return}
  G.lt=G.pool[G.r];mark('g',G.lt);G.sc=S.P.map(()=>0);
  scr(`${prg(G.r,G.rounds,`Runde ${G.r+1} von ${G.rounds}`)}<div class="card hand"><div class="big" style="font-size:26px">Zettel und Stift bereit?</div><p>Gleich kommt der Buchstabe. Alle fangen gleichzeitig an.</p><button onclick="slfPlay()">Buchstabe aufdecken</button></div>`);
}
/* Buchstaben-Rad: 3D-Walze, nur die vordere Hälfte ist sichtbar; dreht, bremst ab und rastet beim Buchstaben ein */
function slfReelHTML(letter){
  const n=SLFL.length,th=360/n,h=74,r=Math.round(h/2/Math.tan(Math.PI/n)),idx=Math.max(0,SLFL.indexOf(letter)),fin=idx*th;
  const nm='slfspin'+G.r+'x'+(Date.now()%100000);   // eigener Name + feste Zahlen (kein var() in @keyframes: Safari-sicher)
  return `<div class="slfw" style="--h:${h}px"><style>@keyframes ${nm}{0%{transform:rotateX(${fin+1080}deg);animation-timing-function:cubic-bezier(.22,.6,.2,1);-webkit-animation-timing-function:cubic-bezier(.22,.6,.2,1)}88%{transform:rotateX(${fin-5}deg);animation-timing-function:ease-in-out;-webkit-animation-timing-function:ease-in-out}100%{transform:rotateX(${fin}deg)}}</style><div class="slfd" style="transform:rotateX(${fin}deg);-webkit-animation-name:${nm};animation-name:${nm}" data-fin="${fin}">${SLFL.map((c,i)=>`<div class="slfi" style="transform:rotateX(${(-i*th).toFixed(2)}deg) translateZ(${r}px)">${c}</div>`).join('')}</div><div class="slfm"></div></div>`;
}
function slfReelScreen(){
  scr(`${prg(G.r,G.rounds,`Runde ${G.r+1} von ${G.rounds}`)}<div class="card" style="text-align:center"><div class="sm">Der Buchstabe wird gezogen …</div>${slfReelHTML(G.lt)}<button class="sec" onclick="slfReelGo()">Überspringen</button></div>`);
}
function slfReel(next){
  G.reelNext=next;G.reelOn=true;const g=G,T=4800,n=14;
  slfReelScreen();
  for(let i=1;i<=n;i++)setTimeout(()=>{if(G===g&&g.reelOn)sfx.pop()},T*Math.pow(i/n,1.8));
  setTimeout(()=>{if(G===g&&g.reelOn){sfx.win();vib([40,30,40]);confetti(60,GOLD)}},T+100);
  setTimeout(()=>{if(G===g&&g.reelOn)slfReelGo()},T+1900);
}
function slfReelGo(){if(!G.reelOn)return;G.reelOn=false;const f=G.reelNext;G.reelNext=null;if(f)f()}
function slfPlay(){slfReel(slfShow)}
function slfShow(){
  scr(`${prg(G.r,G.rounds,`Runde ${G.r+1} von ${G.rounds}`)}<div class="card ans" style="text-align:center"><div class="sm">Der Buchstabe ist</div><div class="slfl">${G.lt}</div>
  <div class="chips" style="justify-content:center">${G.cats.map(c=>`<span class="chip on">${esc(c)}</span>`).join('')}</div>
  <p class="sm">Schreibt zu jeder Kategorie ein Wort mit ${G.lt}. Wer fertig ist, ruft „Stopp!“.</p><button onclick="slfStop()">✋ Stopp! Wir werten</button></div>`);
  sfx.pop();vib(40);
  if(G.o.timer)tmrShow(G.o.timer*1000,slfStop);
}
function slfStop(){tmrHide();sfx.bad();slfScore()}
function slfScore(){
  const last=G.r+1>=G.rounds;
  scr(`${prg(G.r+1,G.rounds,`Runde ${G.r+1} von ${G.rounds} · Buchstabe ${G.lt}`)}<div class="card"><div class="sm" style="margin-bottom:8px">Vergleicht eure Zettel und tragt die Punkte ein (10 · 5 · 20 pro Wort)</div>
  ${S.P.map((p,i)=>`<div class="sb">${av(i,'',30)}<span class="nm">${esc(p)}</span><div class="bar" style="background:none"></div><div class="stp"><button class="sec ib" onclick="slfAdj(${i},-5)" aria-label="Minus 5">−</button><b id="sc${i}">${G.sc[i]}</b><button class="sec ib" onclick="slfAdj(${i},5)" aria-label="Plus 5">+</button></div></div>`).join('')}</div>
  ${boardHTML(G.pts,{label:'Gesamt vor dieser Runde',unit:' P'})}
  <button onclick="slfCommit()">${last?'Endergebnis 🏆':'Runde werten'}</button>`);
}
/* --- Digital tippen --- */
const slfDProg=()=>prg(G.r+G.i/S.P.length,G.rounds,`Runde ${G.r+1} von ${G.rounds}`);
function slfDRound(){
  G.lt=G.pool[G.r];mark('g',G.lt);G.ans=[];G.bad=G.cats.map(()=>S.P.map(()=>false));G.i=0;G.stopT=null;G.stopBy=null;G.fix=G.cats.map(()=>S.P.map(()=>null));G.edit=null;
  slfReel(()=>{
    if(NET.host){slfDPar();return}
    hand(G.i,'Der Buchstabe steht fest – tippe deine Wörter!',slfDType,slfDProg());
  });
}
function slfForm(pi,online){
  const n=G.cats.length,f=G.cats.map((c,k)=>`<label class="sm" style="display:block;margin:10px 0 4px">${esc(c)}</label><input class="txt" type="text" maxlength="30" autocomplete="off" autocapitalize="words" ${online?`data-f="c${k}"`:`id="sf${k}"`} ${k<n-1?'data-nx="1"':(online?'data-enter="w"':'')} placeholder="${esc(c)} mit ${G.lt} …">`).join('');
  return `<div class="card"><div class="row" style="align-items:center;gap:10px;margin-bottom:4px">${av(pi)}<span class="sm">${esc(S.P[pi])} tippt</span></div>
  <div style="text-align:center"><div class="sm">Der Buchstabe ist</div><div class="slfl" style="font-size:84px;margin:0 0 4px">${G.lt}</div></div>${G.o.stop?`<p class="sm" style="margin:0;text-align:center">${!online&&G.stopT!=null?`⏱ ${esc(S.P[G.stopBy])} hat „Stopp“ gerufen – du hast ${G.stopT} s.`:'✋ Alle Felder ausgefüllt? Dann „Fertig“ – das beendet die Runde für alle.'}</p>`:''}${f}<div class="err" id="e"></div>
  <button ${online?'data-sub="w"':'onclick="slfDSubmit()"'}>Fertig ✓</button></div>`;
}
function slfDType(){
  scr(`${slfDProg()}${slfForm(G.i,false)}`);
  const l=$('sf'+(G.cats.length-1));if(l)l.addEventListener('keydown',e=>{if(e.key==='Enter')slfDSubmit()});
  setTimeout(()=>{const f=$('sf0');if(f)f.focus()},80);
  G.t0=Date.now();
  const lim=(G.o.stop&&G.stopT!=null)?Math.min(G.stopT,G.o.dtimer):G.o.dtimer;
  if(lim)tmrShow(lim*1000,slfDUp);
}
function slfDRead(){return G.cats.map((_,k)=>{const e=$('sf'+k);return e?String(e.value).trim().slice(0,30):''})}
function slfDSubmit(){
  const v=slfDRead();
  if(G.o.stop&&G.stopT==null){
    if(v.some(x=>!slfFilled(x))){const e=$('e');if(e)e.textContent='Stopp-Regel: Erst wenn alle Felder mit einem Wort ausgefüllt sind (nicht nur der Buchstabe), kannst du „Fertig“ sagen.';vib(60);return}
    G.stopT=Math.max(20,Math.round((Date.now()-G.t0)/1000));G.stopBy=G.i;
  }
  tmrHide();G.ans[G.i]=v;slfDNext();
}
function slfDUp(){tmrHide();sfx.bad();vib([60,40,60]);G.ans[G.i]=slfDRead();toast('⏰ Zeit um');slfDNext()}
function slfDNext(){G.i++;if(G.i<S.P.length)hand(G.i,'Gleich siehst du den Buchstaben – tippe deine Wörter!',slfDType,slfDProg());else slfReview()}
function slfDPar(){
  parBegin({head:slfDProg,dur:[G.o.dtimer*1000],msg:'Alle tippen gleichzeitig …',steps:[
    {k:'w',timeout:pi=>{G.ans[pi]=G.ans[pi]||G.cats.map(()=>'')},html:pi=>slfForm(pi,true),
     sub:(pi,d)=>{
       const v=G.cats.map((_,k)=>String((d.f||{})['c'+k]||'').trim().slice(0,30)),auto=d.v==='auto',first=G.o.stop&&!auto&&G.stopBy==null;
       if(first&&v.some(x=>!slfFilled(x)))return 'Stopp-Regel: Erst wenn alle Felder mit einem Wort ausgefüllt sind (nicht nur der Buchstabe), kannst du „Fertig“ sagen.';
       G.ans[pi]=v;
       if(first){G.stopBy=pi;slfStopNow(pi)}
       return true;
     }}
  ],done:slfReview});
}
const SLF_STOP_MS=4000;
function slfStopNow(pi){   // erster fertig: allen anderen bleiben nur noch ein paar Sekunden
  if(!PAR||!PAR.dur)return;
  if(PAR.st.filter(x=>x<PAR.steps.length).length<=1)return;   // sonst war es der Letzte
  PAR.end=Math.min(PAR.end,Date.now()+SLF_STOP_MS);
  const ms=Math.max(0,PAR.end-Date.now()),msg='✋ Stopp! '+S.P[pi]+' ist fertig';
  tmrShow(ms,()=>autoSub('#hw'));toast(msg);
  NET.m.forEach((m,i)=>{if(i>0&&isOpen(m)){sendTo(m,{t:'tm',ms});sendTo(m,{t:'err',m:msg})}});
}
function slfFilled(w){   // ein echtes Wort: mindestens 2 Buchstaben und nicht nur der Anfangsbuchstabe
  const t=String(w||'').trim();return t.replace(/[^A-Za-zÄÖÜäöüß]/g,'').length>=2&&norm(t)!==String(G.lt).toLowerCase();
}
function slfValid(w){const t=String(w||'').trim();if(!t)return false;const m=t.match(/[A-Za-zÄÖÜäöüß]/);return !!m&&m[0].toUpperCase()===G.lt&&slfFilled(t)}
const slfEff=(k,i)=>G.fix[k][i]||((G.ans[i]||[])[k]||'');
function slfNear(a,b){   // höchstens ein Tippfehler (Buchstabe falsch/fehlt/zu viel/vertauscht)
  if(a===b)return false;const la=a.length,lb=b.length;if(Math.abs(la-lb)>1)return false;
  if(la===lb){const d=[];for(let i=0;i<la;i++)if(a[i]!==b[i])d.push(i);
    return d.length===1||(d.length===2&&d[1]===d[0]+1&&a[d[0]]===b[d[1]]&&a[d[1]]===b[d[0]])}
  const [s,l]=la<lb?[a,b]:[b,a];let i=0;while(i<s.length&&s[i]===l[i])i++;return s.slice(i)===l.slice(i+1);
}
function slfCalc(){
  const pts=S.P.map(()=>0),det=G.cats.map(()=>S.P.map(()=>null));
  G.cats.forEach((_,k)=>{
    const e=S.P.map((_,i)=>{const w=slfEff(k,i);return slfValid(w)&&!G.bad[k][i]?norm(w):null});
    e.forEach((x,i)=>{if(x==null)return;const same=e.filter((y,j)=>j!==i&&y===x).length,others=e.filter((y,j)=>j!==i&&y!=null).length;const p=same?5:others?10:20;pts[i]+=p;det[k][i]=p});
  });
  return {pts,det};
}
function slfSuggest(k){   // fast gleiche Wörter (vermutlich Tippfehler): [i,j] mit i<j
  const out=[],e=S.P.map((_,i)=>{const w=slfEff(k,i);return slfValid(w)&&!G.bad[k][i]?norm(w):null});
  for(let i=0;i<e.length;i++)for(let j=i+1;j<e.length;j++)if(e[i]&&e[j]&&e[i].length>=5&&e[j].length>=5&&slfNear(e[i],e[j]))out.push([i,j]);
  return out;
}
function slfReview(){
  const c=slfCalc(),last=G.r+1>=G.rounds;
  const rows=G.cats.map((cat,k)=>{
    const chips=S.P.map((p,i)=>{
      const raw=(G.ans[i]||[])[k]||'',w=slfEff(k,i);if(!String(raw).trim())return `<span class="chip" style="opacity:.45">${esc(p)}: –</span>`;
      const v=slfValid(w),bad=G.bad[k][i]||!v,ed=G.edit&&G.edit.k===k&&G.edit.i===i;
      return `<span class="chip ${bad?'':'on'}" style="${bad?'text-decoration:line-through;opacity:.6':''}${ed?';outline:2px solid var(--gold)':''}" onclick="slfEdit(${k},${i})">${esc(p)}: ${esc(w)}${G.fix[k][i]?' ✎':''}${c.det[k][i]?` <b>+${c.det[k][i]}</b>`:''}</span>`}).join('');
    const sg=slfSuggest(k).map(([i,j])=>`<div class="sm" style="margin-top:10px">💡 „${esc(slfEff(k,i))}“ (${esc(S.P[i])}) und „${esc(slfEff(k,j))}“ (${esc(S.P[j])}) sehen fast gleich aus – Tippfehler?<button class="sec" style="margin-top:6px;padding:10px" onclick="slfSame(${k},${i},${j})">Als gleiches Wort werten</button></div>`).join('');
    let ed='';
    if(G.edit&&G.edit.k===k){
      const i=G.edit.i,bad=G.bad[k][i];
      ed=`<div style="margin-top:12px"><div class="sm" style="margin-bottom:6px">${esc(S.P[i])}: Schreibweise korrigieren</div><div class="row"><input id="slfe" class="txt" type="text" maxlength="30" autocomplete="off" value="${esc(slfEff(k,i))}" style="margin:0;flex:1"><button class="sec ib" onclick="slfFix()" aria-label="Übernehmen">✓</button></div>
      <div class="row" style="margin-top:8px"><button class="sec" style="margin:0;padding:10px" onclick="slfBad(${k},${i})">${bad?'Wieder zählen':'Wort streichen'}</button>${G.fix[k][i]?`<button class="sec" style="margin:0;padding:10px" onclick="slfUnfix(${k},${i})">Original</button>`:''}<button class="sec" style="margin:0;padding:10px" onclick="slfEdit(-1,-1)">Schließen</button></div></div>`;
    }
    return `<div class="card" style="padding:12px 14px"><div class="sm" style="margin-bottom:8px"><b style="color:var(--tx)">${esc(cat)}</b></div><div class="chips">${chips}</div>${sg}${ed}</div>`}).join('');
  scr(`${prg(G.r+1,G.rounds,`Runde ${G.r+1} von ${G.rounds} · Buchstabe ${G.lt}`)}${G.stopBy!=null?`<p class="sm" style="margin:4px 0 0">✋ Stopp gerufen von <b style="color:var(--tx)">${esc(S.P[G.stopBy])}</b></p>`:''}<p class="sm" style="margin:4px 0 0">Tippe ein Wort an, um die Schreibweise zu korrigieren (Tippfehler) oder es zu streichen (z. B. keine echte Stadt). Farbig = zählt, durchgestrichen = zählt nicht (auch wenn nur der Anfangsbuchstabe dasteht), ✎ = korrigiert.</p>${rows}
  ${boardHTML(c.pts,{label:'Punkte in dieser Runde',unit:' P'})}
  <button onclick="slfDCommit()">${last?'Endergebnis 🏆':'Runde werten'}</button>`);
  if(G.edit){const e=$('slfe');if(e)setTimeout(()=>{try{e.focus()}catch(x){}},60)}
}
function slfKeep(f){const sc=app.scrollTop;f();slfReview();app.scrollTop=sc}
function slfEdit(k,i){slfKeep(()=>{G.edit=(G.edit&&G.edit.k===k&&G.edit.i===i)||k<0?null:{k,i}})}
function slfFix(){
  const e=$('slfe');if(!e||!G.edit)return;const {k,i}=G.edit,v=e.value.trim().slice(0,30),raw=(G.ans[i]||[])[k]||'';
  if(!v){toast('Das Wort darf nicht leer sein');return}
  slfKeep(()=>{G.fix[k][i]=(v===raw)?null:v;G.edit=null});
}
function slfUnfix(k,i){slfKeep(()=>{G.fix[k][i]=null;G.edit=null})}
function slfSame(k,i,j){slfKeep(()=>{G.fix[k][j]=slfEff(k,i)})}
function slfBad(k,i){slfKeep(()=>{G.bad[k][i]=!G.bad[k][i]})}
function slfDCommit(){G.sc=slfCalc().pts;slfCommit()}
function slfAdj(i,d){G.sc[i]=Math.max(0,Math.min(100,G.sc[i]+d));const e=$('sc'+i);if(e)e.textContent=G.sc[i]}
function slfCommit(){
  S.P.forEach((_,i)=>G.pts[i]+=G.sc[i]);
  if(G.r+1>=G.rounds){finish({unit:' P'});return}
  G.r++;slfRound();
}

const bsNm=k=>`<div class="row" style="flex-wrap:wrap">${S.names.map((n,i)=>`<button class="${OPT.bs[k]===i?'':'sec'} sg" style="flex:0 0 auto;padding:10px 14px" onclick="bsSel('${k}',${i})">${esc(n.trim()||'?')}</button>`).join('')}</div>`;
GAMES.bs={name:'Schiffe versenken',e:'🚢',tag:'Der Klassiker auf dem Gitter',c:['#0ea5e9','#1d4ed8'],min:1,teams:false,

const BSL='ABCDEFGHIJ',bsLab=(n,i)=>BSL[i%n]+(Math.floor(i/n)+1);
function bsStart(){
  const o=G.o,a=Math.min(o.a,S.P.length-1);G.cpu=false;
  if(o.vs==='cpu'||S.P.length<2){
    G.cpu=true;G.pi=[a,-1];
    G.ents=[{name:S.P[a],sub:'',emoji:'👑',av:(sz,cls)=>av(a,cls,sz)},{name:'Computer',sub:'Stufe: '+o.lvl,emoji:'🤖',av:(sz,cls)=>botAv(sz,cls)}];
  }else{
    const b=(o.b===a?(a+1)%S.P.length:Math.min(o.b,S.P.length-1));
    G.pi=[a,b];G.ents=[a,b].map(i=>({name:S.P[i],sub:'',emoji:'👑',av:(sz,cls)=>av(i,cls,sz)}));
  }
  G.n=o.size==='klein'?8:10;G.ships=o.size==='klein'?[4,3,3,2]:[5,4,3,3,2];
  G.pts=[0,0];G.need=Math.ceil(o.best/2);G.r=0;bsNew();
}
function bsNew(){
  const m=G.n*G.n;
  G.fl=[null,null];G.own=[null,null];G.sh=[Array(m).fill(0),Array(m).fill(0)];G.over=false;G.msg='';G.last=-1;G.cb=false;
  bsPlaceFor(0);
}
function bsRandPlace(){   // zufällige, überlappungsfreie Flotte: Liste {len,cells}
  const n=G.n;
  for(let tries=0;tries<200;tries++){
    const used=new Set(),out=[];let okk=true;
    for(const len of G.ships){
      let placed=false;
      for(let k=0;k<200&&!placed;k++){
        const v=Math.random()<.5,r=Math.floor(Math.random()*(v?n-len+1:n)),c=Math.floor(Math.random()*(v?n:n-len+1));
        const cells=Array.from({length:len},(_,i)=>(r+(v?i:0))*n+c+(v?0:i));
        if(cells.some(x=>used.has(x)))continue;
        cells.forEach(x=>used.add(x));out.push({len,cells});placed=true;
      }
      if(!placed){okk=false;break}
    }
    if(okk)return out;
  }
  return [];
}
function bsBuild(e,placed){
  G.fl[e]=placed.map(p=>({len:p.len,cells:p.cells.slice(),hit:0,sunk:false}));
  G.own[e]=Array(G.n*G.n).fill(-1);G.fl[e].forEach((s,i)=>s.cells.forEach(c=>G.own[e][c]=i));
}
function bsNb(map,i,n){   // Nachbarn desselben Schiffs -> Klassen für zusammenhängende Schiffsform
  const s=map[i],c=i%n;
  return (c>0&&map[i-1]===s?' nl':'')+(c<n-1&&map[i+1]===s?' nr':'')+(i>=n&&map[i-n]===s?' nu':'')+(i<n*n-n&&map[i+n]===s?' nd':'');
}
function bsProg(){return `<div class="sm" style="margin:6px 0">Runde ${G.r+1} · Best of ${G.o.best}</div>`}
function bsPlaceFor(e){
  if(e>1){bsBegin();return}
  if(e===1&&G.cpu){bsBuild(1,bsRandPlace());bsBegin();return}
  G.pl={e,placed:[],dir:'h'};
  if(S.P.length>1)hand(G.pi[e],'Platziere deine Flotte – niemand schaut mit!',bsPlace,bsProg());
  else bsPlace();
}
function bsPlace(){
  const P=G.pl,n=G.n,occ=new Set(),map=Array(n*n).fill(-1);P.placed.forEach((p,k)=>p.cells.forEach(c=>{occ.add(c);map[c]=k}));
  const left=G.ships.length-P.placed.length;
  let grid='<div></div>'+Array.from({length:n},(_,c)=>`<div class="bl">${BSL[c]}</div>`).join('');
  for(let r=0;r<n;r++){grid+=`<div class="bl">${r+1}</div>`;for(let c=0;c<n;c++){const i=r*n+c;grid+=`<button class="bc kx ${occ.has(i)?'sx sp'+bsNb(map,i,n):''}" onclick="bsPut(${r},${c})" aria-label="${bsLab(n,i)}"></button>`}}
  scr(`${bsProg()}<div class="card"><div class="row" style="align-items:center;gap:10px;margin-bottom:8px">${av(G.pi[P.e])}<span class="sm">${esc(S.P[G.pi[P.e]])} platziert die Flotte</span></div>
  <div class="bsf" style="margin-bottom:10px">${G.ships.map((l,i)=>`<span class="fl ${i<P.placed.length?'ok':''}">${'<i></i>'.repeat(l)}</span>`).join('')}</div>
  <p class="sm" style="margin:0 0 8px">${left?`Tippe auf das Startfeld für das Schiff mit ${G.ships[P.placed.length]} Feldern (es liegt ${P.dir==='h'?'nach rechts':'nach unten'}).`:'Alle Schiffe liegen. Prüfe die Flotte und tippe auf „Fertig“.'}</p>
  <div class="bsg" style="--n:${n}">${grid}</div>
  <div class="row"><button class="sec" onclick="bsDir()">${P.dir==='h'?'↔ Quer':'↕ Hoch'}</button><button class="sec" onclick="bsUndo()">↶ Zurück</button><button class="sec" onclick="bsRnd()">🎲 Zufällig</button></div>
  <button class="ok" onclick="bsDone()">Fertig ✓</button></div>`);
}
function bsDir(){G.pl.dir=G.pl.dir==='h'?'v':'h';bsPlace()}
function bsUndo(){G.pl.placed.pop();bsPlace()}
function bsRnd(){G.pl.placed=bsRandPlace();bsPlace()}
function bsPut(r,c){
  const P=G.pl,n=G.n;if(P.placed.length>=G.ships.length){toast('Alle Schiffe liegen schon');return}
  const len=G.ships[P.placed.length],v=P.dir==='v';
  if((v?r+len:c+len)>n){toast('Das Schiff passt dort nicht hin');vib(40);return}
  const cells=Array.from({length:len},(_,i)=>(r+(v?i:0))*n+c+(v?0:i)),occ=new Set();P.placed.forEach(p=>p.cells.forEach(x=>occ.add(x)));
  if(cells.some(x=>occ.has(x))){toast('Dort liegt schon ein Schiff');vib(40);return}
  P.placed.push({len,cells});sfx.pop();bsPlace();
}
function bsDone(){
  const P=G.pl;if(P.placed.length<G.ships.length){toast('Platziere erst alle Schiffe');vib(40);return}
  bsBuild(P.e,P.placed);bsPlaceFor(P.e+1);
}
function bsBegin(){G.t=G.r%2;bsTurn()}
function bsSunkAll(e){return G.fl[e].every(s=>s.sunk)}
function bsTurn(){
  const n=G.n,t=G.t,e=1-t,lock=G.over||(G.cpu&&t===1);
  let grid='<div></div>'+Array.from({length:n},(_,c)=>`<div class="bl">${BSL[c]}</div>`).join('');
  for(let r=0;r<n;r++){grid+=`<div class="bl">${r+1}</div>`;for(let c=0;c<n;c++){
    const i=r*n+c,v=G.sh[e][i],si=G.own[e][i],sunk=v===2&&si>=0&&G.fl[e][si].sunk,rev=G.over&&v!==2&&si>=0;
    grid+=`<button class="bc kx ${v===1?'m':v===2&&!sunk?'h':''} ${sunk?'sx sk'+bsNb(G.own[e],i,n):rev?'sx sp'+bsNb(G.own[e],i,n):''} ${G.last===i?'lst':''}" ${v||lock?'disabled':''} onclick="bsShoot(${i})" aria-label="${bsLab(n,i)}">${v===2?(sunk?'✕':'💥'):''}</button>`}}
  const head=`<div class="c4s">${[0,1].map(x=>`<div class="c4p ${G.t===x&&!G.over?'on':''}">${G.ents[x].av(34)}<div><div class="nm">${esc(G.ents[x].name.replace(/^Team /,''))}</div><div class="sm">${G.fl[x].filter(s=>!s.sunk).length} Schiffe · ${G.pts[x]} / ${G.need}</div></div></div>`).join('')}</div>`;
  const series=G.over&&G.pts[t]>=G.need;
  const res=!G.over?'':`<div class="card ans" style="margin-top:14px"><div style="font-size:50px;animation:pop .6s both">${G.cpu&&t===1?'🤖':'🎉'}</div><div class="big">${esc(G.ents[t].name)} gewinnt ${series?'die Serie!':'die Runde!'}</div><div class="sm">Alle Schiffe versenkt · Stand ${G.pts[0]} : ${G.pts[1]}</div><button onclick="${series?"finish({unit:' Siege'})":'G.r++;bsNew()'}">${series?'Endergebnis 🏆':'Nächste Runde'}</button></div>`;
  scr(`${bsProg()}${head}
  <div class="sm" style="text-align:center;margin:8px 0">${G.over?'':`${esc(G.ents[t].name)} ${G.cpu&&t===1?'zielt …':'schießt auf das Gitter von '+esc(G.ents[e].name)}`}</div>
  ${G.msg?`<div class="bsm ${G.mc||''}">${G.msg}</div>`:''}
  <div class="bsg" style="--n:${n}">${grid}</div>
  <div class="bsf" style="margin-top:10px"><span class="sm" style="margin-right:4px">Gegnerische Flotte</span>${G.fl[e].map(s=>`<span class="fl ${s.sunk?'sk':''}">${'<i></i>'.repeat(s.len)}</span>`).join('')}</div>${res}`);
  if(!G.over&&G.cpu&&t===1&&!G.cb){G.cb=true;const g=G;setTimeout(()=>{if(G!==g||G.over)return;G.cb=false;G.cpuGo=true;bsShoot(bsCpuPick())},800)}
}
function bsApply(t,i){   // Schuss von Spieler t auf Feld i beim Gegner
  const e=1-t,si=G.own[e][i];G.last=i;
  if(si<0){G.sh[e][i]=1;return 'miss'}
  G.sh[e][i]=2;const s=G.fl[e][si];s.hit++;
  if(s.hit>=s.len){s.sunk=true;return 'sunk'}
  return 'hit';
}
function bsShoot(i){
  if(G.over||(G.cpu&&G.t===1&&!G.cpuGo))return;
  G.cpuGo=false;const t=G.t,e=1-t;if(G.sh[e][i])return;
  const res=bsApply(t,i),who=G.ents[t].name,lab=bsLab(G.n,i);
  G.mc=res;
  G.msg=res==='miss'?`${esc(who)}: ${lab} – Wasser 💧`:res==='hit'?`${esc(who)}: ${lab} – Treffer! 💥`:`${esc(who)}: ${lab} – Schiff versenkt! 🔥`;
  if(res==='miss'){sfx.pop();vib(15)}else{sfx.ok();vib([30,20,30])}
  if(bsSunkAll(e)){G.over=true;G.pts[t]++;sfx.win();confetti(80,GOLD);bsTurn();return}
  if(!(res!=='miss'&&G.o.again==='nochmal'))G.t=1-t;
  G.cb=false;bsTurn();
}
function bsCpuPick(){
  const n=G.n,sh=G.sh[0],free=[];for(let i=0;i<n*n;i++)if(!sh[i])free.push(i);
  if(G.o.lvl==='schwer'){
    const hits=[];for(let i=0;i<n*n;i++)if(sh[i]===2&&!G.fl[0][G.own[0][i]].sunk)hits.push(i);
    if(hits.length){
      const nb=new Set(),add=(r,c)=>{if(r>=0&&c>=0&&r<n&&c<n&&!sh[r*n+c])nb.add(r*n+c)};
      const hs=new Set(hits);
      hits.forEach(i=>{const r=Math.floor(i/n),c=i%n;
        const line=hs.has(i-1)&&c>0||hs.has(i+1)&&c<n-1,col=hs.has(i-n)||hs.has(i+n);
        if(line||!col){add(r,c-1);add(r,c+1)}
        if(col||!line){add(r-1,c);add(r+1,c)}
      });
      if(nb.size)return pick([...nb]);
    }
    const par=free.filter(i=>(Math.floor(i/n)+i%n)%2===0);
    if(par.length)return pick(par);
  }
  return pick(free);
}

/* ================= Online-Modus (PeerJS, Host-Spiel + Spiegelung) =================
   Das Spiel läuft nur auf dem Host. Alle anderen Handys zeigen eine Spiegelung des Bildschirms
   (nur wenn sie dran sein dürfen) und schicken ihre Eingaben an den Host.            */
let ACT=null,PERM=null,WAIT='',PAR=null;
const PRE='pbox-',APP_CODE_LEN=5;
let UID=0;
const hwEl=$('hw');

const cleanName=(n,fb)=>{n=String(n==null?'':n).replace(/[\u0000-\u001f\u007f<>&"'`]/g,'').trim().slice(0,16);return n||fb};
const myName=()=>{try{return localStorage.getItem('pb_my')||''}catch(e){return ''}};
const setMyName=n=>{try{localStorage.setItem('pb_my',n)}catch(e){}};
const netCode=()=>{const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<APP_CODE_LEN;i++)s+=a[Math.floor(Math.random()*a.length)];return s};
const isOpen=m=>!!(m&&m.conn&&m.conn.open);
const sendTo=(m,o)=>{try{if(isOpen(m))m.conn.send(o)}catch(e){}};
let wakeL=null;
function wake(){try{if(navigator.wakeLock)navigator.wakeLock.request('screen').then(l=>{wakeL=l}).catch(()=>{})}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(NET.on&&document.visibilityState==='visible')wake()});

/* ---------- Wer darf was? ---------- */
function devIdx(i){return(i===0||isOpen(NET.m[i]))?i:0}                 // Gerät des Spielers i (getrennt → Host)
function eligible(mi){return ACT==null||devIdx(ACT)===mi}               // sieht Gerät mi den echten Bildschirm?
function permOf(){
  if(ACT!=null)return devIdx(ACT);
  let p=PERM;if(typeof p==='function'){try{p=p()}catch(e){p=null}}
  if(p==null||p==='host')return 'host';
  if(p==='all')return 'all';
  return devIdx(p);
}
function canAct(mi){if(PAR&&parOwn(mi)!=null)return true;const p=permOf();return p==='all'||(p==='host'?mi===0:p===mi)}

/* ---------- Spiegelung: Host → Clients ---------- */
function tagAll(){app.querySelectorAll('*').forEach(e=>{if(!e.hasAttribute('data-n'))e.setAttribute('data-n',++UID)})}
function idOf(e){if(!e.hasAttribute('data-n'))e.setAttribute('data-n',++UID);return +e.getAttribute('data-n')}
let obs=null,recs=[],ft=0,lastF=0;
function startMirror(){
  tagAll();recs=[];
  obs=new MutationObserver(rs=>{for(const r of rs)recs.push(r);schedFlush()});
  obs.observe(app,{childList:true,subtree:true,attributes:true,characterData:true});
}
function stopMirror(){if(obs){obs.disconnect();obs=null}recs=[];clearTimeout(ft);ft=0}
function schedFlush(){if(ft)return;ft=setTimeout(flush,Math.max(0,60-(Date.now()-lastF)))}
function flush(){
  clearTimeout(ft);ft=0;lastF=Date.now();
  if(!recs.length||!NET.host)return;
  const rs=recs;recs=[];
  const targets=NET.m.filter((m,i)=>i>0&&m.view==='mirror'&&isOpen(m)&&eligible(i));
  if(!targets.length)return;
  let full=false;const dirty=new Set(),attrs=new Map();
  for(const r of rs){
    if(r.type==='childList'){if(r.target===app)full=true;else dirty.add(r.target)}
    else if(r.type==='characterData'){const p=r.target.parentElement;if(p&&p!==app)dirty.add(p);else if(p===app)full=true}
    else if(r.type==='attributes'){
      if(r.attributeName==='data-n'||r.target===app)continue;
      if(!attrs.has(r.target))attrs.set(r.target,new Set());attrs.get(r.target).add(r.attributeName);
    }
  }
  let pkt;
  if(full){tagAll();pkt={t:'full',html:app.innerHTML}}
  else{
    let d=[...dirty].filter(e=>app.contains(e));
    d=d.filter(e=>!d.some(o=>o!==e&&o.contains(e)));
    const ops=[];
    d.forEach(e=>{const n=idOf(e);e.querySelectorAll('*').forEach(x=>{if(!x.hasAttribute('data-n'))x.setAttribute('data-n',++UID)});ops.push({o:'h',n,h:e.innerHTML})});
    attrs.forEach((names,el)=>{
      if(!app.contains(el)||d.some(x=>x!==el&&x.contains(el)))return;
      const n=idOf(el);names.forEach(k=>ops.push({o:'a',n,k,v:el.getAttribute(k)}));
    });
    if(!ops.length)return;
    pkt={t:'mut',ops};
  }
  targets.forEach(m=>sendTo(m,pkt));
  sendPerms();
}
let hwO=null;
function hostOwn(h){
  app.style.visibility='hidden';hwEl.style.display='block';
  if(hwO!==h){hwO=h;hwEl.innerHTML=h;setTimeout(()=>{const i=hwEl.querySelector('input[data-f]');if(i)try{i.focus()}catch(e){}},80)}
}
function hostView(el){
  hwO=null;app.style.visibility=el?'':'hidden';
  hwEl.style.display=el?'none':'block';
  if(!el)hwEl.innerHTML=WAIT;
}
function syncViews(){
  if(!NET.host)return;
  flush();
  NET.m.forEach((m,i)=>{
    const own=PAR?parOwn(i):null;
    const el=eligible(i),want=own!=null?'own':(el?'mirror':'wait');
    if(i===0){if(own!=null)hostOwn(own);else hostView(el);m.view=want;return}
    if(!isOpen(m)){m.view='none';return}
    if(want==='own'){if(m.view!=='own'||m.oh!==own){sendTo(m,{t:'own',html:own});m.view='own';m.oh=own}}
    else if(want==='mirror'&&m.view!=='mirror'){tagAll();sendTo(m,{t:'full',html:app.innerHTML});m.view='mirror'}
    else if(want==='wait'&&(m.view!=='wait'||m.wh!==WAIT)){sendTo(m,{t:'wait',html:WAIT});m.view='wait';m.wh=WAIT}
    if(PAR&&PAR.dur&&m.tmId!==PAR.id+':'+PAR.k){sendTo(m,{t:'tm',ms:Math.max(0,PAR.end-Date.now())});m.tmId=PAR.id+':'+PAR.k}
  });
  sendPerms();
}
function sendPerms(){
  NET.m.forEach((m,i)=>{if(i===0||!isOpen(m))return;const p=canAct(i);if(m.perm!==p){m.perm=p;sendTo(m,{t:'perm',ok:p})}});
}
/* ---------- Parallele Eingaben (nur Online-Host) ----------
   Jeder Spieler bekommt auf seinem Gerät einen eigenen Screen (Packet 'own'); der gemeinsame Screen zeigt nur den Stand.
   Clients schicken keine DOM-Klicks, sondern Daten {ty:'sub',p,k,v,f}. Der Host prüft sie in step.sub(). */
function parOwn(mi){
  if(!PAR)return null;
  for(let p=0;p<PAR.st.length;p++){
    if(PAR.st[p]<PAR.steps.length&&devIdx(p)===mi)
      return `<div class="screen own" data-p="${p}" style="--g1:${TH[0]};--g2:${TH[1]}">${PAR.steps[PAR.st[p]].html(p)}</div>`;
  }
  return null;
}
function parScreen(){
  return PAR.head()+`<div class="card"><div class="sm" style="margin-bottom:6px">${esc(PAR.msg)}</div>${S.P.map((n,i)=>`<div class="row" style="align-items:center;margin-top:8px">${av(i,'',34)}<b style="flex:1">${esc(n)}</b><span>${PAR.st[i]>=PAR.steps.length?'✅':'⏳'}</span></div>`).join('')}</div>`;
}
let PARID=0;
function parEnd(){
  const c=PAR;PAR=null;
  if(c&&c.iv)clearInterval(c.iv);
  if(c&&c.dur){tmrHide();NET.m.forEach((m,i)=>{if(i>0)sendTo(m,{t:'tm',off:1})})}
  return c;
}
function autoSub(sel){   // Zeit abgelaufen: eingetippten Wert (auch aus mehreren Feldern) noch abschicken
  const box=document.querySelector(sel+' [data-p]');if(!box)return;
  const fs=[...box.querySelectorAll('input[data-f]')];
  if(!fs.some(f=>String(f.value).trim()))return;
  const b=box.querySelector('[data-sub="'+(fs[fs.length-1].getAttribute('data-enter')||fs[0].getAttribute('data-enter')||'')+'"]');
  if(b){if(!b.hasAttribute('data-v'))b.setAttribute('data-v','auto');subGo(b)}
}
function parTick(){
  if(!PAR||!PAR.dur||Date.now()<PAR.end+1500)return;   // 1,5 s Kulanz für automatisch abgeschickte Eingaben
  const k=PAR.k;
  for(let p=0;p<PAR.st.length;p++){
    let dr=PAR.dr&&PAR.dr[p];if(devIdx(p)===0){const h=parDomDraft(p);if(h)dr=h}   // zuletzt getippter Stand zählt, auch ohne „Abschicken“
    for(let q=PAR.st[p];q<=k&&q<PAR.steps.length;q++){
      const st=PAR.steps[q];let got=false;
      if(dr&&dr.k===st.k&&st.sub){try{got=st.sub(p,{v:'auto',f:dr.f})===true}catch(e){}}
      if(!got&&st.timeout)try{st.timeout(p)}catch(e){}
    }
    if(PAR.st[p]<=k)PAR.st[p]=k+1;
  }
  PAR.k++;
  if(PAR.k>=PAR.dur.length||PAR.st.every(x=>x>=PAR.steps.length)){const c=parEnd();c.done();return}
  PAR.end=Date.now()+PAR.dur[PAR.k];
  scr(parScreen());syncViews();tmrShow(PAR.end-Date.now(),()=>autoSub('#hw'));
}
function parBegin(cfg){
  stopAll();parEnd();ACT=null;PERM=null;NET.scr=null;
  PAR={steps:cfg.steps,st:S.P.map(()=>0),head:cfg.head,msg:cfg.msg,done:cfg.done};
  if(cfg.dur&&cfg.dur.length){PAR.dur=cfg.dur;PAR.k=0;PAR.end=Date.now()+cfg.dur[0];PAR.id=++PARID;PAR.iv=setInterval(parTick,250)}
  scr(parScreen());syncViews();
  if(PAR&&PAR.dur)tmrShow(PAR.end-Date.now(),()=>autoSub('#hw'));
}
function parDomDraft(p){   // Host: eigener Entwurf aus dem Overlay
  const box=hwEl.querySelector('[data-p="'+p+'"]');if(!box)return null;
  const fs=[...box.querySelectorAll('input[data-f]')];if(!fs.length)return null;
  const f={};fs.forEach(e=>{f[e.getAttribute('data-f')]=String(e.value).slice(0,200)});
  const b=box.querySelector('[data-sub]');
  return {k:fs[fs.length-1].getAttribute('data-enter')||(b?b.getAttribute('data-sub'):null),f};
}
function parDraft(mi,d){   // Client: laufender Entwurf, der zählt, wenn die Zeit abläuft
  if(!PAR||!d||typeof d!=='object'||d.p==null||!d.f||typeof d.f!=='object')return;
  const p=+d.p;if(!Number.isInteger(p)||p<0||p>=PAR.st.length||devIdx(p)!==mi)return;
  const step=PAR.steps[PAR.st[p]];if(!step||d.k!==step.k)return;
  const f={};Object.keys(d.f).slice(0,12).forEach(k=>{f[String(k).slice(0,12)]=String(d.f[k]).slice(0,200)});
  (PAR.dr=PAR.dr||{})[p]={k:d.k,f};
}
function parErr(mi,msg){if(mi===0){toast(msg);vib(60)}else sendTo(NET.m[mi],{t:'err',m:msg})}
function parSub(mi,d){
  if(!PAR||!d||typeof d!=='object'||d.p==null)return;
  const p=+d.p;
  if(!Number.isInteger(p)||p<0||p>=PAR.st.length||devIdx(p)!==mi)return;
  const step=PAR.steps[PAR.st[p]];
  if(!step||d.k!==step.k)return;
  let r;try{r=step.sub(p,{v:d.v,f:(d.f&&typeof d.f==='object')?d.f:{}})}catch(e){r='Das hat nicht geklappt.'}
  if(r!==true){if(typeof r==='string')parErr(mi,r);return}
  PAR.st[p]++;
  if(PAR.st.every(x=>x>=PAR.steps.length)){const c=parEnd();c.done();return}
  scr(parScreen());syncViews();
}
function fxSend(o){if(!NET.host)return;NET.m.forEach((m,i)=>{if(i>0&&m.view==='mirror'&&isOpen(m))sendTo(m,{t:'fx',k:o.k,a:o.a})})}

function wrapPub(n,permFn){
  const f=window[n];if(typeof f!=='function')return;
  window[n]=function(){

  };

function netTryHost(tries,name){
  const code=netCode();let opened=false;
  let p;try{p=new Peer(PRE+code,{debug:0})}catch(e){netStatus('Verbindung nicht möglich.','onlineMenu()');return}
  p.on('error',e=>{
    if(e&&e.type==='unavailable-id'&&tries<6){try{p.destroy()}catch(_){}netTryHost(tries+1,name);return}
    if(!opened)netStatus('Keine Verbindung zum Vermittlungsserver ('+((e&&e.type)||'Fehler')+').<br><span class="sm">Prüfe dein Internet und versuche es nochmal.</span>','onlineMenu()');
    else toast('Netzwerk: '+((e&&e.type)||'Fehler'));
  });
  p.on('disconnected',()=>{if(opened&&NET.peer===p){try{p.reconnect()}catch(e){}}});
  p.on('open',()=>{
    opened=true;NET.peer=p;NET.on=true;NET.host=true;NET.client=false;NET.code=code;NET.inGame=false;
    NET.localNames=S.names.slice();
    NET.m=[{name,conn:null,last:Date.now(),view:'mirror',perm:true}];S.names=[name];
    startMirror();wake();hbStart();
    p.on('connection',netOnConn);
    lobbyScreen();
  });
}
function netOnConn(c){
  let mem=null;
  c.on('data',d=>{
    if(!d||typeof d!=='object'||!NET.host)return;
    if(d.t==='hi'){
      if(mem)return;
      const nm0=cleanName(d.n,'Gast'),cid=(typeof d.id==='string'&&d.id)?d.id.slice(0,40):'';
      // 1) dasselbe Gerät (gleiche ID) übernimmt seinen Platz, auch wenn die alte Verbindung noch offen wirkt
      // 2) sonst darf ein getrennter Spieler mit gleichem Namen zurück (alte Clients ohne ID)
      let m=(cid&&NET.m.find((x,i)=>i>0&&x.cid===cid))||NET.m.find((x,i)=>i>0&&x.name===nm0&&!isOpen(x));
      if(m){const oc=m.conn;m.conn=null;try{oc&&oc.close()}catch(e){}if(cid)m.cid=cid}
      else{
        if(NET.m.length>=10){try{c.send({t:'bye',why:'Die Lobby ist voll (max. 10).'})}catch(e){}setTimeout(()=>{try{c.close()}catch(e){}},400);return}
        let nm=nm0,k=2;while(NET.m.some(x=>x.name===nm))nm=nm0.slice(0,13)+' '+(k++);
        m={name:nm,cid};NET.m.push(m);
      }
      m.conn=c;m.last=Date.now();m.view='none';m.perm=null;m.wh=null;m.oh=null;m.tmId=null;mem=m;
      sendTo(m,{t:'welcome',idx:NET.m.indexOf(m),name:m.name,code:NET.code});
      netMembersChanged();
      return;
    }
    if(!mem||mem.conn!==c)return;
    mem.last=Date.now();
    if(d.t==='ev')netEvent(mem,d);
  });
  c.on('close',()=>{if(mem&&mem.conn===c){mem.view='none';netMembersChanged()}});
  c.on('error',()=>{});
}
function netMembersChanged(){
  if(!NET.host)return;
  netPrune();
  S.names=NET.m.map(x=>x.name);
  if(NET.scr==='lobby')lobbyScreen();else if(NET.scr==='home')home();
  syncViews();
}
function netPrune(){
  if(!NET.host||NET.inGame)return;
  NET.m=NET.m.filter((x,i)=>i===0||isOpen(x));

/* ---------- Host: Eingaben der Clients ---------- */
function netEvent(m,d){
  const idx=NET.m.indexOf(m);
  if(idx<0)return;
  if(d.ty==='sub'){parSub(idx,d);return}
  if(d.ty==='draft'){parDraft(idx,d);return}
  if(d.ty==='rx'){rxRemote(idx,d);return}
  if(!canAct(idx))return;
  if(d.vals&&typeof d.vals==='object'){
    for(const k in d.vals){
      const el=app.querySelector('[data-n="'+(+k)+'"]');
      if(el&&/^(INPUT|TEXTAREA)$/.test(el.tagName))el.value=String(d.vals[k]).slice(0,200);
    }
  }
  const el=app.querySelector('[data-n="'+(+d.n)+'"]');
  if(!el)return;
  const ty=d.ty;NET.syn=true;NET.who=idx;
  try{
    if(ty==='click')el.click();
    else if(ty==='in'){if(/^(INPUT|TEXTAREA)$/.test(el.tagName))el.value=String(d.v==null?'':d.v).slice(0,200)}
    else if(ty==='key'){
      if(/^(INPUT|TEXTAREA)$/.test(el.tagName)&&d.v!=null)el.value=String(d.v).slice(0,200);
      el.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',bubbles:true,cancelable:true}));
    }
    else if(/^pointer(down|move|up|cancel)$/.test(ty)){
      const r=el.getBoundingClientRect();
      const x=r.left+Math.max(0,Math.min(1,+d.rx||0))*r.width,y=r.top+Math.max(0,Math.min(1,+d.ry||0))*r.height;
      el.dispatchEvent(new PointerEvent(ty,{bubbles:true,cancelable:true,clientX:x,clientY:y,pointerId:1,isPrimary:true,pointerType:'touch'}));
    }
  }catch(e){}
  NET.syn=false;NET.who=null;
}

let hbT=0;
function hbStart(){
  hbStop();

    if(NET.host){
      NET.m.forEach((m,i)=>{
        if(i===0||!m.conn)return;
        sendTo(m,{t:'hb'});
        if(isOpen(m)&&Date.now()-m.last>16000){try{m.conn.close()}catch(e){}m.view='none';netMembersChanged()}
      });
    }else if(NET.client){
      try{NET.conn&&NET.conn.open&&NET.conn.send({t:'ev',ty:'hb'})}catch(e){}
      if(NET.lastHost&&Date.now()-NET.lastHost>16000)netClientLost();
    }
  },4000);
}
function hbStop(){clearInterval(hbT);hbT=0}

/* Client-Sitzung merken: nach Neuladen/App-Neustart wieder in die Lobby (gleiche Geräte-ID übernimmt den Platz) */
const SESS_KEY='pb_sess',SESS_MAX=3*36e5;
function sessSave(){try{localStorage.setItem(SESS_KEY,JSON.stringify({code:NET.code,name:NET.name,t:Date.now()}))}catch(e){}}
function sessClear(){try{localStorage.removeItem(SESS_KEY)}catch(e){}}
function sessGet(){try{const x=JSON.parse(localStorage.getItem(SESS_KEY)||'null');if(x&&x.code&&x.name&&Date.now()-x.t<SESS_MAX)return x}catch(e){}return null}
function myCid(){
  if(NET.cid)return NET.cid;
  try{let c=localStorage.getItem('pb_cid');if(!c){c=Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem('pb_cid',c)}return NET.cid=c}
  catch(e){return NET.cid=Math.random().toString(36).slice(2)+Date.now().toString(36)}
}
function netJoin(code,name){
  lostInfo=null;
  // Ein früherer Versuch/eine frühere Verbindung desselben Geräts wird beendet, sonst steht man doppelt in der Lobby
  const oc=NET.conn,op=NET.peer;NET.conn=null;NET.peer=null;hbStop();
  try{oc&&oc.close()}catch(e){}try{op&&op.destroy()}catch(e){}
  const jid=NET.jid=(NET.jid||0)+1;
  netStatus('Verbinde mit Lobby '+esc(code)+' …','netLeave()');
  NET.on=true;NET.client=true;NET.host=false;NET.code=code;NET.name=name;NET.perm=true;NET.lastHost=Date.now();NET.got=false;
  document.body.classList.add('cl','live');
  let p;try{p=new Peer(undefined,{debug:0})}catch(e){netClientFail('Verbindung nicht möglich.');return}
  NET.peer=p;
  const to=setTimeout(()=>{if(jid===NET.jid&&!NET.got)netClientFail('Keine Verbindung zur Lobby.<br><span class="sm">Code falsch, Host weg oder Netzwerk blockiert.</span>')},15000);
  p.on('error',e=>{if(jid===NET.jid&&!NET.got){clearTimeout(to);netClientFail('Verbindung fehlgeschlagen ('+((e&&e.type)||'Fehler')+').<br><span class="sm">Stimmt der Code? Läuft die Lobby noch?</span>')}});
  p.on('open',()=>{
    if(jid!==NET.jid)return;
    const c=p.connect(PRE+code,{reliable:true,serialization:'json'});NET.conn=c;
    c.on('open',()=>{clearTimeout(to);NET.lastHost=Date.now();c.send({t:'hi',n:name,id:myCid()});hbStart();wake()});
    c.on('data',d=>{if(NET.conn===c)netClientData(d)});
    c.on('close',()=>{if(NET.client&&NET.conn===c)netClientLost()});
    c.on('error',()=>{});
  });
  $('lv').style.display='block';$('lv').textContent='🌐 '+code+' · '+name;
}
function netClientFail(msg){
  sessClear();netCleanup();
  scr(`${logo('Online')}<div class="card" style="text-align:center"><div style="font-size:42px">😕</div><p style="margin:8px 0 0">${msg}</p></div><button onclick="history.replaceState(null,'',location.pathname);home()">← Zurück</button>`);
}
let lostInfo=null;
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&lostInfo&&!NET.on){const l=lostInfo;lostInfo=null;netJoin(l.code,l.name)}});
function netClientLost(){
  const code=NET.code,name=NET.name;
  netCleanup();lostInfo={code,name};
  scr(`${logo('Online')}<div class="card" style="text-align:center"><div style="font-size:42px">📡</div><p style="margin:8px 0 0">Verbindung zur Lobby getrennt.</p></div><button onclick="netJoin('${esc(code)}','${esc(name)}')">Erneut verbinden</button><button class="sec" onclick="history.replaceState(null,'',location.pathname);home()">Beenden</button>`);
}
function netLeave(){
  if(!NET.client)return;lostInfo=null;sessClear();
  netCleanup();history.replaceState(null,'',location.pathname);home();
}
function netCleanup(){
  hbStop();tmrHide();
  try{NET.conn&&NET.conn.close()}catch(e){}
  try{NET.peer&&NET.peer.destroy()}catch(e){}
  NET.on=false;NET.client=false;NET.conn=null;NET.peer=null;NET.got=false;
  document.body.classList.remove('cl','noperm','live');$('lv').style.display='none';
}
/* HTML vom Host einsetzen: Handler entschärfen (Klicks gehen an den Host) */
function strip(root){
  root.querySelectorAll('*').forEach(e=>{
    for(const a of Array.from(e.attributes)){
      if(a.name.length>2&&a.name.slice(0,2)==='on'){e.setAttribute('data-h-'+a.name.slice(2),'1');e.removeAttribute(a.name)}
    }
  });
}
function parseInto(el,html){
  const t=document.createElement('template');t.innerHTML=html;
  strip(t.content);
  el.replaceChildren(t.content);
}
function netClientData(d){netClientData0(d);rxWatch();kbPrep()}
function netClientData0(d){
  if(!d||typeof d!=='object')return;
  NET.lastHost=Date.now();NET.got=true;
  if(d.t==='welcome'){NET.idx=d.idx;if(d.name&&d.name!==NET.name){NET.name=d.name;$('lv').textContent='🌐 '+NET.code+' · '+d.name}sessSave()}
  else if(d.t==='full'||d.t==='wait'){
    parseInto(app,String(d.html||''));window.scrollTo(0,0);app.scrollTop=0;
    if(d.t==='full'&&NET.perm){const i=app.querySelector('input.num,input.txt');if(i)setTimeout(()=>{try{i.focus()}catch(e){}},120)}
  }
  else if(d.t==='mut'&&Array.isArray(d.ops)){
    for(const o of d.ops){
      const el=app.querySelector('[data-n="'+(+o.n)+'"]');if(!el)continue;
      if(o.o==='h')parseInto(el,String(o.h||''));
      else if(o.o==='a'&&typeof o.k==='string'){
        if(o.k.slice(0,2)==='on'){if(o.v!=null)el.setAttribute('data-h-'+o.k.slice(2),'1');continue}
        if(o.v==null)el.removeAttribute(o.k);else el.setAttribute(o.k,String(o.v));
      }
    }
  }
  else if(d.t==='own'){
    parseInto(app,String(d.html||''));window.scrollTo(0,0);app.scrollTop=0;
    setTimeout(()=>{const i=app.querySelector('input[data-f]');if(i)try{i.focus()}catch(e){}},120);
  }
  else if(d.t==='err'){toast(String(d.m||'Ungültig'));vib(60)}
  else if(d.t==='tm'){if(d.off)tmrHide();else tmrShow(+d.ms||0,()=>autoSub('#app'))}
  else if(d.t==='stat'&&d.r&&typeof d.r==='object'){statRecord(NET.name,String(d.g||''),{w:d.r.w?1:0,p:d.r.p,x:d.r.x&&typeof d.r.x==='object'?d.r.x:null})}
  else if(d.t==='perm'){NET.perm=!!d.ok;document.body.classList.toggle('noperm',!NET.perm)}
  else if(d.t==='fx'){
    try{
      if(d.k==='s'&&sfx[d.a[0]])sfx[d.a[0]]();
      else if(d.k==='confetti')confetti.apply(null,d.a);
      else if(d.k==='flash')flash.apply(null,d.a);
      else if(d.k==='vib')vib.apply(null,d.a);
    }catch(e){}
  }
  else if(d.t==='bye'){const w=d.why||'Die Lobby wurde beendet.';sessClear();netCleanup();scr(`${logo('Online')}<div class="card" style="text-align:center"><div style="font-size:42px">👋</div><p style="margin:8px 0 0">${esc(w)}</p></div><button onclick="history.replaceState(null,'',location.pathname);home()">← Zurück</button>`)}
}
/* Reflex: Zeit auf dem Client messen (ab Grün auf diesem Gerät) */
let RXT=0;
function rxWatch(){const r=app.querySelector('#rx');if(r&&r.classList.contains('g')){if(!RXT)RXT=performance.now()}else RXT=0}
document.addEventListener('pointerdown',e=>{
  if(!NET.client||!NET.perm||!e.target.closest||e.target.closest('button'))return;
  const r=e.target.closest('#rx');if(!r||!app.contains(r))return;
  e.stopImmediatePropagation();e.preventDefault();
  if(r.classList.contains('g')&&RXT){const ms=Math.round(performance.now()-RXT);RXT=0;sendC({ty:'rx',k:'ms',v:ms})}
  else if(r.classList.contains('w'))sendC({ty:'rx',k:'early'});
},true);
/* Eingaben des Clients → Host */
function sendC(o){try{if(NET.conn&&NET.conn.open)NET.conn.send(Object.assign({t:'ev'},o))}catch(e){}}
function inVals(){const v={};app.querySelectorAll('input[data-n],textarea[data-n]').forEach(e=>{v[e.getAttribute('data-n')]=e.value});return v}
let lastMv=0,pendMv=null,mvT=0;
document.addEventListener('click',e=>{
  if(!NET.client||!e.target.closest)return;
  const t=e.target.closest('[data-h-click]');if(!t||!app.contains(t))return;
  e.preventDefault();
  if(!NET.perm){toast('Das macht gerade jemand anderes');return}
  sendC({ty:'click',n:+t.getAttribute('data-n'),vals:inVals()});
});
['pointerdown','pointermove','pointerup','pointercancel'].forEach(ty=>document.addEventListener(ty,e=>{
  if(!NET.client||!e.target.closest)return;
  let t=e.target.closest('[data-ptr]');
  if(!t&&ty==='pointerdown')t=e.target.closest('[data-h-pointerdown]');
  if(!t||!app.contains(t))return;
  if(!NET.perm)return;
  if(ty==='pointerdown'&&t.hasAttribute('data-ptr')){try{t.setPointerCapture(e.pointerId)}catch(_){}}
  const r=t.getBoundingClientRect();
  const pkt={ty,n:+t.getAttribute('data-n'),rx:r.width?(e.clientX-r.left)/r.width:0,ry:r.height?(e.clientY-r.top)/r.height:0};
  if(ty==='pointermove'){
    const n=Date.now();
    if(n-lastMv<30){pendMv=pkt;if(!mvT)mvT=setTimeout(()=>{mvT=0;if(pendMv){lastMv=Date.now();sendC(pendMv);pendMv=null}},35);return}
    lastMv=n;pendMv=null;
  }else if(pendMv){sendC(pendMv);pendMv=null}
  sendC(pkt);
  if(ty==='pointerdown'&&t.hasAttribute('data-ptr'))e.preventDefault();
}));
document.addEventListener('input',e=>{
  if(!NET.client||!NET.perm)return;const t=e.target;
  if(!t||!t.getAttribute||!t.getAttribute('data-n')||!app.contains(t))return;
  sendC({ty:'in',n:+t.getAttribute('data-n'),v:t.value});
});
document.addEventListener('keydown',e=>{
  if(!NET.client||!NET.perm||e.key!=='Enter')return;const t=e.target;
  if(!t||!t.getAttribute||!/^(INPUT|TEXTAREA)$/.test(t.tagName)||!t.getAttribute('data-n')||!app.contains(t))return;
  sendC({ty:'key',n:+t.getAttribute('data-n'),v:t.value});
});

const fsOn=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);

  try{
    const d=document,e=d.documentElement;
    const r=fsOn()?(d.exitFullscreen||d.webkitExitFullscreen).call(d):(e.requestFullscreen||e.webkitRequestFullscreen).call(e);
    if(r&&r.catch)r.catch(()=>{});
  }catch(e){}
}
function fsSync(){

}

/* ---------- Tastatur (iPad mit Magic Keyboard, Mac, PC) ----------
   Alles läuft über dieselben Klick-/Zeiger-Ereignisse wie die Bedienung per Finger – dadurch funktioniert es
   auch auf Mitspieler-Geräten (die Ereignisse gehen wie gewohnt an den Host). */
const kbVis=el=>!!el&&el.offsetParent!==null&&getComputedStyle(el).visibility!=='hidden';
function kbPrep(){   // Klickbare Nicht-Knöpfe (Chips, Schalter, Karten) per Tab erreichbar machen
  document.querySelectorAll('#app [onclick]:not(button):not(a):not(input):not([tabindex]),#app [data-h-click]:not(button):not(a):not(input):not([tabindex])').forEach(e=>{e.tabIndex=0;e.setAttribute('role','button')});
}
const kbRoot=()=>(hwEl.style.display==='block'?hwEl:app);
function kbPtr(el,type,x,y){el.dispatchEvent(new PointerEvent(type,{bubbles:true,cancelable:true,clientX:x,clientY:y,pointerId:1,isPrimary:true,pointerType:'mouse'}))}
let KBC=3;
function kbC4Pos(c){const b=$('c4b');if(!b)return null;const r=b.getBoundingClientRect(),w=(r.width-20-36)/7;return {b,x:r.left+10+c*(w+6)+w/2,y:r.top+r.height/2}}
function kbC4Hov(c){document.querySelectorAll('#c4b .c4col').forEach((el,i)=>el.classList.toggle('hv',i===c))}
function kbC4Drop(c){const p=kbC4Pos(c);if(!p)return false;kbPtr(p.b,'pointerdown',p.x,p.y);kbPtr(p.b,'pointerup',p.x,p.y);kbC4Hov(-1);return true}
function kbSlider(d){
  const sp=$('sp');if(!sp||!sp.hasAttribute('data-ptr'))return false;
  const gm=$('gm'),cur=gm?parseFloat(gm.style.left):50,pct=Math.max(0,Math.min(100,(isFinite(cur)?cur:50)+d));
  const r=sp.getBoundingClientRect(),x=r.left+pct/100*r.width,y=r.top+r.height/2;
  kbPtr(sp,'pointerdown',x,y);kbPtr(sp,'pointerup',x,y);return true;
}
function kbRx(){
  const r=$('rx');if(!r)return false;
  if(r.classList.contains('w')||r.classList.contains('g')){const b=r.getBoundingClientRect();kbPtr(r,'pointerdown',b.left+b.width/2,b.top+b.height/2);return true}
  const btn=r.querySelector('button');if(btn){btn.click();return true}return false;
}
function kbPrimary(root){
  const bs=[...root.querySelectorAll('button')].filter(b=>kbVis(b)&&!b.disabled&&!/\b(sec|ib|qm|opt|back|gt|sg|lo|kx)\b/.test(b.className));
  return bs.find(b=>b.classList.contains('ok'))||bs[bs.length-1]||null;
}
document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey||e.isComposing)return;
  const t=e.target,tag=t&&t.tagName,k=e.key,typing=/^(INPUT|TEXTAREA|SELECT)$/.test(tag)||(t&&t.isContentEditable);
  if(k==='Escape'){
    if(typing){t.blur();return}
    if($('dnote')){dnoteNo();e.preventDefault();return}
    if($('hmc')){hmNo();e.preventDefault();return}
    if(document.body.classList.contains('live')){hmAsk();e.preventDefault()}
    return;
  }
  if(typing){
    if(k!=='Enter')return;
    if(t.hasAttribute&&t.hasAttribute('data-nx')){e.preventDefault();const ins=[...t.closest('.card,[data-p]').querySelectorAll('input.txt')],i=ins.indexOf(t);if(ins[i+1])ins[i+1].focus();return}
    if(t.closest&&t.closest('#pl')){e.preventDefault();const ins=[...document.querySelectorAll('#pl input')],i=ins.indexOf(t);if(i<ins.length-1)ins[i+1].focus();else savePlayers();return}
    if(t.id==='slfn'){e.preventDefault();slfAddCat();return}
    if(t.id==='slfe'){e.preventDefault();slfFix();return}
    if(t.id==='jc'){e.preventDefault();netJoinStart();return}
    if(t.id==='myn'){const b=t.closest('.card')&&t.closest('.card').querySelector('button:not(.sec)');if(b){e.preventDefault();b.click()}else if($('jc')){e.preventDefault();$('jc').focus()}}
    return;
  }
  if($('hmc')||$('dnote'))return;                       // Rückfrage offen: nur Tab/Enter/Leertaste auf den Knöpfen
  if(tag==='BUTTON'||tag==='A')return;                  // fokussierte Knöpfe lösen Enter/Leertaste selbst aus
  if(t&&t.getAttribute&&t.getAttribute('role')==='button'&&(k==='Enter'||k===' ')){e.preventDefault();t.click();return}
  const root=kbRoot(),lc=k.length===1?k.toLowerCase():k;
  if((k===' '||k==='Enter')&&kbRx()){e.preventDefault();return}
  const c4play=$('c4b')&&!($('c4r')&&$('c4r').children.length);
  if(c4play){
    if(/^[1-7]$/.test(k)){e.preventDefault();kbC4Drop(+k-1);return}
    if(k==='ArrowLeft'||k==='ArrowRight'){e.preventDefault();KBC=Math.max(0,Math.min(6,KBC+(k==='ArrowRight'?1:-1)));kbC4Hov(KBC);return}
    if(k==='ArrowDown'||k==='Enter'||k===' '){e.preventDefault();kbC4Drop(KBC);return}
  }
  if((k==='ArrowLeft'||k==='ArrowRight')&&kbSlider((k==='ArrowRight'?1:-1)*(e.shiftKey?5:1))){e.preventDefault();return}
  if($('hg')&&/^[a-z]$/.test(lc)){const b=root.querySelector('#hg [data-l="'+lc.toUpperCase()+'"]');if(b&&!b.disabled){e.preventDefault();b.click()}return}
  if(k==='Backspace'&&$('ckdel')){e.preventDefault();$('ckdel').click();return}
  if(/^[0-9]$/.test(k)){
    const modal=document.querySelector('.pk:not(#hmc)'),box=modal||root;
    const opts=[...box.querySelectorAll('.opt,.locs .lo,[data-kn]')].filter(kbVis),n=k==='0'?10:+k;
    if(opts.length){if(opts[n-1]){e.preventDefault();opts[n-1].click()}return}
    const tiles=[...app.querySelectorAll('.gt')].filter(kbVis);
    if(tiles[n-1]){e.preventDefault();tiles[n-1].click()}
    return;
  }
  let el=null;
  if(lc==='i')el=root.querySelector('.qm');
  else if(lc==='s')el=$('sk');
  else if(lc==='f')el=$('bk');
  else if(lc==='t')el=[...root.querySelectorAll('button')].find(b=>/Tabu!/.test(b.textContent));
  if(el&&kbVis(el)){e.preventDefault();el.click();return}
  if(k==='Enter'||k===' '){const b=kbPrimary(root);if(b){e.preventDefault();b.click()}}
});

/* Diagnose für Anzeige-Probleme (iPad): 5× schnell auf das Logo tippen, dann Screenshot schicken. Nochmal tippen schließt. */
function diag(){
  const old=$('dg');if(old){old.remove();return}
  const pr=(css)=>{const d=document.createElement('div');d.style.cssText='position:fixed;left:0;top:0;width:0;visibility:hidden;pointer-events:none;'+css;document.body.appendChild(d);const r=d.getBoundingClientRect();d.remove();return Math.round(r.height*10)/10};
  const vv=window.visualViewport,cs=getComputedStyle(app);
  const L=[
   'innen '+innerWidth+'×'+innerHeight+'  außen '+outerWidth+'×'+outerHeight+'  screen '+screen.width+'×'+screen.height+'  dpr '+devicePixelRatio,
   'visualViewport '+(vv?Math.round(vv.width)+'×'+Math.round(vv.height)+' oben '+Math.round(vv.offsetTop)+' scale '+vv.scale:'–'),
   'html client '+document.documentElement.clientHeight+'  scrollH '+document.documentElement.scrollHeight+'  scrollY '+Math.round(scrollY),
   'body '+Math.round(document.body.getBoundingClientRect().height)+'  bg '+Math.round(document.querySelector('.bg').getBoundingClientRect().height),
   '100vh '+pr('height:100vh')+'  100lvh '+pr('height:100lvh')+'  100dvh '+pr('height:100dvh')+'  100svh '+pr('height:100svh'),
   'safe oben '+pr('height:env(safe-area-inset-top,0px)')+'  unten '+pr('height:env(safe-area-inset-bottom,0px)')+'  links '+pr('height:env(safe-area-inset-left,0px)'),
   'app scrollTop '+Math.round(app.scrollTop)+'  scrollH '+app.scrollHeight+'  clientH '+app.clientHeight,
   'standalone '+((window.matchMedia&&matchMedia('(display-mode: standalone)').matches)?'ja':'nein')+'  nav.standalone '+navigator.standalone,
   'Version: Diagnose v1'
  ];
  const d=document.createElement('div');d.id='dg';d.textContent=L.join('\n');d.onclick=()=>d.remove();document.body.appendChild(d);
}
let lgN=0,lgT=0;
document.addEventListener('click',e=>{
  if(!e.target.closest||!e.target.closest('.logo'))return;
  const n=Date.now();lgN=(n-lgT<1500)?lgN+1:1;lgT=n;
  if(lgN>=5){lgN=0;diag()}
});

/* Eigene Screens (parallele Eingaben): Buttons mit data-sub, Felder mit data-f, Container mit data-p (Spielerindex) */
function subGo(t){
  const box=t.closest('[data-p]');if(!box)return;
  const f={};box.querySelectorAll('[data-f]').forEach(e=>{f[e.getAttribute('data-f')]=String(e.value).slice(0,200)});
  const d={p:+box.getAttribute('data-p'),k:t.getAttribute('data-sub'),v:t.getAttribute('data-v'),f};
  if(NET.host){if(hwEl.contains(t))parSub(0,d)}
  else if(NET.client&&app.contains(t))sendC(Object.assign({ty:'sub'},d));
}
document.addEventListener('click',e=>{const t=e.target.closest&&e.target.closest('[data-sub]');if(t)subGo(t)});
let DRT=null;
function draftSend(){   // Mitspieler-Gerät: aktuellen Stand der Eingabefelder an den Host melden
  if(!NET.client)return;
  const box=app.querySelector('[data-p]');if(!box)return;
  const fs=[...box.querySelectorAll('input[data-f]')];if(!fs.length)return;
  const f={};fs.forEach(e=>{f[e.getAttribute('data-f')]=String(e.value).slice(0,200)});
  const b=box.querySelector('[data-sub]'),k=fs[fs.length-1].getAttribute('data-enter')||(b?b.getAttribute('data-sub'):null);
  if(k==null)return;
  sendC({ty:'draft',p:+box.getAttribute('data-p'),k,f});
}
document.addEventListener('input',e=>{
  if(!NET.client||!e.target||!e.target.closest||!e.target.closest('[data-p]')||!e.target.hasAttribute('data-f'))return;
  clearTimeout(DRT);DRT=setTimeout(draftSend,350);
});
document.addEventListener('visibilitychange',()=>{if(document.hidden){clearTimeout(DRT);draftSend()}});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;const t=e.target;
  if(!t||!t.getAttribute||!t.getAttribute('data-enter'))return;
  const box=t.closest('[data-p]'),b=box&&box.querySelector('[data-sub="'+t.getAttribute('data-enter')+'"]');
  if(b)subGo(b);
});
