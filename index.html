<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Party Box">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Party Box</title>
<style>

:root{--bg:#0b0d14;--tx:#f4f5fa;--mu:#8f96ab;--red:#ff2e4d;--red2:#ff7a45;--gold:#ffc83d;--ok:#35e0a1;--glass:rgba(255,255,255,.06);--line:rgba(255,255,255,.1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:"Inter",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.bg i{position:absolute;width:55vmax;height:55vmax;border-radius:50%;filter:blur(90px);opacity:.38;animation:drift 18s ease-in-out infinite alternate}
.bg i:nth-child(1){background:var(--b1);left:-20vmax;top:-18vmax}
.bg i:nth-child(2){background:var(--b2);right:-22vmax;top:25vh;animation-delay:-6s}
.bg i:nth-child(3){background:var(--b3);left:10vw;bottom:-30vmax;animation-delay:-11s;opacity:.25}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}
main{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:18px 16px 60px}
.screen{animation:in .5s cubic-bezier(.2,.9,.3,1) both}
@keyframes in{from{opacity:0;transform:translateY(22px) scale(.98)}to{opacity:1;transform:none}}
.logo{display:flex;align-items:center;gap:12px;margin:10px 0 4px}
.logo h1{margin:0;font-size:40px;font-weight:900;letter-spacing:-1.5px;background:linear-gradient(100deg,#fff 30%,var(--red2) 70%,var(--red));-webkit-background-clip:text;background-clip:text;color:transparent}
.rc{width:34px;height:48px;border-radius:7px;background:linear-gradient(145deg,var(--red2),var(--red));box-shadow:0 0 28px rgba(255,46,77,.7);transform:rotate(-12deg);animation:wob 3.2s ease-in-out infinite}
@keyframes wob{50%{transform:rotate(10deg) translateY(-4px)}}
h2{margin:0 0 12px;font-size:20px}
p{color:var(--mu);line-height:1.5}
.card{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:22px;padding:20px;margin:14px 0;box-shadow:0 14px 40px rgba(0,0,0,.35)}
.q{font-size:24px;font-weight:750;line-height:1.28;letter-spacing:-.4px}
.unit{color:var(--gold);font-weight:700}
.sm{font-size:13px;color:var(--mu)}
button{font:inherit;border:0;border-radius:16px;padding:16px;background:linear-gradient(135deg,var(--g1,var(--red2)),var(--g2,var(--red)));color:#fff;font-weight:750;width:100%;margin-top:12px;cursor:pointer;position:relative;overflow:hidden;box-shadow:0 8px 26px rgba(255,46,77,.38);transition:transform .15s,box-shadow .2s,filter .2s}
button:hover{filter:brightness(1.1);box-shadow:0 10px 34px rgba(255,46,77,.55)}
button:active{transform:scale(.97)}
button.sec{background:var(--glass);border:1px solid var(--line);box-shadow:none}
button::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);animation:shine 3.4s infinite}
button.sec::after{display:none}
@keyframes shine{0%,60%{left:-60%}100%{left:130%}}
input{font:inherit;width:100%;padding:15px 16px;border-radius:14px;border:1.5px solid var(--line);background:rgba(0,0,0,.35);color:var(--tx);margin-top:10px;transition:border-color .2s,box-shadow .2s}
input:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 4px rgba(255,46,77,.2)}
input.num{font-size:34px;font-weight:800;text-align:center;letter-spacing:-1px}
.row{display:flex;gap:8px}
.row button{margin-top:10px}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.err{color:var(--red2);font-size:14px;margin-top:8px;min-height:18px}
.prog{height:5px;border-radius:9px;background:var(--line);overflow:hidden;margin:6px 0 2px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--g1,var(--red2)),var(--g2,var(--red)));border-radius:9px;transition:width .6s}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:850;font-size:18px;color:#fff;flex:none;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.av.l{width:92px;height:92px;font-size:40px;margin:0 auto 14px;animation:pop .6s cubic-bezier(.3,1.6,.5,1) both,float 3s 0.6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes pop{from{transform:scale(0) rotate(-40deg)}to{transform:none}}
.hand{text-align:center;padding:34px 18px}
.big{font-size:34px;font-weight:850;letter-spacing:-1px;margin:4px 0}
.opt{display:flex;align-items:center;gap:14px;text-align:left;background:var(--glass);border:1px solid var(--line);box-shadow:none;padding:12px 14px;opacity:0;animation:in .45s both;animation-delay:calc(var(--k)*70ms)}
.opt:hover{border-color:var(--red);background:rgba(255,46,77,.12);box-shadow:none}
.opt::after{display:none}
.opt.sel{background:linear-gradient(135deg,var(--red2),var(--red));animation:sel .35s both}
@keyframes sel{50%{transform:scale(1.04)}to{opacity:1;transform:scale(1)}}
.opt span{font-weight:700;font-size:18px}
.res{opacity:0;animation:rowin .6s cubic-bezier(.2,.9,.3,1) both;animation-delay:var(--d);padding:12px;border-radius:16px;margin:8px 0;background:rgba(255,255,255,.04);border:1px solid var(--line)}
@keyframes rowin{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}
.res.best{border-color:var(--gold);box-shadow:0 0 30px rgba(255,200,61,.35);animation:rowin .6s var(--d) both,glow 1.6s 1.2s ease-in-out infinite alternate}
@keyframes glow{to{box-shadow:0 0 46px rgba(255,200,61,.6)}}
.res.worst{border-color:var(--red);animation:slam .7s var(--d) both}
@keyframes slam{0%{opacity:0;transform:scale(2.4) rotate(-6deg)}60%{opacity:1;transform:scale(.95)}80%{transform:scale(1.03)}100%{opacity:1;transform:none;box-shadow:0 0 34px rgba(255,46,77,.5)}}
.rh{display:flex;align-items:center;gap:12px}
.rh .nm{flex:1;font-weight:750}
.gain{font-size:22px;font-weight:900;color:var(--ok);animation:pop .5s calc(var(--d) + .5s) cubic-bezier(.3,1.6,.5,1) both}
.gain.z{color:var(--mu)}
.dev{height:8px;background:rgba(255,255,255,.08);border-radius:9px;overflow:hidden;margin:9px 0 6px}
.dev i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#6c7bff,#9b6cff);width:0;animation:grow 1s calc(var(--d) + .2s) cubic-bezier(.2,.9,.3,1) forwards}
.best .dev i{background:linear-gradient(90deg,var(--gold),#fff0b3)}
.worst .dev i{background:linear-gradient(90deg,var(--red2),var(--red))}
@keyframes grow{to{width:var(--w)}}
.tag{display:inline-block;font-size:11px;font-weight:850;letter-spacing:.5px;text-transform:uppercase;padding:3px 9px;border-radius:99px;margin-left:6px;vertical-align:2px}
.tag.b{background:var(--gold);color:#2a1d00}
.tag.w{background:var(--red);color:#fff;animation:pulse 1.2s infinite}
.tag.t{background:rgba(53,224,161,.18);color:var(--ok)}
.tag.x{background:rgba(255,255,255,.08);color:var(--mu)}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(255,46,77,0);transform:scale(1.07)}0%{box-shadow:0 0 0 0 rgba(255,46,77,.6)}}
.ans{text-align:center}
.ans .num{font-size:52px;font-weight:900;color:var(--ok);letter-spacing:-2px;text-shadow:0 0 36px rgba(53,224,161,.5)}
.sb{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:15px}
.sb .nm{width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb .bar{flex:1;height:10px;border-radius:9px;background:rgba(255,255,255,.07);overflow:hidden}
.sb .bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--gold),var(--red2));transition:width 1s cubic-bezier(.2,.9,.3,1)}
.sb .pt{width:78px;text-align:right;font-weight:750}
.late{opacity:0;animation:in .5s var(--d) both}
.crown{font-size:64px;text-align:center;animation:pop .8s .2s cubic-bezier(.3,1.6,.5,1) both,float 2.6s 1s ease-in-out infinite}
.win{text-align:center}
.win .big{font-size:42px;background:linear-gradient(100deg,var(--gold),#fff,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
details{color:var(--mu);font-size:14px;line-height:1.6}summary{cursor:pointer;margin-bottom:6px;font-weight:650;color:var(--tx)}
canvas#fx{position:fixed;inset:0;z-index:50;pointer-events:none}
.flash{position:fixed;inset:0;z-index:40;background:radial-gradient(circle,rgba(255,46,77,.5),transparent 70%);pointer-events:none;animation:fl .8s forwards}
@keyframes fl{from{opacity:1}to{opacity:0}}
body.quake main{animation:quake .5s}
@keyframes quake{20%{transform:translate(-9px,5px)}40%{transform:translate(8px,-6px)}60%{transform:translate(-6px,-4px)}80%{transform:translate(5px,6px)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important}}
.back{width:auto;padding:9px 15px;margin:0 0 2px;font-size:14px;border-radius:12px}
.tile{display:block;text-align:left;padding:24px 22px;margin:16px 0;border-radius:24px;min-height:136px;animation:in .6s both;animation-delay:calc(var(--k)*120ms);background:linear-gradient(135deg,#ff7a45,#ff2e4d)}
.tile.t2{background:linear-gradient(135deg,#8f6cff,#3f7bff);box-shadow:0 8px 30px rgba(95,110,255,.45)}
.tile .te{display:block;font-size:44px;margin-bottom:6px;animation:float 3s ease-in-out infinite}
.tile b{font-size:28px;letter-spacing:-.8px;display:block}
.tile small{font-size:14px;opacity:.85}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;border-radius:99px;border:1px solid var(--line);background:var(--glass);font-size:14px;font-weight:650;cursor:pointer;transition:all .2s;user-select:none}
.chip.on{background:linear-gradient(135deg,#8f6cff,#3f7bff);border-color:transparent;box-shadow:0 4px 16px rgba(95,110,255,.5);transform:scale(1.04)}
.violet{background:linear-gradient(135deg,#8f6cff,#3f7bff)!important;box-shadow:0 8px 26px rgba(95,110,255,.45)!important}
.reel{font-size:84px;margin:6px 0;transition:transform .1s}
.reel.hit{animation:pop .6s cubic-bezier(.3,1.8,.5,1)}
.ringw{position:relative;width:150px;height:150px;margin:6px auto 14px}
.ringw svg{width:100%;height:100%}
.rbg{fill:none;stroke:rgba(255,255,255,.1);stroke-width:9}
.rfg{fill:none;stroke:url(#grd);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .12s linear}
.ringw.hot .rfg{stroke:var(--red)}
.ringw.hot .rt{color:var(--red2);animation:hb .5s infinite}
@keyframes hb{50%{transform:translate(-50%,-50%) scale(1.18)}}
.rt{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:44px;font-weight:900}
.word{background:linear-gradient(145deg,rgba(143,108,255,.28),rgba(63,123,255,.18));border:1px solid rgba(143,108,255,.5);border-radius:24px;padding:30px 14px;text-align:center;margin:8px 0 4px;box-shadow:0 0 40px rgba(110,100,255,.28)}
.word small{display:block;color:var(--mu);font-size:13px;margin-bottom:10px;letter-spacing:.5px}
.word span{font-size:38px;font-weight:900;letter-spacing:-1px;line-height:1.1;word-break:break-word}
.flipin{animation:flipin .45s cubic-bezier(.2,.9,.3,1)}
@keyframes flipin{from{opacity:0;transform:perspective(500px) rotateX(-70deg) scale(.9)}to{opacity:1;transform:none}}
.ok{background:linear-gradient(135deg,#35e0a1,#17b87a)!important;box-shadow:0 8px 26px rgba(53,224,161,.4)!important;font-size:19px}
.pk{position:fixed;inset:0;z-index:30;background:rgba(5,6,12,.78);backdrop-filter:blur(8px);display:flex;align-items:flex-end;justify-content:center;animation:fi .2s}
@keyframes fi{from{opacity:0}}
.pk>div{width:100%;max-width:520px;background:#161926;border-radius:26px 26px 0 0;padding:20px 16px 28px;animation:up .35s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(100%)}}
.twc{display:inline-block;padding:6px 12px;border-radius:99px;background:rgba(143,108,255,.2);border:1px solid rgba(143,108,255,.5);font-size:13px;font-weight:700}
.wheelw{position:relative;width:min(300px,80vw);aspect-ratio:1;margin:18px auto 14px}
.wheelw canvas{width:100%;height:100%;display:block;border-radius:50%;box-shadow:0 0 50px rgba(143,108,255,.45)}
.ptr{position:absolute;left:50%;top:-12px;transform:translateX(-50%);width:0;height:0;border-left:15px solid transparent;border-right:15px solid transparent;border-top:30px solid #fff;filter:drop-shadow(0 3px 6px rgba(0,0,0,.5));z-index:2}
.tmc{display:flex;align-items:center;gap:12px;padding:12px;border:1.5px solid;border-radius:16px;margin:8px 0;background:rgba(255,255,255,.04);animation:in .4s both}

:root{--b1:#ff2e4d;--b2:#5b3bff;--b3:#ff9f2e}
body[data-theme=neon]{--red:#c026d3;--red2:#22d3ee;--b1:#d946ef;--b2:#22d3ee;--b3:#6366f1}
body[data-theme=ozean]{--red:#2563eb;--red2:#14b8a6;--b1:#0ea5e9;--b2:#14b8a6;--b3:#6366f1}
body.calm .bg i,body.calm button::after,body.calm .rc,body.calm .gt .te,body.calm .hero .he,body.calm .crown,body.calm .av.l{animation:none!important}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.gt{margin:0;text-align:left;padding:16px 15px;min-height:160px;border-radius:22px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;background:linear-gradient(145deg,var(--g1),var(--g2))!important;opacity:0;animation:in .55s both;animation-delay:calc(var(--k)*70ms);box-shadow:0 10px 28px rgba(0,0,0,.35)!important}
.gt .te{font-size:40px;margin-bottom:auto;animation:float 3s ease-in-out infinite;align-self:flex-start}
.gt b{font-size:19px;letter-spacing:-.4px}
.gt small{font-size:12px;opacity:.88;line-height:1.25}
.gt .bd{font-size:11px;opacity:.95;margin-top:7px;background:rgba(0,0,0,.25);padding:3px 9px;border-radius:99px;align-self:flex-start}
.pchips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.pchip{display:flex;align-items:center;gap:7px;padding:4px 13px 4px 4px;background:rgba(255,255,255,.07);border-radius:99px;font-size:14px;font-weight:650;white-space:nowrap}
.ib{width:46px;height:46px;padding:0;margin:0;border-radius:14px;font-size:20px;flex:none;width:46px}
.trow{display:flex;justify-content:space-between;align-items:center;padding:13px 2px;border-bottom:1px solid var(--line);cursor:pointer;gap:12px}
.sw{width:50px;height:28px;border-radius:99px;background:rgba(255,255,255,.14);position:relative;transition:background .25s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .25s}
.sw.on{background:linear-gradient(135deg,var(--red2),var(--red))}
.sw.on::after{transform:translateX(22px)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#232638;border:1px solid var(--line);padding:12px 18px;border-radius:14px;z-index:60;animation:in .3s both;font-weight:650;max-width:90vw;text-align:center}
.sg{padding:12px 4px;flex:1}
input.txt{font-size:22px;font-weight:700;text-align:center}
.hero{text-align:center;margin:8px 0 4px}
.hero .he{font-size:68px;animation:float 3s ease-in-out infinite}
.word p{color:var(--mu);margin:12px 0 0;font-size:14px;white-space:normal;line-height:1.4}
.spec{position:relative;height:60px;margin:10px 0 4px;touch-action:pan-y}
.sp-in{position:absolute;inset:0;border-radius:16px;background:linear-gradient(90deg,#3f7bff,#8f6cff 50%,#ff2e4d);overflow:hidden}
.spec.live{height:84px;touch-action:none;cursor:ew-resize;user-select:none;-webkit-user-select:none}
.band{position:absolute;top:0;bottom:0;animation:bandin .7s both}
@keyframes bandin{from{opacity:0;transform:scaleY(0)}}
.band.b2{background:rgba(255,255,255,.35)}.band.b3{background:rgba(255,255,255,.6)}.band.b4{background:#ffc83d}
.mk{position:absolute;top:-4px;bottom:-4px;width:4px;margin-left:-2px;border-radius:4px;pointer-events:none}
.mk.tg{background:#0b0d14}
.mk.gs{background:#fff;box-shadow:0 0 14px #fff}
.mk.gs .knob{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.5),0 0 0 4px rgba(255,255,255,.35)}
.wl{display:flex;justify-content:space-between;font-weight:750;font-size:15px}
input[type=range].wv{width:100%;margin-top:16px;accent-color:var(--g1);height:34px}
.legend{display:flex;gap:14px;justify-content:center;font-size:12px;color:var(--mu);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.legend i.gl{background:#fff;box-shadow:0 0 6px #fff}
.locs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.locs .lo{margin:0;padding:12px 6px;font-size:14px}
.rx{border-radius:26px;min-height:58vh;display:grid;place-items:center;text-align:center;font-weight:850;font-size:32px;user-select:none;-webkit-user-select:none;touch-action:manipulation;transition:background .06s;margin-top:10px;padding:16px}
.rx.w{background:linear-gradient(145deg,#c4263c,#8f1226)}
.rx.g{background:linear-gradient(145deg,#22d98a,#0e9f63)}
.rx.d{background:linear-gradient(145deg,#2a2f3f,#1b1f2b)}
.bomb{font-size:130px;text-align:center;line-height:1.1;position:relative;animation:bpulse var(--bd,1s) ease-in-out infinite;filter:drop-shadow(0 0 30px rgba(255,120,40,.55));margin:6px 0}
@keyframes bpulse{50%{transform:scale(1.13) rotate(5deg)}}
.spark{position:absolute;font-size:36px;top:-4px;right:30%;animation:spk .25s infinite alternate}
@keyframes spk{to{transform:scale(1.4) rotate(25deg);opacity:.7}}

.dot{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px}
.dot.p1{background:#ff2e4d}.dot.p2{background:#ffc83d}
.c4s{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
.c4p{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:16px;background:rgba(255,255,255,.05);border:1.5px solid transparent;transition:all .25s}
.c4p.on{border-color:#fff;background:rgba(255,255,255,.12);transform:scale(1.03)}
.c4p .nm{font-weight:750;font-size:15px;max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c4turn{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:750;margin:6px 0 10px;min-height:24px}
.c4b{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;background:linear-gradient(160deg,#2f63e0,#1b3fa8);padding:10px;border-radius:22px;box-shadow:0 14px 34px rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.25);touch-action:manipulation}
.c4col{display:flex;flex-direction:column;gap:6px;cursor:pointer;-webkit-user-select:none;user-select:none}
.c4c{aspect-ratio:1;border-radius:50%;background:#0b0d14;box-shadow:inset 0 4px 8px rgba(0,0,0,.65);position:relative}
.c4col:active .c4c:first-child{box-shadow:inset 0 4px 8px rgba(0,0,0,.65),0 0 0 3px rgba(255,255,255,.7)}
.d{position:absolute;inset:0;border-radius:50%}
.d.p1{background:radial-gradient(circle at 35% 30%,#ff9aa9,#ff2e4d 55%,#b3122e)}
.d.p2{background:radial-gradient(circle at 35% 30%,#fff3b8,#ffc83d 55%,#c98a05)}
.d.drop{animation:c4drop .55s cubic-bezier(.45,.05,.75,.6) both;z-index:2}
@keyframes c4drop{0%{transform:translateY(calc(var(--f)*-112% - 40px))}72%{transform:translateY(0)}84%{transform:translateY(-9%)}94%{transform:translateY(0)}100%{transform:translateY(0)}}
.d.win{animation:c4win .6s infinite alternate;box-shadow:0 0 0 3px #fff,0 0 22px #fff;z-index:1}
@keyframes c4win{to{transform:scale(1.12)}}
.mode2{display:flex;gap:8px;margin:0 0 12px}.mode2 button{margin-top:0;flex:1;padding:12px}
.qrbox{background:#fff;padding:12px;border-radius:16px;margin:12px auto;max-width:240px}.qrbox svg{width:100%;height:auto;display:block}
.dot2{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;background:#35e0a1;flex:none}.dot2.off{background:#666}
#hw{position:fixed;inset:0;z-index:2;overflow:auto;margin:0 auto;max-width:520px;padding:18px 16px 60px;display:none}
body.cl .wheelw{display:none}
body.noperm #app button{opacity:.5}
[data-ptr]{touch-action:none}
.c4b[data-ptr]{touch-action:none}
#lv{display:none;position:fixed;top:8px;right:8px;z-index:70;background:rgba(20,22,34,.88);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer}
.c4col.hv .c4c:first-child{box-shadow:inset 0 4px 8px rgba(0,0,0,.65),0 0 0 3px rgba(255,255,255,.85)}
.c4col.hv .c4c:first-child::after{content:"";position:absolute;inset:12%;border-radius:50%;opacity:.7;background:#ff2e4d}
.c4b[data-t="1"] .c4col.hv .c4c:first-child::after{background:#ffc83d}

/* ===== Breites Layout (iPad / Desktop), Safe-Area, Vollbild-Knopf ===== */
html{background:var(--bg)}
main,#hw{padding-top:max(18px,env(safe-area-inset-top));padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));padding-bottom:max(60px,calc(env(safe-area-inset-bottom) + 40px))}
.c4b{max-width:max(300px,min(100%,calc((100vh - 300px) * 7 / 6)));margin-left:auto;margin-right:auto}
#fs{display:none;position:fixed;right:max(10px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));z-index:65;width:40px;height:40px;border-radius:12px;background:rgba(20,22,34,.72);border:1px solid var(--line);color:var(--tx);place-items:center;cursor:pointer;opacity:.6;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#fs.show{display:grid}
#fs:hover{opacity:1}
#fs svg{width:20px;height:20px}
@media (min-width:700px){
 main,#hw{max-width:740px}
 body{font-size:18px}
 .logo h1{font-size:50px}.q{font-size:30px}.big{font-size:42px}h2{font-size:24px}
 .card{padding:26px;border-radius:26px}
 button{padding:19px}
 input.num{font-size:44px}input.txt{font-size:26px}
 .grid{grid-template-columns:repeat(3,1fr);gap:16px}
 .gt{min-height:190px;padding:20px}.gt .te{font-size:50px}.gt b{font-size:22px}.gt small{font-size:13px}
 .opt span{font-size:21px}
 .word span{font-size:46px}
 .reel{font-size:100px}
 .ringw{width:190px;height:190px}.rt{font-size:54px}
 .wheelw{width:min(400px,55vh)}
 .bomb{font-size:160px}
 .rx{min-height:52vh;font-size:40px}
 .av.l{width:110px;height:110px;font-size:48px}
}
@media (min-width:1000px){
 main,#hw{max-width:880px}
 .grid{grid-template-columns:repeat(4,1fr)}
}

const HC={};
const HNS=['q','w','l','s','b','c'];
const hGet=ns=>{if(!HC[ns]){try{HC[ns]=JSON.parse(localStorage.getItem('pb_h_'+ns)||'{}')}catch(e){HC[ns]={}}}return HC[ns]};
const lim=()=>C.days*864e5;
function recent(ns,key){const t=hGet(ns)[key];return t!=null&&lim()>0&&Date.now()-t<lim()}
function mark(ns,key){
  const h=hGet(ns);h[key]=Date.now();const ks=Object.keys(h);
  if(ks.length>4000)ks.sort((a,b)=>h[a]-h[b]).slice(0,800).forEach(k=>delete h[k]);
  try{localStorage.setItem('pb_h_'+ns,JSON.stringify(h))}catch(e){}
}
// Erst alles, was länger als "Sperre" nicht dran war (gemischt), danach das am längsten Zurückliegende.
function ordered(list,key,ns){
  const h=hGet(ns),fresh=[],old=[];
  list.forEach(x=>{const k=key(x);if(!recent(ns,k))fresh.push(x);else old.push([h[k],x])});
  old.sort((a,b)=>a[0]-b[0]);
  return shuffle(fresh).concat(old.map(o=>o[1]));
}
function clearHist(){HNS.forEach(ns=>{HC[ns]={};try{localStorage.removeItem('pb_h_'+ns)}catch(e){}})}
function blocked(){return HNS.reduce((n,ns)=>n+Object.keys(hGet(ns)).filter(k=>recent(ns,k)).length,0)}

function tone(f,d,type,vol,when){const a=ac();if(!a||!C.sound)return;try{const t=a.currentTime+(when||0),o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(vol||.12,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d)}catch(e){}}
function noise(d,vol){const a=ac();if(!a||!C.sound)return;try{const n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource(),g=a.createGain();s.buffer=b;g.gain.value=vol||.4;s.connect(g);g.connect(a.destination);s.start()}catch(e){}}

const cv=$('fx'),cx=cv.getContext('2d');let parts=[],raf=0;

function confetti(n,colors){
  if(!C.fx)return;
  const W=cv.width,H=cv.height;
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,sp=(6+Math.random()*12)*devicePixelRatio;
    parts.push({x:W/2,y:H*.4,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-8*devicePixelRatio,w:(6+Math.random()*7)*devicePixelRatio,h:(8+Math.random()*10)*devicePixelRatio,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:colors[i%colors.length],life:1});
  }
  if(!raf)loop();
}
function loop(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts=parts.filter(p=>p.life>0);
  parts.forEach(p=>{p.vy+=.35*devicePixelRatio;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life-=.007;
    cx.save();cx.globalAlpha=Math.max(p.life,0);cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore()});
  raf=parts.length?requestAnimationFrame(loop):0;
  if(!raf)cx.clearRect(0,0,cv.width,cv.height);
}
function flash(color){
  vib([60,40,120]);if(!C.fx)return;
  const f=document.createElement('div');f.className='flash';if(color)f.style.background=color;document.body.appendChild(f);setTimeout(()=>f.remove(),900);
  document.body.classList.add('quake');setTimeout(()=>document.body.classList.remove('quake'),520);
}
function countUp(el,to,d,ms){
  if(!el)return;const t0=performance.now();
  (function f(t){const k=Math.min((t-t0)/ms,1),e=1-Math.pow(1-k,4);el.textContent=fmt(to*e,d);if(k<1&&document.body.contains(el))requestAnimationFrame(f);else el.textContent=fmt(to,d)})(t0);
}

  let a=pick(CITY),b=pick(CITY);while(b===a)b=pick(CITY);

  let d=2*6371*Math.asin(Math.sqrt(h));
  d=d<100?Math.round(d):d<1000?Math.round(d/5)*5:Math.round(d/10)*10;
  return [`Wie weit ist es in Luftlinie von ${a[0]} nach ${b[0]}?`,d,'km'];
}

const tmKey=()=>S.names.map(n=>n.trim()).join('\u0001')+'|'+S.nt;
const validTm=()=>!!S.tm&&S.tmKey===tmKey();
function tmList(tm,lastP){
  return `<div style="margin-top:12px">${tm.map((a,t)=>`<div class="tmc" style="border-color:${tcol(t)}">${tb(t,38)}<div style="flex:1"><b>Team ${TN[t][1]}</b><div class="chips" style="margin-top:6px">${a.map(i=>`<span class="chip on" style="${i===lastP?'animation:pop .5s cubic-bezier(.3,1.6,.5,1);':''}background:${tcol(t)};box-shadow:none">${esc(S.names[i])}</span>`).join('')||'<span class="sm">…</span>'}</div></div></div>`).join('')}</div>`;

function modeCard(){
  const d=GAMES[CUR],n=S.names.length;
  if(!d.teams)return `<div class="card"><h2>Spielmodus</h2><p style="margin:0">Jeder gegen jeden – hier ergeben Teams keinen Sinn.</p></div>`;
  const mx=Math.max(2,Math.min(4,Math.floor(n/2)));if(S.nt>mx)S.nt=mx;if(d.nt2)S.nt=2;
  let h=`<div class="card"><h2>Spielmodus</h2><div class="row"><button class="${S.mode!='team'?'':'sec'} sg" onclick="setMode('solo')">Jeder gegen jeden</button><button class="${S.mode=='team'?'':'sec'} sg" onclick="setMode('team')">Teams 🎡</button></div>`;
  if(S.mode=='team'){
    if(n<4)h+=`<p>Für Teams braucht ihr mindestens 4 Spieler (aktuell ${n}).</p>`;
    else{
      if(!d.nt2)h+=`<p class="sm" style="margin:14px 0 0">Anzahl Teams</p><div class="row">${[2,3,4].filter(k=>k<=mx).map(k=>`<button class="${S.nt==k?'':'sec'} sg" onclick="setNt(${k})">${k}</button>`).join('')}</div>`;

      h+=validTm()?tmList(S.tm):`<p class="sm" style="margin-bottom:0">Noch nicht ausgelost. Das Glücksrad startet beim Spielstart automatisch.</p>`;
    }
  }
  return h+'</div>';
}

/* ---------- Glücksrad ---------- */
let W={};
function wheel(after,label){
  S.after=after;S.alabel=label||"Los geht's";
  W={rem:S.names.map((_,i)=>i),tm:Array.from({length:S.nt},()=>[]),k:0,busy:false};
  scr(`${logo('Glücksrad')}<p style="margin-top:0">Wer spielt zusammen? Das Rad entscheidet.</p>
  <div class="wheelw"><div class="ptr"></div><canvas id="wh" width="600" height="600"></canvas></div>
  <div class="row" id="wb"><button onclick="spin(4200)">🎡 Drehen</button><button class="sec" onclick="spinAll()">Alle auslosen</button></div>
  <div id="tms"></div><div id="wd"></div>`);
  drawWheel();renderTms();
}
function drawWheel(){
  const c=$('wh');if(!c)return;
  const x=c.getContext('2d'),R=300;x.clearRect(0,0,600,600);
  const n=W.rem.length;if(!n)return;const a=Math.PI*2/n;
  W.rem.forEach((pi,j)=>{
    x.beginPath();x.moveTo(R,R);x.arc(R,R,R-8,-Math.PI/2+j*a,-Math.PI/2+(j+1)*a);x.closePath();
    x.fillStyle=`hsl(${hue(pi)} 80% 52%)`;x.fill();x.strokeStyle='rgba(255,255,255,.85)';x.lineWidth=4;x.stroke();
    x.save();x.translate(R,R);x.rotate(-Math.PI/2+(j+.5)*a);x.fillStyle='#fff';x.font='bold 36px system-ui,sans-serif';x.textAlign='right';x.textBaseline='middle';x.shadowColor='rgba(0,0,0,.45)';x.shadowBlur=6;
    x.fillText((S.names[pi].trim()||'?').slice(0,10),R-40,0);x.restore();
  });
  x.beginPath();x.arc(R,R,38,0,7);x.fillStyle='#14161c';x.fill();x.strokeStyle='#fff';x.lineWidth=5;x.stroke();
}
function renderTms(lastT,lastP){const e=$('tms');if(e)e.innerHTML=tmList(W.tm,lastP)}
function spin(ms,cb){
  if(W.busy||!W.rem.length)return;W.busy=true;
  const n=W.rem.length,k=Math.floor(Math.random()*n),a=360/n;
  const R=360*(4+Math.floor(Math.random()*3))-(k+.5)*a+(Math.random()-.5)*a*.7;
  const c=$('wh');
  c.style.transition=`transform ${ms}ms cubic-bezier(.12,.7,.1,1)`;c.style.transform=`rotate(${R}deg)`;
  for(let i=0;i<10;i++)setTimeout(()=>sfx.tick(),ms*(1-Math.pow(1-i/10,2))*.9);
  setTimeout(()=>{
    if(!$('wh'))return;
    const pi=W.rem.splice(k,1)[0],t=W.k%W.tm.length;W.k++;W.tm[t].push(pi);
    vib([40,30,60]);sfx.ok();confetti(35,[tcol(t),'#fff']);
    c.style.transition='none';c.style.transform='rotate(0deg)';
    drawWheel();renderTms(t,pi);W.busy=false;
    if(!W.rem.length)wheelDone();else if(cb)setTimeout(cb,550);
  },ms+80);
}
function spinAll(){const go=()=>spin(2400,go);go()}
function wheelDone(){
  S.tm=W.tm.map(a=>a.slice());S.tmKey=tmKey();
  const wb=$('wb');if(wb)wb.style.display='none';
  $('wd').innerHTML=`<button onclick="S.after()">${S.alabel}</button><button class="sec" onclick="wheel(S.after,S.alabel)">Nochmal auslosen</button>`;
  confetti(140,GOLD);sfx.win();vib([50,50,50,50,200]);
}

/* ---------- Spiel-Session ---------- */
function startSession(id){
  const d=GAMES[id];
  S.P=S.names.map((n,i)=>n.trim()||'Spieler '+(i+1));
  CUR=id;TH=d.c;
  G={id,def:d,o:OPT[id],team:false};
  if(d.teams&&teamOn()){
    if(!validTm()){wheel(()=>startSession(id),"Los geht's");return}
    G.team=true;G.tm=S.tm.map(a=>a.slice());G.tof=[];G.tm.forEach((a,t)=>a.forEach(i=>G.tof[i]=t));
  }
  G.ents=G.team?G.tm.map((a,t)=>({name:'Team '+TN[t][1],sub:a.map(i=>S.P[i]).join(' & '),emoji:TN[t][0],av:(sz,cls)=>tb(t,sz,cls)}))
              :S.P.map((p,i)=>({name:p,sub:'',emoji:'👑',av:(sz,cls)=>av(i,cls,sz)}));
  G.pts=G.ents.map(()=>0);
  d.start();
}
const eOf=i=>G.team?G.tof[i]:i;
function plan(rounds){
  const out=[],n=S.P.length;
  if(!G.team){for(let r=0;r<rounds;r++)for(let p=0;p<n;p++)out.push({a:p,e:p})}
  else{const nt=G.tm.length,mx=Math.max(...G.tm.map(a=>a.length)),ix=G.tm.map(()=>0);
    for(let k=0;k<rounds*mx*nt;k++){const t=k%nt,tm=G.tm[t];out.push({a:tm[ix[t]++%tm.length],e:t})}}
  return out;
}
function hand(pi,msg,go,pr,tag){
  HF=go;
  scr(`${pr||''}<div class="card hand">${av(pi,'l')}<p style="margin:0">${tag?tag+' – ':''}Gerät weitergeben an</p><div class="big">${esc(S.P[pi])}</div><p>${msg}</p><button onclick="HF()">Ich bin's</button></div>`);
}
function boardHTML(vals,o){
  o=o||{};const m=Math.max(1,...vals);
  return `<div class="card"><div class="sm" style="margin-bottom:6px">${o.label||(G.team?'Teamwertung':'Punktestand')}</div>${G.ents.map((e,i)=>`<div class="sb">${e.av(26)}<span class="nm">${esc(e.name.replace(/^Team /,''))}</span><div class="bar"><i style="width:${vals[i]/m*100}%"></i></div><span class="pt">${vals[i]}${o.unit||' P'}</span></div>`).join('')}</div>`;
}
function finish(o){
  o=o||{};stopAll();
  const vals=o.vals||G.pts;
  const idx=G.ents.map((_,i)=>i).sort((a,b)=>o.asc?vals[a]-vals[b]:vals[b]-vals[a]);
  const top=idx[0],tie=G.ents.length>1&&vals[idx[1]]===vals[top];
  const m=Math.max(1,...vals),unit=o.unit||' P';
  scr(`${logo(G.def.name,1)}
  <div class="card win"><div class="crown">${G.team?G.ents[top].emoji:'👑'}</div>${G.ents[top].av(0,'l')}<div class="sm">${tie?'Gleichstand an der Spitze':(G.team?'Siegerteam':'Gewinner')}</div><div class="big">${esc(G.ents[top].name)}</div><div class="sm">${esc(G.ents[top].sub)}${G.ents[top].sub?' · ':''}${vals[top]}${unit}</div></div>

function buildDeck(n){
  const nG=Math.round(n*.5);
  const deck=ordered(Q,q=>q[0],'q').slice(0,n-nG),keys=new Set(deck.map(q=>q[0]));
  let guard=0,gen=0;
  const ok=q=>q&&isFinite(q[1])&&q[1]!==0&&!keys.has(q[0]);
  while(gen<nG&&guard++<600){const q=pick(GEN)();if(ok(q)&&!recent('q',q[0])){keys.add(q[0]);deck.push(q);gen++}}
  while(deck.length<n&&guard++<1200){const q=pick(GEN)();if(ok(q)){keys.add(q[0]);deck.push(q)}}
  return shuffle(deck);
}

function arResult(){

      <div class="dev"><i></i></div>
      <div class="sm">Schätzung <b style="color:var(--tx)">${fmt(G.g[i])}</b> · ${pct<0.05?'exakt':fmt(Math.round(pct*10)/10)+' % daneben'}<br>Tipp: ${esc(S.P[G.t[i]])} ${tipOK[i]?'<span class="tag t">richtig +1</span>':'<span class="tag x">falsch</span>'}</div></div>`}).join('')}</div>
  <div class="late" style="--d:${end}s">${boardHTML(G.pts)}<button onclick="${last?'arFinish()':'G.r++;arRound()'}">${last?'Endergebnis 🏆':'Nächste Frage'}</button></div>`);

function spyEnd(how,gi){

}

function bRound(){G.q=G.qs[G.r%G.qs.length];mark('b',G.q[0]);G.fk=[];G.i=0;hand(G.i,'Schreibe eine falsche Antwort – niemand schaut mit!',bInput,bProg())}

GAMES.react={name:'Reflex',e:'⚡',tag:'Wer ist am schnellsten?',c:['#22c55e','#06b6d4'],min:2,teams:true,

  opts:()=>`<p class="sm" style="margin:0 0 8px">Runden</p>${seg('react','rounds',[3,5,8])}`,
  start:rxStart};
function rxStart(){G.r=0;G.rounds=G.o.rounds;G.best=S.P.map(()=>Infinity);rxRound()}
function rxProg(){return prg(G.r+G.i/S.P.length,G.rounds,`Runde ${G.r+1} von ${G.rounds}`)}
function rxRound(){G.times=[];G.i=0;rxHand()}
function rxHand(){hand(G.i,'Finger bereit! Rot = warten, Grün = tippen.',rxGo,rxProg(),G.team?`Team ${TN[eOf(G.i)][0]} ${TN[eOf(G.i)][1]}`:'')}
function rxGo(){
  G.rs='wait';
  scr(`${rxProg()}<div class="rx w" id="rx" onpointerdown="rxTap()"><div><div style="font-size:60px">✋</div>Warte …<div class="sm" style="margin-top:6px">${esc(S.P[G.i])}</div></div></div>`);
  clearTimeout(G.iv2);
  G.iv2=setTimeout(()=>{
    const el=$('rx');if(!el||G.rs!=='wait')return;
    G.rs='go';el.className='rx g';el.innerHTML='<div><div style="font-size:70px">⚡</div>JETZT!</div>';sfx.go();vib(30);G.t0=performance.now();
  },rnd(1500,5000));
}
function rxTap(){
  const el=$('rx');if(!el)return;
  if(G.rs==='wait'){
    clearTimeout(G.iv2);G.rs='done';G.times[G.i]=Infinity;sfx.bad();vib([80,40,80]);
    el.className='rx d';el.innerHTML='<div><div style="font-size:60px">🙈</div>Zu früh!<div class="sm" style="margin-top:6px">Fehlstart</div><button onclick="rxNext()" style="margin-top:18px">Weiter</button></div>';
  }else if(G.rs==='go'){
    const ms=Math.round(performance.now()-G.t0);G.rs='done';G.times[G.i]=ms;if(ms<G.best[G.i])G.best[G.i]=ms;
    const r=ms<180?'🚀 Unfair schnell':ms<240?'⚡ Blitzschnell':ms<320?'👍 Solide':ms<450?'🐢 Gemütlich':'🦥 Eingeschlafen?';
    el.className='rx d';el.innerHTML=`<div style="width:100%"><div style="font-size:64px;font-weight:900;letter-spacing:-2px"><span id="rms">0</span> ms</div><div>${r}</div><button onclick="rxNext()" style="margin-top:18px">Weiter</button></div>`;
    countUp($('rms'),ms,0,500);sfx.ok();vib(30);
  }

function rxNext(){
  G.i++;
  if(G.i<S.P.length)rxHand();else rxResult();

function rxResult(){
  const idx=S.P.map((_,i)=>i).sort((a,b)=>G.times[a]-G.times[b]);

GAMES.c4={name:'4 Gewinnt',e:'🔴',tag:'Der Duell-Klassiker',c:['#3b82f6','#1d4ed8'],min:2,teams:true,nt2:true,

const botAv=(sz,cls)=>`<div class="av ${cls||''}" style="${sz?`width:${sz}px;height:${sz}px;font-size:${Math.round(sz*.5)}px;`:''}background:linear-gradient(135deg,#64748b,#334155)">🤖</div>`;
const C4D=[[0,1],[1,0],[1,1],[1,-1]];
const c4Rows=6,c4Cols=7;
function c4Line(b,r,c){
  const p=b[r][c];if(!p)return null;
  for(const [dr,dc] of C4D){
    const cells=[[r,c]];
    for(const s of [1,-1]){let rr=r+dr*s,cc=c+dc*s;while(rr>=0&&rr<c4Rows&&cc>=0&&cc<c4Cols&&b[rr][cc]===p){cells.push([rr,cc]);rr+=dr*s;cc+=dc*s}}
    if(cells.length>=4)return cells;
  }
  return null;
}
function c4Win(b,r,c){
  const p=b[r][c];
  for(const [dr,dc] of C4D){
    let n=1;
    for(const s of [1,-1]){let rr=r+dr*s,cc=c+dc*s;while(rr>=0&&rr<c4Rows&&cc>=0&&cc<c4Cols&&b[rr][cc]===p){n++;rr+=dr*s;cc+=dc*s}}
    if(n>=4)return true;
  }
  return false;
}
const c4Moves=b=>[3,2,4,1,5,0,6].filter(c=>b[0][c]===0);
function c4Put(b,c,p){for(let r=c4Rows-1;r>=0;r--)if(b[r][c]===0){b[r][c]=p;return r}return -1}
function c4Eval(b,p){
  let s=0;const o=3-p;
  for(let r=0;r<c4Rows;r++)if(b[r][3]===p)s+=3;else if(b[r][3]===o)s-=3;
  for(let r=0;r<c4Rows;r++)for(let c=0;c<c4Cols;c++)for(const [dr,dc] of C4D){
    const er=r+dr*3,ec=c+dc*3;if(er<0||er>=c4Rows||ec<0||ec>=c4Cols)continue;
    let mine=0,theirs=0;
    for(let k=0;k<4;k++){const v=b[r+dr*k][c+dc*k];if(v===p)mine++;else if(v===o)theirs++}
    if(mine&&theirs)continue;
    if(mine===3)s+=5;else if(mine===2)s+=2;
    if(theirs===3)s-=6;else if(theirs===2)s-=2;
  }
  return s;
}
function c4Nega(b,d,al,be,p){
  const mv=c4Moves(b);if(!mv.length)return 0;
  if(d===0)return c4Eval(b,p);
  let best=-Infinity;
  for(const c of mv){
    const r=c4Put(b,c,p);
    const v=c4Win(b,r,c)?1e6+d:-c4Nega(b,d-1,-be,-al,3-p);
    b[r][c]=0;
    if(v>best)best=v;if(best>al)al=best;if(al>=be)break;
  }
  return best;
}
function c4Cpu(b,level){
  const mv=c4Moves(b);
  if(level==='leicht'&&Math.random()<.35)return pick(mv);
  const depth={leicht:2,mittel:4,schwer:6}[level]||4;
  let best=-Infinity,bc=mv[0];
  for(const c of mv){
    const r=c4Put(b,c,2);
    let v=c4Win(b,r,c)?1e6+99:-c4Nega(b,depth-1,-Infinity,Infinity,1);
    b[r][c]=0;v+=Math.random()*.4;
    if(v>best){best=v;bc=c}
  }
  return bc;
}

function c4Start(){
  const o=G.o;G.cpu=false;
  if(!G.team){
    const a=Math.min(o.a,S.P.length-1);
    if(o.vs==='cpu'){
      G.cpu=true;
      G.pi=[a,-1];
      G.ents=[{name:S.P[a],sub:'',emoji:'👑',av:(sz,cls)=>av(a,cls,sz)},{name:'Computer',sub:'Stufe: '+o.lvl,emoji:'🤖',av:(sz,cls)=>botAv(sz,cls)}];
    }else{
      const b=(o.b===a?(a+1)%S.P.length:Math.min(o.b,S.P.length-1));
      G.pi=[a,b];
      G.ents=[a,b].map(i=>({name:S.P[i],sub:'',emoji:'👑',av:(sz,cls)=>av(i,cls,sz)}));
    }
    G.pts=[0,0];
  }
  G.need=Math.ceil(o.best/2);G.r=0;G.ix=[0,0];c4Round();
}
function c4Mover(e){
  if(G.team){const tm=G.tm[e],i=tm[G.ix[e]++%tm.length];G.mi=i;return S.P[i]}
  G.mi=(G.pi&&G.pi[e]>=0)?G.pi[e]:0;return G.ents[e].name;
}
function c4Round(){
  G.bd=Array.from({length:c4Rows},()=>Array(c4Cols).fill(0));
  G.turn=G.r%2;G.over=false;G.busy=false;G.last=null;G.winCells=null;
  G.mover=c4Mover(G.turn);
  c4Screen();
  if(G.cpu&&G.turn===1)c4CpuMove();
}
function c4Board(){
  let h='';
  for(let c=0;c<c4Cols;c++){
    h+=`<div class="c4col">`;
    for(let r=0;r<c4Rows;r++){
      const v=G.bd[r][c],isLast=G.last&&G.last[0]===r&&G.last[1]===c,isWin=G.winCells&&G.winCells.some(x=>x[0]===r&&x[1]===c);
      h+=`<div class="c4c">${v?`<i class="d p${v}${isLast?' drop':''}${isWin?' win':''}" style="--f:${r+1}"></i>`:''}</div>`;
    }
    h+='</div>';
  }
  return h;
}
function c4Banner(){
  const e=G.turn,who=G.team?`${TN[e][0]} Team ${TN[e][1]} · ${esc(G.mover)}`:esc(G.ents[e].name);
  return `<i class="dot p${e+1}"></i><span>${who} ${G.cpu&&e===1?'denkt …':'ist dran'}</span>`;
}
function c4Head(){
  return `<div class="c4s">${[0,1].map(e=>`<div class="c4p ${G.turn===e&&!G.over?'on':''}" id="c4p${e}">${G.ents[e].av(34)}<div><div class="nm">${esc(G.ents[e].name.replace(/^Team /,''))}</div><div class="sm"><i class="dot p${e+1}"></i> ${G.pts[e]} / ${G.need}</div></div></div>`).join('')}</div>`;
}
function c4Screen(){
  scr(`<div class="sm" style="margin:6px 0">Runde ${G.r+1} · Best of ${G.o.best}</div>${c4Head()}<div class="c4turn" id="c4t">${c4Banner()}</div><div class="c4b" id="c4b" data-ptr="1" data-t="${G.turn}">${c4Board()}</div><div id="c4r"></div>`);
  c4Bind();
}
/* Wischen: Finger aufsetzen, Spalte per Wischen wechseln, loslassen = Stein fällt */
function c4Col(x){
  const b=$('c4b'),r=b.getBoundingClientRect(),pad=10,gap=6,w=(r.width-2*pad-6*gap)/c4Cols;
  return Math.max(0,Math.min(c4Cols-1,Math.floor((x-r.left-pad+gap/2)/(w+gap))));
}
function c4Hov(c){document.querySelectorAll('#c4b .c4col').forEach((el,i)=>el.classList.toggle('hv',i===c))}
function c4Bind(){
  const b=$('c4b');if(!b)return;
  b.addEventListener('pointerdown',e=>{
    if(G.busy||G.over)return;
    G.dn=true;try{b.setPointerCapture(e.pointerId)}catch(_){}
    c4Hov(c4Col(e.clientX));e.preventDefault();
  });
  b.addEventListener('pointermove',e=>{if(G.dn)c4Hov(c4Col(e.clientX))});
  b.addEventListener('pointerup',e=>{if(!G.dn)return;G.dn=false;const c=c4Col(e.clientX);c4Hov(-1);c4Drop(c)});
  b.addEventListener('pointercancel',()=>{G.dn=false;c4Hov(-1)});
}
function c4Drop(c){
  if(G.busy||G.over)return;
  const r=c4Put(G.bd,c,G.turn+1);
  if(r<0){vib(40);sfx.bad();return}
  G.last=[r,c];sfx.pop();vib(15);
  const line=c4Line(G.bd,r,c);
  $('c4b').innerHTML=c4Board();
  if(line){G.over=true;G.winCells=line;G.busy=true;setTimeout(()=>{$('c4b')&&($('c4b').innerHTML=c4Board());c4Won(G.turn)},650);return}
  if(!c4Moves(G.bd).length){G.over=true;setTimeout(c4Draw,500);return}
  G.turn=1-G.turn;G.mover=c4Mover(G.turn);
  const bd=$('c4b');if(bd)bd.setAttribute('data-t',G.turn);
  const t=$('c4t');if(t)t.innerHTML=c4Banner();
  [0,1].forEach(e=>{const el=$('c4p'+e);if(el)el.classList.toggle('on',G.turn===e)});
  if(G.cpu&&G.turn===1)c4CpuMove();
}
function c4CpuMove(){
  G.busy=true;
  setTimeout(()=>{
    if(!$('c4b'))return;
    const c=c4Cpu(G.bd.map(r=>r.slice()),G.o.lvl);
    G.busy=false;c4Drop(c);
  },G.o.lvl==='schwer'?700:520);
}
function c4Won(e){
  G.pts[e]++;G.busy=false;
  const series=G.pts[e]>=G.need;
  const botWin=G.cpu&&e===1;
  if(botWin)sfx.bad();else{confetti(series?160:80,GOLD);sfx.win()}
  const name=G.team?`Team ${TN[e][1]}`:G.ents[e].name;
  const r=$('c4r');if(!r)return;
  r.innerHTML=`<div class="card ans" style="margin-top:14px"><div style="font-size:50px;animation:pop .6s both">${botWin?'🤖':'🎉'}</div><div class="big">${esc(name)} gewinnt${series?' die Serie!':' die Runde!'}</div><div class="sm">Stand ${G.pts[0]} : ${G.pts[1]}</div><button onclick="${series?'finish({unit:\' Siege\'})':'G.r++;c4Round()'}">${series?'Endergebnis 🏆':'Nächste Runde'}</button></div>`;
  [0,1].forEach(i=>{const el=$('c4p'+i);if(el)el.classList.remove('on')});
  r.scrollIntoView&&r.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function c4Draw(){
  sfx.ok();
  const r=$('c4r');if(!r)return;
  r.innerHTML=`<div class="card ans" style="margin-top:14px"><div style="font-size:50px">🤝</div><div class="big">Unentschieden!</div><p>Das Brett ist voll. Diese Runde wird wiederholt.</p><button onclick="c4Round()">Nochmal</button></div>`;
}

   Das Spiel läuft nur auf dem Host. Alle anderen Handys zeigen eine Spiegelung des Bildschirms
   (nur wenn sie dran sein dürfen) und schicken ihre Eingaben an den Host.            */
let ACT=null,PERM=null,WAIT='';
const PRE='pbox-',APP_CODE_LEN=5;
let UID=0;
const hwEl=$('hw');

const cleanName=(n,fb)=>{n=String(n==null?'':n).replace(/[\u0000-\u001f\u007f<>&"'`]/g,'').trim().slice(0,16);return n||fb};

/* ---------- Wer darf was? ---------- */
function devIdx(i){return(i===0||isOpen(NET.m[i]))?i:0}                 // Gerät des Spielers i (getrennt → Host)
function eligible(mi){return ACT==null||devIdx(ACT)===mi}               // sieht Gerät mi den echten Bildschirm?
function permOf(){
  if(ACT!=null)return devIdx(ACT);
  let p=PERM;if(typeof p==='function'){try{p=p()}catch(e){p=null}}
  if(p==null||p==='host')return 'host';
  if(p==='all')return 'all';
  return devIdx(p);
}
function canAct(mi){const p=permOf();return p==='all'||(p==='host'?mi===0:p===mi)}

/* ---------- Spiegelung: Host → Clients ---------- */
function tagAll(){app.querySelectorAll('*').forEach(e=>{if(!e.hasAttribute('data-n'))e.setAttribute('data-n',++UID)})}
function idOf(e){if(!e.hasAttribute('data-n'))e.setAttribute('data-n',++UID);return +e.getAttribute('data-n')}
let obs=null,recs=[],ft=0,lastF=0;
function startMirror(){
  tagAll();recs=[];
  obs=new MutationObserver(rs=>{for(const r of rs)recs.push(r);schedFlush()});
  obs.observe(app,{childList:true,subtree:true,attributes:true,characterData:true});
}
function stopMirror(){if(obs){obs.disconnect();obs=null}recs=[];clearTimeout(ft);ft=0}
function schedFlush(){if(ft)return;ft=setTimeout(flush,Math.max(0,60-(Date.now()-lastF)))}
function flush(){
  clearTimeout(ft);ft=0;lastF=Date.now();
  if(!recs.length||!NET.host)return;
  const rs=recs;recs=[];
  const targets=NET.m.filter((m,i)=>i>0&&m.view==='mirror'&&isOpen(m)&&eligible(i));
  if(!targets.length)return;
  let full=false;const dirty=new Set(),attrs=new Map();
  for(const r of rs){
    if(r.type==='childList'){if(r.target===app)full=true;else dirty.add(r.target)}
    else if(r.type==='characterData'){const p=r.target.parentElement;if(p&&p!==app)dirty.add(p);else if(p===app)full=true}
    else if(r.type==='attributes'){
      if(r.attributeName==='data-n'||r.target===app)continue;
      if(!attrs.has(r.target))attrs.set(r.target,new Set());attrs.get(r.target).add(r.attributeName);
    }
  }
  let pkt;
  if(full){tagAll();pkt={t:'full',html:app.innerHTML}}
  else{
    let d=[...dirty].filter(e=>app.contains(e));
    d=d.filter(e=>!d.some(o=>o!==e&&o.contains(e)));
    const ops=[];
    d.forEach(e=>{const n=idOf(e);e.querySelectorAll('*').forEach(x=>{if(!x.hasAttribute('data-n'))x.setAttribute('data-n',++UID)});ops.push({o:'h',n,h:e.innerHTML})});
    attrs.forEach((names,el)=>{
      if(!app.contains(el)||d.some(x=>x!==el&&x.contains(el)))return;
      const n=idOf(el);names.forEach(k=>ops.push({o:'a',n,k,v:el.getAttribute(k)}));
    });
    if(!ops.length)return;
    pkt={t:'mut',ops};
  }
  targets.forEach(m=>sendTo(m,pkt));
  sendPerms();
}
function hostView(el){
  app.style.visibility=el?'':'hidden';
  hwEl.style.display=el?'none':'block';
  if(!el)hwEl.innerHTML=WAIT;
}
function syncViews(){
  if(!NET.host)return;
  flush();
  NET.m.forEach((m,i)=>{
    const el=eligible(i),want=el?'mirror':'wait';
    if(i===0){hostView(el);m.view=want;return}
    if(!isOpen(m)){m.view='none';return}
    if(want==='mirror'&&m.view!=='mirror'){tagAll();sendTo(m,{t:'full',html:app.innerHTML});m.view='mirror'}
    else if(want==='wait'&&(m.view!=='wait'||m.wh!==WAIT)){sendTo(m,{t:'wait',html:WAIT});m.view='wait';m.wh=WAIT}
  });
  sendPerms();
}
function sendPerms(){
  NET.m.forEach((m,i)=>{if(i===0||!isOpen(m))return;const p=canAct(i);if(m.perm!==p){m.perm=p;sendTo(m,{t:'perm',ok:p})}});
}
function fxSend(o){if(!NET.host)return;NET.m.forEach((m,i)=>{if(i>0&&m.view==='mirror'&&isOpen(m))sendTo(m,{t:'fx',k:o.k,a:o.a})})}
function waitHTML(pi,pr,tag){
  return `<div class="screen" style="--g1:${TH[0]};--g2:${TH[1]}">${pr||''}<div class="card hand">${av(pi,'l')}<p style="margin:0">${tag?tag+' – ':''}Gerade dran</p><div class="big">${esc(S.P?S.P[pi]:nameOf(pi))}</div><p>Warte kurz … ${NET.on?'🔒':''}</p></div></div>`;
}

function wrapPub(n,permFn){
  const f=window[n];if(typeof f!=='function')return;
  window[n]=function(){
    ACT=null;PERM=permFn?permFn():null;
    if(n==='startSession')NET.inGame=true;
    if(MENU.indexOf(n)>=0){NET.inGame=false;NET.scr=(n==='home')?'home':null;netPrune()}
    else NET.scr=null;
    const r=f.apply(this,arguments);
    if(NET.host)syncViews();
    return r;
  };
}

  if(!window.Peer){toast('Online ist hier nicht verfügbar');return}

function netTryHost(tries,name){
  const code=netCode();let opened=false;
  let p;try{p=new Peer(PRE+code,{debug:0})}catch(e){netStatus('Verbindung nicht möglich.','onlineMenu()');return}
  p.on('error',e=>{
    if(e&&e.type==='unavailable-id'&&tries<6){try{p.destroy()}catch(_){}netTryHost(tries+1,name);return}
    if(!opened)netStatus('Keine Verbindung zum Vermittlungsserver ('+((e&&e.type)||'Fehler')+').<br><span class="sm">Prüfe dein Internet und versuche es nochmal.</span>','onlineMenu()');
    else toast('Netzwerk: '+((e&&e.type)||'Fehler'));
  });
  p.on('disconnected',()=>{if(opened&&NET.peer===p){try{p.reconnect()}catch(e){}}});
  p.on('open',()=>{
    opened=true;NET.peer=p;NET.on=true;NET.host=true;NET.client=false;NET.code=code;NET.inGame=false;
    NET.localNames=S.names.slice();
    NET.m=[{name,conn:null,last:Date.now(),view:'mirror',perm:true}];S.names=[name];
    startMirror();wake();hbStart();
    p.on('connection',netOnConn);
    lobbyScreen();
  });
}
function netOnConn(c){
  let mem=null;
  c.on('data',d=>{
    if(!d||typeof d!=='object'||!NET.host)return;
    if(d.t==='hi'){
      if(mem)return;
      const nm0=cleanName(d.n,'Gast');
      let m=NET.m.find((x,i)=>i>0&&x.name===nm0&&!isOpen(x));
      if(m){try{m.conn&&m.conn.close()}catch(e){}}
      else{
        if(NET.m.length>=10){try{c.send({t:'bye',why:'Die Lobby ist voll (max. 10).'})}catch(e){}setTimeout(()=>{try{c.close()}catch(e){}},400);return}
        let nm=nm0,k=2;while(NET.m.some(x=>x.name===nm))nm=nm0.slice(0,13)+' '+(k++);
        m={name:nm};NET.m.push(m);
      }
      m.conn=c;m.last=Date.now();m.view='none';m.perm=null;m.wh=null;mem=m;
      sendTo(m,{t:'welcome',idx:NET.m.indexOf(m),name:m.name,code:NET.code});
      netMembersChanged();
      return;
    }
    if(!mem||mem.conn!==c)return;
    mem.last=Date.now();
    if(d.t==='ev')netEvent(mem,d);
  });
  c.on('close',()=>{if(mem&&mem.conn===c){mem.view='none';netMembersChanged()}});
  c.on('error',()=>{});
}
function netMembersChanged(){
  if(!NET.host)return;
  netPrune();
  S.names=NET.m.map(x=>x.name);
  if(NET.scr==='lobby')lobbyScreen();else if(NET.scr==='home')home();
  syncViews();
}
function netPrune(){
  if(!NET.host||NET.inGame)return;
  NET.m=NET.m.filter((x,i)=>i===0||isOpen(x));
  S.names=NET.m.map(x=>x.name);
}

    stopMirror();hbStop();
    try{NET.peer&&NET.peer.destroy()}catch(e){}
    if(NET.localNames)S.names=NET.localNames;
  }
  NET.on=false;NET.host=false;NET.m=[];NET.peer=null;NET.localNames=null;NET.inGame=false;NET.scr=null;NET.code='';
  ACT=null;PERM=null;hostView(true);
}

/* ---------- Host: Eingaben der Clients ---------- */
function netEvent(m,d){
  const idx=NET.m.indexOf(m);
  if(idx<0||!canAct(idx))return;
  if(d.vals&&typeof d.vals==='object'){
    for(const k in d.vals){
      const el=app.querySelector('[data-n="'+(+k)+'"]');
      if(el&&/^(INPUT|TEXTAREA)$/.test(el.tagName))el.value=String(d.vals[k]).slice(0,200);
    }
  }
  const el=app.querySelector('[data-n="'+(+d.n)+'"]');
  if(!el)return;
  const ty=d.ty;NET.syn=true;
  try{
    if(ty==='click')el.click();
    else if(ty==='in'){if(/^(INPUT|TEXTAREA)$/.test(el.tagName))el.value=String(d.v==null?'':d.v).slice(0,200)}
    else if(ty==='key'){
      if(/^(INPUT|TEXTAREA)$/.test(el.tagName)&&d.v!=null)el.value=String(d.v).slice(0,200);
      el.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',bubbles:true,cancelable:true}));
    }
    else if(/^pointer(down|move|up|cancel)$/.test(ty)){
      const r=el.getBoundingClientRect();
      const x=r.left+Math.max(0,Math.min(1,+d.rx||0))*r.width,y=r.top+Math.max(0,Math.min(1,+d.ry||0))*r.height;
      el.dispatchEvent(new PointerEvent(ty,{bubbles:true,cancelable:true,clientX:x,clientY:y,pointerId:1,isPrimary:true,pointerType:'touch'}));
    }
  }catch(e){}
  NET.syn=false;
}

/* ---------- Herzschlag ---------- */
let hbT=0;
function hbStart(){
  hbStop();
  hbT=setInterval(()=>{
    if(NET.host){
      NET.m.forEach((m,i)=>{
        if(i===0||!m.conn)return;
        sendTo(m,{t:'hb'});
        if(isOpen(m)&&Date.now()-m.last>16000){try{m.conn.close()}catch(e){}m.view='none';netMembersChanged()}
      });
    }else if(NET.client){
      try{NET.conn&&NET.conn.open&&NET.conn.send({t:'ev',ty:'hb'})}catch(e){}
      if(NET.lastHost&&Date.now()-NET.lastHost>16000)netClientLost();
    }
  },4000);
}
function hbStop(){clearInterval(hbT);hbT=0}

function joinScreen(code){
  stopAll();TH=['var(--red2)','var(--red)'];
  scr(`${logo('Beitreten')}<div class="card"><div class="sm">Lobby</div><div class="big" style="letter-spacing:5px">${esc(code)}</div>
  <h2 style="margin-top:14px">Dein Name</h2><input id="myn" maxlength="16" value="${esc(myName())}" placeholder="Name" autocomplete="off">
  <button onclick="netJoinStart('${esc(code)}')">Beitreten</button></div><button class="sec" onclick="history.replaceState(null,'',location.pathname);home()">Abbrechen</button>`);

function netJoinStart(code){
  const nm=cleanName(($('myn')||{}).value,'');
  if(!code)code=(($('jc')||{}).value||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(!nm){toast('Bitte einen Namen eingeben');return}
  if(code.length!==APP_CODE_LEN){toast('Bitte den '+APP_CODE_LEN+'-stelligen Code eingeben');return}
  if(!window.Peer){toast('Online ist hier nicht verfügbar');return}
  setMyName(nm);netJoin(code,nm);
}
function netJoin(code,name){
  lostInfo=null;
  netStatus('Verbinde mit Lobby '+esc(code)+' …');
  NET.on=true;NET.client=true;NET.host=false;NET.code=code;NET.name=name;NET.perm=true;NET.lastHost=Date.now();NET.got=false;
  document.body.classList.add('cl');
  let p;try{p=new Peer(undefined,{debug:0})}catch(e){netClientFail('Verbindung nicht möglich.');return}
  NET.peer=p;
  const to=setTimeout(()=>{if(!NET.got)netClientFail('Keine Verbindung zur Lobby.<br><span class="sm">Code falsch, Host weg oder Netzwerk blockiert.</span>')},15000);
  p.on('error',e=>{if(!NET.got){clearTimeout(to);netClientFail('Verbindung fehlgeschlagen ('+((e&&e.type)||'Fehler')+').<br><span class="sm">Stimmt der Code? Läuft die Lobby noch?</span>')}});
  p.on('open',()=>{
    const c=p.connect(PRE+code,{reliable:true,serialization:'json'});NET.conn=c;
    c.on('open',()=>{clearTimeout(to);NET.lastHost=Date.now();c.send({t:'hi',n:name});hbStart();wake()});
    c.on('data',netClientData);
    c.on('close',()=>{if(NET.client&&NET.conn===c)netClientLost()});
    c.on('error',()=>{});
  });
  $('lv').style.display='block';$('lv').textContent='🌐 '+code+' · '+name+'  ✕';
}
function netClientFail(msg){
  netCleanup();
  scr(`${logo('Online')}<div class="card" style="text-align:center"><div style="font-size:42px">😕</div><p style="margin:8px 0 0">${msg}</p></div><button onclick="history.replaceState(null,'',location.pathname);home()">← Zurück</button>`);
}
let lostInfo=null;
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&lostInfo&&!NET.on){const l=lostInfo;lostInfo=null;netJoin(l.code,l.name)}});
function netClientLost(){
  const code=NET.code,name=NET.name;
  netCleanup();lostInfo={code,name};
  scr(`${logo('Online')}<div class="card" style="text-align:center"><div style="font-size:42px">📡</div><p style="margin:8px 0 0">Verbindung zur Lobby getrennt.</p></div><button onclick="netJoin('${esc(code)}','${esc(name)}')">Erneut verbinden</button><button class="sec" onclick="history.replaceState(null,'',location.pathname);home()">Beenden</button>`);
}
function netLeave(){
  if(!NET.client)return;lostInfo=null;
  netCleanup();history.replaceState(null,'',location.pathname);home();
}
function netCleanup(){
  hbStop();
  try{NET.conn&&NET.conn.close()}catch(e){}
  try{NET.peer&&NET.peer.destroy()}catch(e){}
  NET.on=false;NET.client=false;NET.conn=null;NET.peer=null;NET.got=false;
  document.body.classList.remove('cl','noperm');$('lv').style.display='none';
}
/* HTML vom Host einsetzen: Handler entschärfen (Klicks gehen an den Host) */
function strip(root){
  root.querySelectorAll('*').forEach(e=>{
    for(const a of Array.from(e.attributes)){
      if(a.name.length>2&&a.name.slice(0,2)==='on'){e.setAttribute('data-h-'+a.name.slice(2),'1');e.removeAttribute(a.name)}
    }
  });
}
function parseInto(el,html){
  const t=document.createElement('template');t.innerHTML=html;
  strip(t.content);
  el.replaceChildren(t.content);
}
function netClientData(d){
  if(!d||typeof d!=='object')return;
  NET.lastHost=Date.now();NET.got=true;
  if(d.t==='welcome'){NET.idx=d.idx;if(d.name&&d.name!==NET.name){NET.name=d.name;$('lv').textContent='🌐 '+NET.code+' · '+d.name+'  ✕'}}
  else if(d.t==='full'||d.t==='wait'){
    parseInto(app,String(d.html||''));window.scrollTo(0,0);
    if(d.t==='full'&&NET.perm){const i=app.querySelector('input.num,input.txt');if(i)setTimeout(()=>{try{i.focus()}catch(e){}},120)}
  }
  else if(d.t==='mut'&&Array.isArray(d.ops)){
    for(const o of d.ops){
      const el=app.querySelector('[data-n="'+(+o.n)+'"]');if(!el)continue;
      if(o.o==='h')parseInto(el,String(o.h||''));
      else if(o.o==='a'&&typeof o.k==='string'){
        if(o.k.slice(0,2)==='on'){if(o.v!=null)el.setAttribute('data-h-'+o.k.slice(2),'1');continue}
        if(o.v==null)el.removeAttribute(o.k);else el.setAttribute(o.k,String(o.v));
      }
    }
  }
  else if(d.t==='perm'){NET.perm=!!d.ok;document.body.classList.toggle('noperm',!NET.perm)}
  else if(d.t==='fx'){
    try{
      if(d.k==='s'&&sfx[d.a[0]])sfx[d.a[0]]();
      else if(d.k==='confetti')confetti.apply(null,d.a);
      else if(d.k==='flash')flash.apply(null,d.a);
      else if(d.k==='vib')vib.apply(null,d.a);
    }catch(e){}
  }
  else if(d.t==='bye'){const w=d.why||'Die Lobby wurde beendet.';netCleanup();scr(`${logo('Online')}<div class="card" style="text-align:center"><div style="font-size:42px">👋</div><p style="margin:8px 0 0">${esc(w)}</p></div><button onclick="history.replaceState(null,'',location.pathname);home()">← Zurück</button>`)}
}
/* Eingaben des Clients → Host */
function sendC(o){try{if(NET.conn&&NET.conn.open)NET.conn.send(Object.assign({t:'ev'},o))}catch(e){}}
function inVals(){const v={};app.querySelectorAll('input[data-n],textarea[data-n]').forEach(e=>{v[e.getAttribute('data-n')]=e.value});return v}
let lastMv=0,pendMv=null,mvT=0;
document.addEventListener('click',e=>{
  if(!NET.client||!e.target.closest)return;
  const t=e.target.closest('[data-h-click]');if(!t||!app.contains(t))return;
  e.preventDefault();
  if(!NET.perm){toast('Das macht gerade jemand anderes');return}
  sendC({ty:'click',n:+t.getAttribute('data-n'),vals:inVals()});
});
['pointerdown','pointermove','pointerup','pointercancel'].forEach(ty=>document.addEventListener(ty,e=>{
  if(!NET.client||!e.target.closest)return;
  let t=e.target.closest('[data-ptr]');
  if(!t&&ty==='pointerdown')t=e.target.closest('[data-h-pointerdown]');
  if(!t||!app.contains(t))return;
  if(!NET.perm)return;
  if(ty==='pointerdown'&&t.hasAttribute('data-ptr')){try{t.setPointerCapture(e.pointerId)}catch(_){}}
  const r=t.getBoundingClientRect();
  const pkt={ty,n:+t.getAttribute('data-n'),rx:r.width?(e.clientX-r.left)/r.width:0,ry:r.height?(e.clientY-r.top)/r.height:0};
  if(ty==='pointermove'){
    const n=Date.now();
    if(n-lastMv<30){pendMv=pkt;if(!mvT)mvT=setTimeout(()=>{mvT=0;if(pendMv){lastMv=Date.now();sendC(pendMv);pendMv=null}},35);return}
    lastMv=n;pendMv=null;
  }else if(pendMv){sendC(pendMv);pendMv=null}
  sendC(pkt);
  if(ty==='pointerdown'&&t.hasAttribute('data-ptr'))e.preventDefault();
}));
document.addEventListener('input',e=>{
  if(!NET.client||!NET.perm)return;const t=e.target;
  if(!t||!t.getAttribute||!t.getAttribute('data-n')||!app.contains(t))return;
  sendC({ty:'in',n:+t.getAttribute('data-n'),v:t.value});
});
document.addEventListener('keydown',e=>{
  if(!NET.client||!NET.perm||e.key!=='Enter')return;const t=e.target;
  if(!t||!t.getAttribute||!/^(INPUT|TEXTAREA)$/.test(t.tagName)||!t.getAttribute('data-n')||!app.contains(t))return;
  sendC({ty:'key',n:+t.getAttribute('data-n'),v:t.value});
});
